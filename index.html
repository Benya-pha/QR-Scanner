    <script>

    <style>
        :root {
            --color-primary: #8cb1ff;
            --color-primary-light: rgba(140, 177, 255, 0.15);
            --bg-color: #f8fafc;
        }
        .dark { --bg-color: #121212; }
        
        * { font-family: 'Plus Jakarta Sans', 'CS Prajad', sans-serif; -webkit-tap-highlight-color: transparent; outline: none; }
        body, html, #root { width: 100%; height: 100dvh; margin: 0; padding: 0; overflow: hidden; background-color: var(--bg-color); }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        
        .app-container { width: 100%; height: 100%; position: relative; display: flex; flex-direction: column; overflow: hidden; background-color: var(--bg-color); color: #475569; transition: background-color 0.5s ease; }
        .dark .app-container { color: #f8fafc; }
        video { object-fit: cover; width: 100%; height: 100%; position: absolute; inset: 0; pointer-events: none; }
        
        .fade-in { animation: fadeIn 0.4s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
        .slide-up { animation: slideUp 0.5s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        @keyframes slideUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
        .no-motion * { transition: none !important; animation: none !important; }

        .soft-shadow { box-shadow: 0 10px 30px -10px rgba(0,0,0,0.05); }
        .dark .soft-shadow { box-shadow: 0 10px 30px -10px rgba(0,0,0,0.3); }
        
        .scan-frame { position: absolute; top: 15%; bottom: 30%; left: 10%; right: 10%; border-radius: 36px; box-shadow: 0 0 0 9999px rgba(0, 0, 0, 0.6); z-index: 10; border: 2px solid rgba(255,255,255,0.4); }
        @keyframes scanLine { 0% { top: 0; opacity: 0; } 10% { opacity: 1; } 90% { opacity: 1; } 100% { top: 100%; opacity: 0; } }
        .laser { position: absolute; width: 100%; height: 3px; background: var(--color-primary); box-shadow: 0 0 20px var(--color-primary); animation: scanLine 2.5s cubic-bezier(0.4, 0, 0.2, 1) infinite; z-index: 11; border-radius: 10px; }

        .toggle-checkbox:checked { right: 0; border-color: var(--color-primary); }
        .toggle-checkbox:checked + .toggle-label { background-color: var(--color-primary); }
        input[type="color"] { -webkit-appearance: none; border: none; width: 100%; height: 100%; border-radius: 50%; overflow: hidden; cursor: pointer; padding: 0; }
        input[type="color"]::-webkit-color-swatch-wrapper { padding: 0; }
        input[type="color"]::-webkit-color-swatch { border: none; border-radius: 50%; }
        input[type="number"]::-webkit-inner-spin-button, input[type="number"]::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }
        input[type="date"]::-webkit-calendar-picker-indicator { opacity: 0.5; cursor: pointer; }

        /* Pure CSS Spinner 100% Centered */
        .pure-css-spinner {
            width: 48px;
            height: 48px;
            border: 4px solid var(--color-primary-light);
            border-top: 4px solid var(--color-primary);
            border-radius: 50%;
            animation: pure-spin 1s linear infinite;
            margin-bottom: 1.5rem;
        }
        @keyframes pure-spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useCallback, useRef, useMemo } = React;

        // ==========================================
        // 1. FIREBASE INIT
        // ==========================================
        const fbConfig = { apiKey: "AIzaSyCv1D7XjSuSYWJxpFxT7umaCAb9o8fY2o8", authDomain: "qr-scanner-a29e3.firebaseapp.com", projectId: "qr-scanner-a29e3", storageBucket: "qr-scanner-a29e3.firebasestorage.app", messagingSenderId: "1070573788877", appId: "1:1070573788877:web:cd65246772c629f380d384" };
        if (!firebase.apps.length) firebase.initializeApp(fbConfig);
        const auth = firebase.auth(); const db = firebase.firestore();

        // ==========================================
        // 2. GLOBALS & HELPERS
        // ==========================================
        const APP_ID = typeof __app_id !== 'undefined' ? __app_id : 'qr-scanner-default';
        const getUserRef = (uid) => db.collection('artifacts').doc(APP_ID).collection('users').doc(uid);

        const ACCENT_COLORS = [ { name: 'Blue', hex: '#8cb1ff' }, { name: 'Yellow', hex: '#ffde6a' }, { name: 'Pink', hex: '#ffb0cd' }, { name: 'Green', hex: '#94e4ae' }, { name: 'Purple', hex: '#cda8ff' }, { name: 'Red', hex: '#ff9494' } ];
        const PASTEL_COLORS = ['#ffb0cd', '#ffde6a', '#94e4ae', '#8cb1ff', '#cda8ff', '#ff9494', '#e2e8f0', '#fbcfe8', '#fde047', '#86efac'];
        const lineIconsList = ['wallet', 'plane', 'car', 'gift', 'home', 'coffee', 'piggy-bank', 'shopping-bag', 'heart', 'star', 'music', 'book', 'smartphone', 'monitor', 'camera', 'zap', 'umbrella', 'scissors', 'trending-up', 'award', 'briefcase', 'bus', 'clapperboard', 'gamepad-2', 'headphones', 'key', 'laptop', 'lightbulb', 'map-pin', 'palette', 'pizza', 'shirt', 'smile', 'ticket', 'tv', 'watch', 'wifi', 'utensils', 'train', 'tag'];
        
        const PASTEL_POCKET_ICONS = [
            { icon: 'wallet', bg: '#8cb1ff33', color: '#8cb1ff' },
            { icon: 'piggy-bank', bg: '#ffde6a33', color: '#ffde6a' },
            { icon: 'shopping-bag', bg: '#ffb0cd33', color: '#ffb0cd' },
            { icon: 'car', bg: '#94e4ae33', color: '#94e4ae' },
            { icon: 'home', bg: '#cda8ff33', color: '#cda8ff' },
            { icon: 'plane', bg: '#ff949433', color: '#ff9494' },
            { icon: 'coffee', bg: '#fde04733', color: '#fde047' },
            { icon: 'zap', bg: '#86efac33', color: '#86efac' }
        ];

        const formatMoney = (num) => Number(num || 0).toLocaleString('en-US', {minimumFractionDigits: 2, maximumFractionDigits: 2});
        
        const getDeviceName = () => {
            const ua = navigator.userAgent;
            if (/iPhone/.test(ua)) return 'iPhone';
            if (/iPad/.test(ua)) return 'iPad';
            if (/Macintosh/.test(ua)) return 'MacBook / Mac';
            if (/Windows/.test(ua)) {
                if (/Windows NT 10.0/.test(ua)) return 'Windows 10/11 PC';
                return 'Windows PC';
            }
            if (/Android/.test(ua)) {
                const match = ua.match(/Android.*?; (.*?) Build/);
                return match ? match[1] : 'Android Device';
            }
            if (/Linux/.test(ua)) return 'Linux PC';
            return 'Web Browser';
        };

        const translateAuthError = (code) => {
            if(code.includes('invalid-credential') || code.includes('user-not-found') || code.includes('wrong-password')) return 'อีเมลหรือรหัสผ่านไม่ถูกต้อง';
            if(code.includes('email-already-in-use')) return 'อีเมลนี้ถูกใช้งานแล้ว';
            if(code.includes('weak-password')) return 'รหัสผ่านต้องมีอย่างน้อย 6 ตัวอักษร';
            if(code.includes('invalid-email')) return 'รูปแบบอีเมลไม่ถูกต้อง';
            return `เกิดข้อผิดพลาด: ${code}`;
        };

        // ล็อกขนาด Min-Width / Min-Height และแก้คำสั่งสร้างไอคอนไม่ให้ถูกบีบ
        const Icon = ({ name, size=24, className="", strokeWidth=1.5 }) => {
            const spanRef = useRef(null);
            useEffect(() => { 
                if(spanRef.current && window.lucide) {
                    try { spanRef.current.innerHTML = `<i data-lucide="${name}" class="${className}"></i>`; lucide.createIcons({ root: spanRef.current, attrs: { 'stroke-width': strokeWidth, width: size, height: size } }); } 
                    catch (e) { spanRef.current.innerHTML = `<span style="display:inline-block; width:${size}px; height:${size}px; border-radius:50%;"></span>`; }
                }
            }, [name, size, strokeWidth, className]);
            return <span ref={spanRef} className={`inline-flex items-center justify-center shrink-0 ${className}`} style={{width: size, height: size, minWidth: size, minHeight: size}}></span>;
        };

        // ใช้ Pure CSS Spinner เพื่อความตรงเป๊ะ 100%
        const LoadingOverlay = ({ text }) => (
            <div className="fixed inset-0 bg-white/70 dark:bg-dark/70 backdrop-blur-md z-[100] flex flex-col items-center justify-center fade-in">
                <div className="pure-css-spinner"></div>
                <h2 className="font-bold text-xl tracking-widest uppercase text-slate-700 dark:text-white">{text}</h2>
            </div>
        );

        // 🌟 ฟังก์ชัน Export เป็นไฟล์ Excel (.csv) 🌟
        const exportToCSV = (txs, pockets) => {
            const headers = ['Date', 'Title', 'Category', 'Amount (THB)', 'Pocket', 'Notes'];
            const rows = txs.map(tx => {
                const pocket = pockets.find(p => p.id === tx.pocketId);
                const pocketName = pocket ? pocket.name : 'None';
                // ป้องกันปัญหาการตัดคำด้วย Comma
                const title = `"${(tx.title || '').replace(/"/g, '""')}"`;
                const notes = `"${(tx.notes || '').replace(/"/g, '""')}"`;
                return `${tx.date},${title},${tx.category},${tx.amount},"${pocketName}",${notes}`;
            });
            // \uFEFF คือ UTF-8 BOM เพื่อให้โปรแกรม Excel รองรับภาษาไทยได้สมบูรณ์
            const csvContent = "\uFEFF" + [headers.join(','), ...rows].join('\n');
            const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
            const url = URL.createObjectURL(blob);
            const link = document.createElement("a");
            link.setAttribute("href", url);
            link.setAttribute("download", `Transactions_${new Date().toISOString().split('T')[0]}.csv`);
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        };

        // 🌟 Component หน้าทักทาย (Greeting Splash Screen) 🌟
        const GreetingScreen = ({ userName, onComplete }) => {
            const [fading, setFading] = useState(false);
            useEffect(() => {
                const timer1 = setTimeout(() => setFading(true), 2000);
                const timer2 = setTimeout(() => onComplete(), 2500);
                return () => { clearTimeout(timer1); clearTimeout(timer2); };
            }, [onComplete]);

            const hour = new Date().getHours();
            let greeting = 'Good night';
            if (hour >= 5 && hour < 12) greeting = 'Good morning';
            else if (hour === 12) greeting = 'Good noon';
            else if (hour > 12 && hour < 17) greeting = 'Good afternoon';

            return (
                <div className={`fixed inset-0 bg-white dark:bg-dark z-[999] flex flex-col items-center justify-center transition-opacity duration-500 ${fading ? 'opacity-0' : 'opacity-100'}`}>
                    <h1 className="text-4xl font-bold text-slate-800 dark:text-white mb-4 slide-up">{greeting}</h1>
                    <p className="text-2xl font-bold text-primary slide-up" style={{animationDelay: '0.1s', opacity: 0, animationFillMode: 'forwards'}}>{userName}</p>
                </div>
            );
        };

        const categorizeText = (text) => {
            const tText = text.toLowerCase();
            if (tText.match(/น้ำปั่น|ครัว|coffee|คาเฟ่|อาหาร|เครื่องดื่ม|ข้าว|ชา|นม|food|drink|ปลา|หมู|ไก่|เนื้อ|กุ้ง|เบเกอรี่|ขนม|เค้ก|ชาบู|ปิ้งย่าง|สุกี้|restaurant|cafe/)) return { cat: 'Food & Drink', icon: 'coffee', color: '#ff9800' };
            if (tText.match(/shop|ร้าน|ช้อป|โลตัส|เซเว่น|7-11|บิ๊กซี|มินิมาร์ท|ซื้อ|mart|ค้า|supermarket|mall|store/)) return { cat: 'Shopping', icon: 'shopping-bag', color: '#ffde6a' };
            if (tText.match(/นาย|นาง|น\.ส\.|ด\.ช\.|ด\.ญ\.|คุณ|โอนเงิน/)) return { cat: 'Transfer', icon: 'users', color: '#8cb1ff' };
            if (tText.match(/บิล|การไฟฟ้า|การประปา|ais|true|dtac|ค่าเน็ต|ค่าไฟ|ค่าน้ำ|bill|ประกัน|สินเชื่อ|บัตรเครดิต|ชำระ/)) return { cat: 'Bills', icon: 'zap', color: '#ff9494' };
            if (tText.match(/น้ำมัน|ปั๊ม|ptt|pt|shell|bangchak|caltex|gas/)) return { cat: 'Transport', icon: 'car', color: '#94e4ae' };
            return { cat: 'General', icon: 'receipt', color: '#94a3b8' };
        };

        // 🌟 Component กราฟแท่ง Interactive (ใช้ร่วมกันได้ทุกหน้า) 🌟
        const InteractiveBarChart = ({ data, color, defaultColor = 'var(--color-primary-light)' }) => {
            const [activeIndex, setActiveIndex] = useState(null);
            const maxVal = Math.max(...data.map(d => d.value), 1);

            return (
                <div className="relative h-full w-full flex items-end justify-between gap-1 sm:gap-2 pt-10 pb-1">
                    {activeIndex !== null && data[activeIndex] && (
                        <div className="absolute top-0 left-0 right-0 flex justify-center z-20 pointer-events-none fade-in">
                            <div className="bg-slate-800 dark:bg-white text-white dark:text-slate-900 text-xs font-bold py-1.5 px-4 rounded-full shadow-lg flex flex-col items-center">
                                <span className="text-[9px] opacity-80 font-medium mb-0.5">{data[activeIndex].fullLabel}</span>
                                <span>฿ {formatMoney(data[activeIndex].value)}</span>
                            </div>
                        </div>
                    )}
                    {data.map((item, i) => {
                        const heightPct = item.value === 0 ? 0 : Math.max(5, (item.value / maxVal) * 100);
                        const isActive = activeIndex === i;
                        // ปรับ Opacity เมื่อไม่ Hover ให้เข้มขึ้นเป็น 0.6 แทน 0.4 (เข้มขึ้น 20%)
                        const barColor = item.value > 0 ? (isActive ? color : defaultColor) : defaultColor;
                        const opacity = item.value > 0 ? (isActive ? 1 : 0.6) : 0.2;
                        return (
                            <div key={i} className="flex flex-col items-center flex-1 h-full justify-end cursor-pointer group" onMouseEnter={() => setActiveIndex(i)} onMouseLeave={() => setActiveIndex(null)} onTouchStart={() => setActiveIndex(i)}>
                                <div className="w-full rounded-t-md transition-all duration-300 ease-out" style={{ height: `${heightPct}%`, backgroundColor: barColor, opacity: opacity, transform: isActive && item.value > 0 ? 'scaleY(1.05)' : 'scaleY(1)', transformOrigin: 'bottom' }}></div>
                                <span className={`text-[9px] font-bold mt-1.5 truncate max-w-[120%] text-center transition-colors ${isActive ? 'text-slate-800 dark:text-white' : 'text-slate-400'}`}>{item.label}</span>
                            </div>
                        );
                    })}
                </div>
            );
        };

        const processReceiptImage = async (file, onComplete) => {
            try {
                const worker = await Tesseract.createWorker('tha+eng'); const ret = await worker.recognize(file); const rawText = ret.data.text; const lines = rawText.split('\n').map(l => l.trim()).filter(l => l.length > 0); await worker.terminate();
                let finalAmount = ''; let merchant = ''; let dateStr = new Date().toISOString().split('T')[0]; let memoText = '';
                const amountRegex = /(?:จำนวนเงิน|จำนวน|ยอดรวม|ยอดเงิน|รวมทั้งสิ้น|Total|Amount|฿|B)[^\d]*(\d{1,3}(?:,\d{3})*(?:\.\d{2})?)/i;
                for(let line of lines) { const match = line.match(amountRegex); if(match && match[1]) { finalAmount = parseFloat(match[1].replace(/,/g, '')).toFixed(2); break; } }
                if (!finalAmount || finalAmount === '0.00') { const numbers = rawText.match(/\b\d{1,3}(?:,\d{3})*\.\d{2}\b/g); if (numbers && numbers.length > 0) { const vals = numbers.map(n => parseFloat(n.replace(/,/g, ''))); finalAmount = Math.max(...vals).toFixed(2); } }
                let foundTo = false;
                for (let i = 0; i < lines.length; i++) {
                    const line = lines[i];
                    if (line.match(/(บันทึกช่วยจำ|บันทึก|Memo)/i)) { const cleanMemo = line.replace(/(บันทึกช่วยจำ|บันทึก|Memo)[\s.:]*/i, '').trim(); if (cleanMemo) memoText = cleanMemo; else if (i + 1 < lines.length) memoText = lines[i+1]; }
                    const dateMatch = line.match(/(\d{4}[\/\-]\d{1,2}[\/\-]\d{1,2})|(\d{1,2}[\/\-\. ]\d{1,2}[\/\-\. ]\d{2,4})/);
                    if(dateMatch) {
                        let d = dateMatch[0];
                        if(d.includes('/')) d = d.split('/').reverse().join('-');
                        dateStr = d;
                    }
                    if (line.match(/^(ถึง|ไปยัง|ผู้รับโอน|ชื่อบัญชี|To)/i)) { let cleanMerchant = line.replace(/^(ถึง|ไปยัง|ผู้รับโอน|ชื่อบัญชี|To)[\s.:]*/i, '').trim(); if (cleanMerchant.length < 3 && i + 1 < lines.length) cleanMerchant = lines[i+1].trim(); cleanMerchant = cleanMerchant.replace(/(ธนาคาร|พร้อมเพย์|PromptPay|KBank|SCB|KTB|BBL|GSB)/ig, '').trim(); if (cleanMerchant.length > 2) { merchant = cleanMerchant; foundTo = true; } }
                    if (!foundTo && !merchant && line.match(/(นาย|นาง|น\.ส\.|บจก|หจก|บริษัท|ร้าน|SHOP|ครัว|คาเฟ่|cafe|มินิมาร์ท|ตลาด)/i)) { if(!line.match(/^(จาก|ผู้โอน)/i)) merchant = line.replace(/^(จาก|ผู้โอน)[\s.:]*/i, '').trim(); }
                }
                if (!merchant && finalAmount) { if(lines.length > 0) merchant = lines[0]; if(merchant.match(/ใบเสร็จ|Receipt|รับเงิน/i) && lines.length > 1) merchant = lines[1]; }
                let finalTitle = memoText || merchant || 'รายการใช้จ่าย'; finalTitle = finalTitle.replace(/(รหัสอ้างอิง|เลขอ้างอิง|Ref|วันที่).*/i, '').trim();
                const categoryInfo = categorizeText(finalTitle + ' ' + rawText);
                const resultData = { amount: finalAmount || '', merchant: finalTitle, date: dateStr, categoryKey: categoryInfo.cat, icon: categoryInfo.icon, color: categoryInfo.color, isAuto: true };
                
                if (typeof file === 'string') { onComplete({ ...resultData, imageUrl: file }); } 
                else { const reader = new FileReader(); reader.onload = (ev) => onComplete({ ...resultData, imageUrl: ev.target.result }); reader.readAsDataURL(file); }
            } catch (error) {
                let imgData = null; if (typeof file === 'string') imgData = file; else if (file instanceof Blob) { const reader = new FileReader(); reader.onload = (e) => onComplete({ amount: '', merchant: '', date: new Date().toISOString().split('T')[0], categoryKey: 'General', icon: 'receipt', color: '#64748b', isAuto: false, imageUrl: e.target.result }); reader.readAsDataURL(file); return; }
                onComplete({ amount: '', merchant: '', date: new Date().toISOString().split('T')[0], categoryKey: 'General', icon: 'receipt', color: '#64748b', isAuto: false, imageUrl: imgData });
            }
        };

        const TRANSLATIONS = {
            TH: {
                welcome: 'Welcome', home: 'หน้าหลัก', wallet: 'กระเป๋า', scan: 'สแกน', history: 'ประวัติ', profile: 'โปรไฟล์',
                totalSpend: 'ยอดใช้จ่ายรวม', safeSpend: 'ยอดเงินคงเหลือ', recent: 'รายการล่าสุด', seeAll: 'ดูทั้งหมด',

        // ==========================================
        // 5. SCREENS
        // ==========================================
        const HomeScreen = ({ user, txs, pockets, safeToSpend, visibleNotifications, go, t, Icon }) => {
            const totalSpend = txs.reduce((a,c) => a + Number(c.amount), 0);
            
            // การจัดการกราฟหน้า Home
            const [homeChartRange, setHomeChartRange] = useState('Weekly');
            const { homeChartData, avgPerDay } = useMemo(() => {
                const getD = (dStr) => { const [y,m,d] = dStr.split('-'); return new Date(y, m-1, d); };
                let data = []; let sum = 0; let days = 1;
                const today = new Date(); today.setHours(0,0,0,0);
                if (homeChartRange === 'Daily') {
                    const recent = [...txs].slice(0, 7).reverse(); 
                    data = recent.map(tx => ({ label: (tx.title || 'Tx').substring(0, 4) + '..', fullLabel: tx.date + ' ' + (tx.title || ''), value: Math.abs(Number(tx.amount)) }));
                    sum = data.reduce((a, b) => a + b.value, 0);
                    if (recent.length > 1) {
                        const minDate = getD(recent[0].date); const maxDate = getD(recent[recent.length-1].date);
                        days = Math.max(1, Math.floor((maxDate.getTime() - minDate.getTime()) / (1000*60*60*24)) + 1);
                    } else { days = 1; }
                } else if (homeChartRange === 'Weekly') {
                    days = 7;
                    for (let i = 6; i >= 0; i--) {
                        const d = new Date(today); d.setDate(d.getDate() - i);
                        const dStr = `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
                        const dayTxs = txs.filter(t => {
                            let txDMatch = t.date;
                            if(txDMatch && txDMatch.includes('/')) {
                                const parts = txDMatch.split('/');
                                if(parts[2] && parts[2].length === 4) txDMatch = `${parts[2]}-${parts[1].padStart(2,'0')}-${parts[0].padStart(2,'0')}`;
                            }
                            return txDMatch === dStr;
                        });
                        const daySum = dayTxs.reduce((a, b) => a + Math.abs(Number(b.amount)), 0);
                        data.push({ label: i === 0 ? t('today') : `${d.getDate()}/${d.getMonth()+1}`, fullLabel: `${d.getDate()}/${d.getMonth()+1}/${d.getFullYear()}`, value: daySum });
                        sum += daySum;
                    }
                } else if (homeChartRange === 'Monthly') {
                    days = 28;
                    for (let i = 3; i >= 0; i--) {
                        const startD = new Date(today); startD.setDate(startD.getDate() - (i*7 + 6));
                        const endD = new Date(today); endD.setDate(endD.getDate() - (i*7));
                        let weekSum = 0;
                        txs.forEach(t => { 
                            let txDMatch = t.date;
                            if(txDMatch && txDMatch.includes('/')) {
                                const parts = txDMatch.split('/');
                                if(parts[2] && parts[2].length === 4) txDMatch = `${parts[2]}-${parts[1].padStart(2,'0')}-${parts[0].padStart(2,'0')}`;
                            }
                            const td = getD(txDMatch); 
                            if (td >= startD && td <= endD) weekSum += Math.abs(Number(t.amount)); 
                        });
                        data.push({ label: `W${4-i}`, fullLabel: `${startD.getDate()}/${startD.getMonth()+1} - ${endD.getDate()}/${endD.getMonth()+1}`, value: weekSum });
                        sum += weekSum;
                    }
                } else if (homeChartRange === 'Yearly') {
                    days = 365;
                    for (let i = 11; i >= 0; i--) {
                        const d = new Date(today.getFullYear(), today.getMonth() - i, 1);
                        const targetY = d.getFullYear(); const targetM = d.getMonth() + 1;
                        let monthSum = 0;
                        txs.forEach(t => { 
                            let txDMatch = t.date;
                            if(txDMatch && txDMatch.includes('/')) {
                                const parts = txDMatch.split('/');
                                if(parts[2] && parts[2].length === 4) txDMatch = `${parts[2]}-${parts[1].padStart(2,'0')}-${parts[0].padStart(2,'0')}`;
                            }
                            const td = getD(txDMatch); 
                            if (td.getFullYear() === targetY && (td.getMonth()+1) === targetM) monthSum += Math.abs(Number(t.amount)); 
                        });
                        const monthNames = ["ม.ค.","ก.พ.","มี.ค.","เม.ย.","พ.ค.","มิ.ย.","ก.ค.","ส.ค.","ก.ย.","ต.ค.","พ.ย.","ธ.ค."];
                        data.push({ label: monthNames[d.getMonth()], fullLabel: `${monthNames[d.getMonth()]} ${targetY}`, value: monthSum });
                        sum += monthSum;
                    }
                }
                return { homeChartData: data, avgPerDay: sum / days };
            }, [txs, homeChartRange, t]);

                        </div>
                        <div className="flex items-center gap-2 shrink-0">

                                <Icon name="bell" size={20}/>{visibleNotifications.length > 0 && <span className="absolute top-2 right-2 w-2.5 h-2.5 bg-danger rounded-full border-2 border-white dark:border-slate-800 shrink-0"></span>}
                            </button>
                        </div>
                    </div>
                    
                    <div className="bg-primary p-6 rounded-[32px] text-white mb-4 relative overflow-hidden transition-colors">
                        <div className="absolute -top-20 -right-20 w-64 h-64 bg-white/20 rounded-full blur-3xl"></div>
                        <p className="text-xs font-bold text-white/80 uppercase tracking-widest mb-1">{t('totalSpend')}</p>
                        <h1 className="text-4xl font-bold">฿ {formatMoney(totalSpend)}</h1>
                    </div>
                    
                    {/* กล่องภาพรวมรายจ่าย */}
                    <div className="bg-white dark:bg-slate-900 p-6 rounded-[32px] soft-shadow mb-8 border border-slate-100 dark:border-slate-800">
                        <div className="flex justify-between items-center mb-4">
                            <h3 className="font-bold text-sm dark:text-white flex items-center gap-2"><Icon name="bar-chart-3" size={16}/> {t('spendingOverview')}</h3>
                            <select value={homeChartRange} onChange={e=>setHomeChartRange(e.target.value)} className="bg-slate-50 dark:bg-slate-800 text-[10px] font-bold px-3 py-1.5 rounded-full outline-none text-slate-600 dark:text-slate-300 border border-slate-100 dark:border-slate-700">
                                <option value="Daily">{t('daily')}</option>
                                <option value="Weekly">{t('weekly')}</option>
                                <option value="Monthly">{t('monthly')}</option>
                                <option value="Yearly">{t('yearly')}</option>
                            </select>
                        </div>
                        <div className="h-40">
                            {homeChartData.length > 0 ? (<InteractiveBarChart data={homeChartData} color="var(--color-primary)" />) : (<div className="flex items-center justify-center h-full text-xs font-bold text-slate-400">{t('noData')}</div>)}
                        </div>
                        <div className="mt-4 pt-4 border-t border-slate-50 dark:border-slate-800 flex justify-between items-center">
                            <span className="text-[10px] font-bold text-slate-400 uppercase tracking-widest">Average / Day</span>
                            <span className="font-bold text-sm text-slate-700 dark:text-white">฿ {formatMoney(avgPerDay)}</span>
                        </div>
                    </div>
                    
                    <div className="flex justify-between items-end mb-4"><h3 className="text-xl font-bold dark:text-white">{t('recent')}</h3><button onClick={()=>go('MAIN','HISTORY')} className="text-xs font-bold text-primary uppercase tracking-widest hover:underline px-3 py-1 rounded-full">{t('seeAll')}</button></div>
                    <div className="space-y-3">

                        setTimeout(() => {

            // เปลี่ยน Logic คำนวณเป็นยอดที่ใช้ไป เทียบกับ เป้าหมาย 
            const totalSpent = pocketTxs.reduce((sum, tx) => sum + Math.abs(Number(tx.amount)), 0);
            const pct = pocket.hasTarget && pocket.target > 0 ? Math.min((totalSpent / pocket.target) * 100, 100) : 0;
            const leftAmount = Math.max((pocket.target || 0) - totalSpent, 0);

                let data = [];
                const today = new Date(); today.setHours(0,0,0,0);
                
                if (trendRange === 'Weekly') {
                    for (let i = 6; i >= 0; i--) {
                        const d = new Date(today); d.setDate(d.getDate() - i);
                        const dStr = `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
                        const dayTxs = pocketTxs.filter(t => {
                            let txDMatch = t.date;
                            if(txDMatch && txDMatch.includes('/')) {
                                const parts = txDMatch.split('/');
                                if(parts[2] && parts[2].length === 4) txDMatch = `${parts[2]}-${parts[1].padStart(2,'0')}-${parts[0].padStart(2,'0')}`;
                            }
                            return txDMatch === dStr;
                        });
                        const daySum = dayTxs.reduce((a, b) => a + Math.abs(Number(b.amount)), 0);
                        data.push({ label: i === 0 ? t('today') : `${d.getDate()}/${d.getMonth()+1}`, fullLabel: `${d.getDate()}/${d.getMonth()+1}/${d.getFullYear()}`, value: daySum });

                            if (td >= startD && td <= endD) weekSum += Math.abs(Number(t.amount));

                                    <option value="Weekly">{t('weekly')}</option>

                const g = {}; 
                const dateTotals = {};

                const todayStr = today.toISOString().split('T')[0];
                const yesterday = new Date(today); yesterday.setDate(yesterday.getDate() - 1);
                const yStr = yesterday.toISOString().split('T')[0];

                txs.forEach(tx => {
                    let dMatch = tx.date;

                        const parts = dMatch.split('/');

                    }
                    dateTotals[dMatch] = (dateTotals[dMatch] || 0) + Math.abs(Number(tx.amount));
                });

                filteredTxs.forEach(tx => { 
                    let dMatch = tx.date;
                    if(dMatch && dMatch.includes('/')) {
                        const parts = dMatch.split('/');
                        if(parts[2] && parts[2].length === 4) dMatch = `${parts[2]}-${parts[1].padStart(2,'0')}-${parts[0].padStart(2,'0')}`;
                    }
                    
                    let dLabel = dMatch === todayStr ? t('today') : dMatch === yStr ? t('yesterday') : tx.date; 
                    
                    if(!g[dLabel]) {
                        // คำนวณ % การเพิ่มขึ้น/ลดลงจากเมื่อวาน
                        const currentD = new Date(dMatch);
                        const prevD = new Date(currentD);
                        prevD.setDate(prevD.getDate() - 1);
                        const prevDStr = prevD.toISOString().split('T')[0];
                        
                        const currTotal = dateTotals[dMatch] || 0;
                        const prevTotal = dateTotals[prevDStr] || 0;
                        
                        let diffText = null;
                        let diffIsUp = false;
                        
                        if (prevTotal > 0) {
                            const pct = ((currTotal - prevTotal) / prevTotal) * 100;
                            diffIsUp = pct > 0;
                            diffText = `${diffIsUp ? '+' : ''}${pct.toFixed(0)}% ${t('fromYesterday')}`;

                            diffText = `+100% ${t('fromYesterday')}`;
                        } else if (currTotal === 0 && prevTotal > 0) {
                            diffIsUp = false;
                            diffText = `-100% ${t('fromYesterday')}`;

                        {!isEditing && (

        const SplitBillScreen = ({ tx, go, t, Icon }) => {
            const billTotal = Number(tx?.amount || 0);
            const [friends, setFriends] = useState([{id:1, name:'ฉัน', amount:billTotal/2}, {id:2, name:'เพื่อน 1', amount:billTotal/2}]);
            const currentSum = friends.reduce((a,c)=>a+Number(c.amount), 0);
            const isMatch = Math.abs(currentSum - billTotal) < 0.01;

            const updateAmount = (id, val) => setFriends(friends.map(f=>f.id===id?{...f, amount:val}:f));

            return (
                <div className="p-6 pt-10 flex flex-col h-full fade-in bg-[var(--bg-color)]">
                    <div className="flex items-center mb-8"><button onClick={()=>go('TX_DETAIL', null, tx)} className="w-10 h-10 bg-white dark:bg-slate-900 shadow-sm border border-slate-100 dark:border-slate-800 rounded-full flex items-center justify-center active:scale-95 dark:text-white transition-colors hover:bg-slate-50 shrink-0"><Icon name="arrow-left" size={20}/></button><h2 className="font-bold text-xl ml-4 dark:text-white">{t('splitBill')}</h2></div>
                    <div className="bg-white dark:bg-slate-900 rounded-[28px] p-6 text-center mb-6 soft-shadow border border-slate-100 dark:border-slate-800">
                        <p className="text-[10px] font-bold text-slate-400 uppercase tracking-widest">{t('totalAmount')}</p><h1 className="text-4xl font-bold my-2 dark:text-white">฿ {formatMoney(billTotal)}</h1>
                        <div className="flex justify-between items-center mt-4 px-4 bg-slate-50 dark:bg-slate-800 py-3 rounded-xl border border-slate-100 dark:border-slate-700"><span className="text-xs font-bold text-slate-500">แบ่งแล้ว: ฿ {formatMoney(currentSum)}</span><span className={`text-xs font-bold ${isMatch?'text-[#4ea86a]':'text-danger'}`}>เหลือ: ฿ {formatMoney(Math.max(billTotal-currentSum, 0))}</span></div>
                    </div>
                    <div className="flex-1 overflow-y-auto no-scrollbar space-y-3 pb-6">
                        {friends.map(f => (
                            <div key={f.id} className="bg-white dark:bg-slate-900 rounded-[20px] p-3 flex items-center soft-shadow border border-slate-100 dark:border-slate-800 hover:-translate-y-0.5 transition-transform">
                                <div className="flex-1 ml-2 font-bold text-sm dark:text-white">{f.name}</div>
                                <div className="bg-slate-50 dark:bg-slate-800 rounded-xl px-3 py-2 flex items-center transition-colors focus-within:ring-2 ring-primary/20"><span className="text-[10px] font-bold text-slate-400 mr-1">฿</span><input type="number" value={f.amount} onChange={e=>updateAmount(f.id, e.target.value)} className="w-16 bg-transparent text-right font-bold text-primary text-sm outline-none"/></div>
                                {f.name!=='ฉัน' && <button onClick={()=>setFriends(friends.filter(x=>x.id!==f.id))} className="ml-2 text-slate-400 hover:text-danger transition-colors p-1 shrink-0"><Icon name="x" size={16}/></button>}
                            </div>
                        ))}
                        <button onClick={()=>setFriends([...friends,{id:Date.now(), name:`เพื่อน ${friends.length+1}`, amount:0}])} className="w-full py-4 border-2 border-dashed border-slate-200 dark:border-slate-700 rounded-[20px] text-slate-400 font-bold flex items-center justify-center gap-2 hover:bg-white dark:hover:bg-slate-900 transition-colors text-xs uppercase tracking-widest shrink-0"><Icon name="plus" size={16}/> {t('addFriend')}</button>
                    </div>
                    <button disabled={!isMatch} onClick={()=>go('MAIN','HISTORY')} className={`w-full py-5 rounded-full font-bold text-sm tracking-widest shadow-md active:scale-95 transition-all uppercase shrink-0 ${isMatch?'bg-primary text-white hover:shadow-lg hover:-translate-y-0.5':'bg-slate-100 dark:bg-slate-800 text-slate-400 dark:text-slate-600'}`}>{t('confirmSplit')}</button>
                </div>
            );
        };

        const App = () => {
            const [isAuthReady, setIsAuthReady] = useState(false); const [user, setUser] = useState(null);
            const [screen, setScreen] = useState('SIGN_IN'); const [tab, setTab] = useState('HOME'); const [screenData, setScreenData] = useState(null);
            const [lang, setLang] = useState('TH'); const [themeMode, setThemeMode] = useState('Light'); const [reduceMotion, setReduceMotion] = useState(false);
            const [pinCode, setPinCode] = useState(localStorage.getItem('cozy_pin')); const [isLocked, setIsLocked] = useState(!!localStorage.getItem('cozy_pin')); const [showPinModal, setShowPinModal] = useState(false);
            const [txs, setTxs] = useState([]); const [pockets, setPockets] = useState([]); const [dismissedNotifs, setDismissedNotifs] = useState([]);
            const [accentColor, setAccentColor] = useState(localStorage.getItem('cozy_accent') || '#8cb1ff');
            
            // 🌟 State ควบคุมหน้าจอทักทายเมื่อเปิดแอป 🌟
            const hasGreeted = useRef(false);
            const [showGreeting, setShowGreeting] = useState(false);

            const defaultCatIds = ['Food & Drink', 'Shopping', 'Transport', 'Bills'];
            const [userCategories, setUserCategories] = useState([{ id: 'Food & Drink', icon: 'coffee', color: '#ff9800' },{ id: 'Shopping', icon: 'shopping-bag', color: '#ffde6a' },{ id: 'Transport', icon: 'car', color: '#94e4ae' },{ id: 'Bills', icon: 'zap', color: '#ff9494' }]);
            
            const t = useCallback((key) => getT(lang)(key), [lang]);
            const go = useCallback((s, tb = null, data = null) => { setScreen(s); if(tb) setTab(tb); if(data!==undefined) setScreenData(data); }, []);

            useEffect(() => {
                localStorage.setItem('cozy_accent', accentColor);
                document.documentElement.style.setProperty('--color-primary', accentColor);
                
                const hex2rgb = (hex) => {
                    const v = parseInt(hex.replace('#', ''), 16);
                    return [(v >> 16) & 255, (v >> 8) & 255, v & 255];
                };
                const [r, g, b] = hex2rgb(accentColor);
                document.documentElement.style.setProperty('--color-primary-light', `rgba(${r}, ${g}, ${b}, 0.15)`);
                
                const isDark = themeMode === 'Dark' || (themeMode === 'System' && window.matchMedia('(prefers-color-scheme: dark)').matches);
                if (isDark) {
                    document.documentElement.classList.add('dark');
                    document.documentElement.style.setProperty('--bg-color', '#1e1e24');
                } else {
                    document.documentElement.classList.remove('dark');
                    document.documentElement.style.setProperty('--bg-color', '#fffdfb');
                }
            }, [accentColor, themeMode]);

            useEffect(() => {
                const unsub = auth.onAuthStateChanged(u => {
                    setIsAuthReady(true);
                    if(u) {
                        getUserRef(u.uid).onSnapshot(doc => { 
                            const d = doc.data() || {}; 
                            setUser({ 
                                uid: u.uid, 
                                email: u.email, 
                                displayName: d.displayName || u.displayName || u.email.split('@')[0], 
                                photoURL: d.photoURL || u.photoURL || 'https://ui-avatars.com/api/?name=U&background=8cb1ff&color=fff', 
                                bio: d.bio || '' 
                            }); 
                        });
                        if(!isLocked) go('MAIN', 'HOME');
                        getUserRef(u.uid).collection('transactions').orderBy('timestamp', 'desc').onSnapshot(snap => setTxs(snap.docs.map(d => ({ id: d.id, ...d.data() }))));
                        getUserRef(u.uid).collection('pockets').onSnapshot(snap => setPockets(snap.docs.map(d => ({ id: d.id, ...d.data() }))));
                    } else {
                        const localGuest = localStorage.getItem('cozy_guest');
                        if (localGuest) { setUser(JSON.parse(localGuest)); if(!isLocked) go('MAIN', 'HOME'); } else { go('SIGN_IN'); setTxs([]); setPockets([]); setDismissedNotifs([]); }
                    }
                });
                return unsub;
            }, [go, isLocked]);

            // เช็คและแสดงหน้าทักทาย (เมื่อปลดล็อกสำเร็จ และมีประวัติเข้าสู่ระบบแล้วเท่านั้น)
            useEffect(() => {
                if (user && !isLocked && !hasGreeted.current) {
                    setShowGreeting(true);
                    hasGreeted.current = true;
                }
            }, [user, isLocked]);

            const handleResetData = async () => {
                try {
                    if (user && user.uid !== 'mock-uid') {
                        const userRef = getUserRef(user.uid);
                        const tSnap = await userRef.collection('transactions').get();
                        const pSnap = await userRef.collection('pockets').get();
                        const batch = db.batch();
                        tSnap.docs.forEach(d => batch.delete(d.ref));
                        pSnap.docs.forEach(d => batch.delete(d.ref));
                        await batch.commit();
                    } else { setTxs([]); setPockets([]); }
                    go('MAIN', 'HOME');
                } catch(e) { console.error(e); }
            };

            const handleUpdateTx = async (id, newData) => {
                try {
                    if(user && user.uid !== 'mock-uid') {
                        await getUserRef(user.uid).collection('transactions').doc(id).update(newData);
                    } else {
                        setTxs(txs.map(t => t.id === id ? {...t, ...newData} : t));
                    }
                    setScreenData({...screenData, ...newData});
                } catch(e) { console.error(e); }
            };

            const safeToSpend = useMemo(() => pockets.reduce((a,c) => a + Number(c.balance), 0), [pockets]);
            
            // คำนวณ Notifications ใหม่ เพื่อแจ้งเตือนรายวัน/รายอาทิตย์
            const notifications = useMemo(() => {
                const notifs = [];
                // 1. แจ้งเตือนยอดกระเป๋าต่ำ
                if (safeToSpend > 0 && safeToSpend <= 500) notifs.push({ id: 'low-bal', type: 'alert', title: t('lowBalance'), desc: t('safeThreshold'), time: 'Now' });
                pockets.filter(p => p.hasTarget && Number(p.target) > 0).forEach(p => { 
                    if ((Number(p.balance) / Number(p.target)) < 0.3) {
                        notifs.push({ id: `pocket-low-${p.id}`, type: 'alert', title: t('lowBalance'), desc: `${p.name} เหลือเงินน้อยกว่า 30% (฿ ${formatMoney(p.balance)})`, time: 'Now' }); 
                    }
                });
                
                // 2. รายการใหม่
                if (txs.length > 0) { const latest = txs[0]; notifs.push({ id: `tx-${latest.id}`, type: 'receipt', title: t('newTx'), desc: `${latest.title || latest.merchant} ฿ ${formatMoney(latest.amount)}`, time: latest.date }); }

                // 3. สรุปรายจ่ายรายวัน (คำนวณเมื่อวาน เทียบกับ วันก่อนหน้า)
                const today = new Date();
                const yest = new Date(today); yest.setDate(yest.getDate() - 1);
                const dayBefore = new Date(today); dayBefore.setDate(dayBefore.getDate() - 2);
                
                const getStr = (d) => `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
                const yestStr = getStr(yest);
                const dbStr = getStr(dayBefore);

                const totals = {};
                txs.forEach(tx => {
                    let dMatch = tx.date;
                    if(dMatch && dMatch.includes('/')) {
                        const parts = dMatch.split('/');
                        if(parts[2] && parts[2].length === 4) dMatch = `${parts[2]}-${parts[1].padStart(2,'0')}-${parts[0].padStart(2,'0')}`;
                    }
                    totals[dMatch] = (totals[dMatch] || 0) + Math.abs(Number(tx.amount));
                });

                const yTotal = totals[yestStr] || 0;
                const dbTotal = totals[dbStr] || 0;
                if (yTotal > 0 || dbTotal > 0) {
                    let diffPct = 0;
                    if (dbTotal > 0) diffPct = ((yTotal - dbTotal) / dbTotal) * 100;
                    else if (yTotal > 0) diffPct = 100;
                    
                    const dirStr = diffPct > 0 ? t('increased') : t('decreased');
                    notifs.push({
                        id: `daily-sum-${yestStr}`,
                        type: 'alert',
                        title: t('dailySummary'),
                        desc: `${t('yesterdayYouSpent')} ${dirStr} ${Math.abs(diffPct).toFixed(0)}% ${t('fromYesterday')}`,
                        time: '00:00'
                    });
                }

                // 4. สรุปรายจ่ายรายสัปดาห์ (จะเช็คในวันเสาร์ เพื่อสรุป 7 วันล่าสุด เทียบกับ 7 วันก่อนหน้า)
                if (today.getDay() === 6) { // 6 = Saturday
                    let thisWeekTotal = 0; let lastWeekTotal = 0;
                    for(let i=1; i<=7; i++) { const d = new Date(today); d.setDate(d.getDate() - i); thisWeekTotal += (totals[getStr(d)] || 0); }
                    for(let i=8; i<=14; i++) { const d = new Date(today); d.setDate(d.getDate() - i); lastWeekTotal += (totals[getStr(d)] || 0); }
                    if (thisWeekTotal > 0 || lastWeekTotal > 0) {
                        let wDiffPct = 0;
                        if (lastWeekTotal > 0) wDiffPct = ((thisWeekTotal - lastWeekTotal) / lastWeekTotal) * 100;
                        else if (thisWeekTotal > 0) wDiffPct = 100;
                        const wDirStr = wDiffPct > 0 ? t('increased') : t('decreased');
                        notifs.push({
                            id: `weekly-sum-${getStr(yest)}`,
                            type: 'alert',
                            title: t('weeklySummary'),
                            desc: `${t('lastWeekYouSpent')} ${wDirStr} ${Math.abs(wDiffPct).toFixed(0)}% ${t('fromLastWeek')}`,
                            time: '00:00'
                        });
                    }
                }

                return notifs.filter(n => !dismissedNotifs.includes(n.id));
            }, [safeToSpend, pockets, txs, t, dismissedNotifs]);

            if (!isAuthReady) return <div className="flex justify-center items-center h-screen w-screen bg-slate-900 text-white"><div className="pure-css-spinner"></div></div>;
            if (isLocked) return <div className="app-container"><LockScreen Icon={Icon} correctPin={pinCode} onUnlock={()=>{ setIsLocked(false); go(user?'MAIN':'SIGN_IN', user?'HOME':null); }} /></div>;

            const p = { user, setUser, go, t, lang, setLang, themeMode, setThemeMode, accentColor, setAccentColor, reduceMotion, setReduceMotion, pinCode, setPinCode, showPinModal, setShowPinModal, txs, setTxs, pockets, setPockets, screenData, Icon, LoadingOverlay, translateAuthError, visibleNotifications: notifications, clearAllNotifs: ()=>setDismissedNotifs(notifications.map(n=>n.id)), safeToSpend, db, userCategories, setUserCategories, defaultCatIds, onResetData: handleResetData, onUpdateTx: handleUpdateTx };

            return (
                <div className={`app-container ${reduceMotion?'no-motion':''} ${themeMode==='Dark'?'theme-dark':''}`}>
                    {showGreeting && <GreetingScreen userName={user?.displayName} onComplete={() => setShowGreeting(false)} />}
                    {screen === 'SIGN_IN' && <LoginScreen {...p} />}
                    {screen === 'SIGN_UP' && <SignUpScreen {...p} />}
                    {screen === 'FORGOT_PASS' && <ForgotScreen {...p} />}
                    {screen === 'MAIN' && (
                        <MainLayout {...p} tab={tab}>
                            {tab === 'HOME' && <HomeScreen {...p} />}
                            {tab === 'POCKETS' && <PocketsScreen {...p} />}
                            {tab === 'HISTORY' && <HistoryScreen {...p} />}
                            {tab === 'PROFILE' && <ProfileScreen {...p} onLogout={()=>{ auth.signOut(); localStorage.removeItem('cozy_guest'); setUser(null); go('SIGN_IN'); }} />}
                        </MainLayout>
                    )}
                    {screen === 'NOTIFICATIONS' && <NotificationsScreen {...p} />}
                    {screen === 'SCAN' && <ScanScreen {...p} onNext={(d)=>go('REVIEW', null, d)} />}
                    {screen === 'REVIEW' && <ReviewScreen {...p} onConfirm={async (d)=>{ 
                        try {
                            if(user && user.uid !== 'mock-uid') {
                                await getUserRef(user.uid).collection('transactions').add({...d, timestamp: firebase.firestore.FieldValue.serverTimestamp()});
                                if (d.pocketId && d.pocketId !== 'none') { const pkt = pockets.find(pk => pk.id === d.pocketId); if (pkt) await getUserRef(user.uid).collection('pockets').doc(d.pocketId).update({ balance: Number(pkt.balance) - Number(d.amount) }); }
                            } else {
                                setTxs([{id: Date.now().toString(), ...d}, ...txs]);
                                if (d.pocketId && d.pocketId !== 'none') setPockets(pockets.map(pk => pk.id === d.pocketId ? {...pk, balance: Number(pk.balance) - Number(d.amount)} : pk));
                            }
                            go('MAIN','HISTORY'); 
                        } catch (e) { console.error(e); }
                    }} />}
                    {screen === 'ADD_TX' && <AddTxScreen {...p} onSave={async (d)=>{ 
                        try {
                            if(user && user.uid !== 'mock-uid') {
                                await getUserRef(user.uid).collection('transactions').add({...d, timestamp: firebase.firestore.FieldValue.serverTimestamp()});
                                if (d.pocketId && d.pocketId !== 'none') { const pkt = pockets.find(pk => pk.id === d.pocketId); if (pkt) await getUserRef(user.uid).collection('pockets').doc(d.pocketId).update({ balance: Number(pkt.balance) - Number(d.amount) }); }
                            } else {
                                setTxs([{id: Date.now().toString(), ...d}, ...txs]); 
                                if (d.pocketId && d.pocketId !== 'none') setPockets(pockets.map(pk => pk.id === d.pocketId ? {...pk, balance: Number(pk.balance) - Number(d.amount)} : pk));
                            }
                            go('MAIN','HISTORY'); 
                        } catch(e) { console.error(e); }
                    }} />}
                    {screen === 'TX_DETAIL' && <TxDetailScreen {...p} tx={screenData || txs[0]} />}
                    {screen === 'SPLIT_BILL' && <SplitBillScreen {...p} tx={screenData || txs[0]} />}
                    {screen === 'ADD_POCKET' && <AddPocketScreen {...p} onSave={async (pData)=>{ 
                        try { if(user && user.uid !== 'mock-uid') { await getUserRef(user.uid).collection('pockets').add({...pData, timestamp: firebase.firestore.FieldValue.serverTimestamp()}); } else setPockets([...pockets, {id: Date.now().toString(), ...pData}]); go('MAIN', 'POCKETS'); } catch(e){}
                    }} />}
                    {screen === 'POCKET_DETAILS' && <PocketDetailsScreen {...p} pocket={screenData || pockets[0]} />}
                    {screen === 'POCKET_SETTINGS' && <PocketSettingsScreen {...p} pocket={screenData} onUpdate={async (id, data)=>{
                        try { if(user && user.uid !== 'mock-uid') { await getUserRef(user.uid).collection('pockets').doc(id).set(data, {merge: true}); } else setPockets(pockets.map(p => p.id === id ? {...p, ...data} : p)); go('POCKET_DETAILS', null, {...screenData, ...data}); } catch(e){}
                    }} onDelete={async (id)=>{
                        try { 
                            if(user && user.uid !== 'mock-uid') { await getUserRef(user.uid).collection('pockets').doc(id).delete(); } 
                            setPockets(pockets.filter(p => p.id !== id)); 
                            go('MAIN', 'POCKETS'); 
                        } catch(e){ console.error(e); alert('เกิดข้อผิดพลาดในการลบกระเป๋า'); }
                    }} />}
                    {screen === 'EDIT_PROFILE' && <EditProfileScreen {...p} />}
                    {screen === 'SECURITY' && <SecuritySettingsScreen {...p} />}
                    {screen === 'LANGUAGE' && <LanguageSettingsScreen {...p} />}
                    {screen === 'THEME' && <ThemeSettingsScreen {...p} />}
                    {screen === 'NOTIFICATION_SETTINGS' && <NotificationSettingsScreen {...p} />}
                    {showPinModal && <PinPadModal onClose={()=>setShowPinModal(false)} onSave={(pin)=>{ setPinCode(pin); localStorage.setItem('cozy_pin', pin); setShowPinModal(false); }} Icon={Icon} isSet={!!pinCode} t={t} />}
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<ErrorBoundary><App /></ErrorBoundary>);
    </script>
</body>
</html>
