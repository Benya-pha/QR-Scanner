            }, []);

                    setUser(currentUser);
                    if (currentUser) {
                        navigate('MAIN', 'HOME');
                    } else {
                        navigate('SIGN_IN');
                    }
                });
                return () => unsubscribe();
            }, [navigate]);

            // Data Sync
            useEffect(() => {
                if (!user) return;
                const unsubTx = db.collection('users').doc(user.uid).collection('transactions')

                        setTransactions(snap.docs.map(d => ({ id: d.id, ...d.data() })));
                    });
                const unsubPkt = db.collection('users').doc(user.uid).collection('pockets')
                    .onSnapshot(snap => {
                        setPockets(snap.docs.map(d => ({ id: d.id, ...d.data() })));
                    });
                return () => { unsubTx(); unsubPkt(); };
            }, [user]);

                try {
                    setLoginError('');
                    const provider = new firebase.auth.GoogleAuthProvider();
                    provider.setCustomParameters({ prompt: 'select_account' });
                    await auth.signInWithPopup(provider);
                } catch (err) {
                    if (err.code === 'auth/unauthorized-domain') {
                        console.warn("Domain bypass for Preview Environment");
                        // Mock login for preview
                        setUser({ ...mockUserDefault, uid: 'mock-uid' });
                        navigate('MAIN', 'HOME');
                    } else {
                        setLoginError(err.message);
                    }
                }
            };

                if (!user) return;
                await db.collection('users').doc(user.uid).collection('transactions').add({
                    ...data,
                    timestamp: firebase.firestore.FieldValue.serverTimestamp()
                });
                navigate('MAIN', 'HISTORY');
            };

                if (!user) return;
                await db.collection('users').doc(user.uid).collection('pockets').add({
                    ...data,
                    timestamp: firebase.firestore.FieldValue.serverTimestamp()
                });
                navigate('MAIN', 'POCKETS');
            };

            const totalSpend = useMemo(() => transactions.reduce((a,c) => a + (Number(c.amount) || 0), 0), [transactions]);
            const income = 45000;
            const safe = income - totalSpend;

            return (
                <div className="p-6 pt-12 animate-in fade-in duration-500">
                    <div className="flex justify-between items-center mb-8">
                        <div className="flex items-center gap-3">
                            <img src={mockUserDefault.avatar} className="w-12 h-12 rounded-full border-2 border-white shadow-md" alt="avatar"/>
                            <div><p className="text-xs text-slate-500 font-bold">{t('welcome')},</p><h2 className="text-lg font-black text-slate-800">{mockUserDefault.name}</h2></div>
                        </div>
                        <button onClick={()=>navigate('NOTIFICATIONS')} className="p-2 bg-white rounded-full shadow-sm text-[#2F80ED] border border-slate-100">
                            <Icon name="bell" size={20}/>
                        </button>
                    </div>

                    <div className="bg-[#2F80ED] p-8 rounded-[40px] text-white shadow-2xl mb-10 relative overflow-hidden">
                        <div className="absolute top-[-30px] right-[-30px] w-48 h-48 bg-white/10 rounded-full blur-3xl"></div>
                        <p className="text-[10px] text-blue-100 uppercase font-black tracking-[0.2em] mb-1">{t('totalSpend')}</p>
                        <h1 className="text-3xl font-black">฿{totalSpend.toLocaleString()}</h1>
                        
                        <div className="mt-10">
                            <p className="text-[10px] text-blue-100 uppercase font-black tracking-[0.2em] mb-1">{t('safeToSpend')}</p>
                            <h2 className="text-4xl font-black">฿{safe.toLocaleString()}</h2>
                        </div>
                        <div className="h-2 w-full bg-black/10 rounded-full mt-5 overflow-hidden border border-white/5">
                            <div className="h-full bg-[#56CC9D] rounded-full shadow-[0_0_15px_#56CC9D]" style={{ width: `${Math.min((totalSpend/income)*100, 100)}%` }}></div>
                        </div>
                    </div>

                    <div className="flex justify-between items-end mb-5 px-1">
                        <h3 className="text-lg font-black text-slate-800 leading-none">{t('recentActivity')}</h3>
                        <button onClick={()=>navigate('MAIN','HISTORY')} className="text-xs font-black text-[#2F80ED] hover:underline uppercase tracking-widest">{t('seeAll')}</button>
                    </div>
                    <div className="space-y-3">
                        {transactions.length ? transactions.slice(0,3).map(tx => <TransactionItem key={tx.id} tx={tx} onClick={()=>navigate('TRANSACTION_DETAIL')} Icon={Icon} />) : 
                        <p className="text-center py-10 text-slate-300 font-bold">No transactions yet ✨</p>}
                    </div>
                </div>
            );
        };

        const TransactionItem = ({ tx, onClick, Icon }) => (
            <div onClick={onClick} className="bg-white p-4 rounded-3xl flex justify-between items-center shadow-sm border border-slate-100 cursor-pointer hover:shadow-md transition-all active:scale-95">
                <div className="flex items-center gap-4">
                    <div className={`w-12 h-12 rounded-2xl bg-[#2F80ED]/10 text-[#2F80ED] flex items-center justify-center`}>
                        <Icon name={tx.iconName || "coffee"} size={22}/>
                    </div>
                    <div>
                        <h4 className="font-black text-slate-800 text-sm leading-tight">{tx.title}</h4>
                        <p className="text-[10px] font-bold text-slate-400 uppercase tracking-widest mt-1">{tx.category} • {tx.date}</p>
                    </div>
                </div>
                <div className="font-black text-slate-800 text-sm">฿{Number(tx.amount).toLocaleString()}</div>
            </div>
        );

        const HistoryScreen = ({ t, transactions, navigate, Icon }) => (
            <div className="p-6 pt-12 animate-in slide-in-from-right duration-300">
                <h2 className="text-2xl font-black text-slate-800 mb-6">{t('history')}</h2>
                <div className="bg-white border border-slate-100 rounded-[24px] p-4 flex items-center shadow-sm mb-8">
                    <Icon name="search" size={20} className="text-slate-300 mr-3"/>
                    <input placeholder={t('search')} className="bg-transparent outline-none w-full text-sm font-bold text-slate-700" />
                </div>
                <div className="flex gap-2 mb-8 overflow-x-auto no-scrollbar pb-2">
                    {[t('all'), t('food'), t('travel'), t('shopping')].map(c => (
                        <button key={c} className={`px-6 py-2.5 rounded-full text-[10px] font-black uppercase tracking-[0.1em] whitespace-nowrap ${c===t('all')?'bg-[#2F80ED] text-white shadow-xl':'bg-white text-slate-400 border border-slate-100 shadow-sm'}`}>
                            {c}
                        </button>
                    ))}
                </div>
                <div className="space-y-4 pb-20">
                    <h4 className="text-[10px] font-black text-slate-400 uppercase tracking-widest ml-2">{t('today')}</h4>
                    {transactions.length ? transactions.map(tx => <TransactionItem key={tx.id} tx={tx} onClick={()=>navigate('TRANSACTION_DETAIL')} Icon={Icon} />) : 
                    <div className="text-center py-20 bg-white rounded-[32px] border border-slate-50"><p className="text-slate-300 font-bold uppercase tracking-widest">No Data Found</p></div>}
                </div>
            </div>
        );

        const PocketsScreen = ({ t, navigate, pockets, Icon }) => (
            <div className="p-6 pt-12">
                <h2 className="text-2xl font-black text-slate-800 mb-8">{t('wallet')}</h2>
                <div className="grid grid-cols-2 gap-4 mb-8">
                    {pockets.map(p => (
                        <div key={p.id} onClick={()=>navigate('POCKET_DETAILS')} className="bg-white p-6 rounded-[32px] border border-slate-100 shadow-sm cursor-pointer hover:shadow-md active:scale-95 transition-all">
                            <div className="w-12 h-12 rounded-2xl bg-[#56CC9D]/20 text-[#2B9A6F] flex items-center justify-center mb-5">
                                <Icon name={p.iconName || "home"} size={22}/>
                            </div>
                            <h4 className="font-black text-slate-800 text-sm mb-1">{p.name}</h4>
                            <div className="text-lg font-black text-slate-800">฿{Number(p.spent).toLocaleString()}</div>
                            <div className="h-1.5 w-full bg-slate-100 rounded-full mt-4 overflow-hidden"><div className="h-full bg-[#56CC9D]" style={{width:'85%'}}></div></div>
                        </div>
                    ))}
                </div>
                <button onClick={()=>navigate('CREATE_POCKET')} className="w-full py-5 border-2 border-dashed border-[#2F80ED]/30 rounded-[32px] text-[#2F80ED] font-black flex items-center justify-center gap-3 hover:bg-blue-50 transition-colors uppercase tracking-widest text-xs">
                    <Icon name="plus" size={18}/> {t('createNewPocket')}
                </button>
            </div>
        );

            <div className="p-6 pt-12">

                    <div className="relative">
                        <img src={mockUserDefault.avatar} className="w-28 h-28 rounded-full border-[6px] border-white shadow-2xl mb-4 object-cover"/>

                            <Icon name="edit-2" size={14}/>
                        </div>
                    </div>
                    <h1 className="text-2xl font-black text-slate-800">{mockUserDefault.name}</h1>
                    <p className="text-xs font-bold text-slate-400 mt-1 uppercase tracking-widest">{mockUserDefault.email}</p>
                </div>
                <div className="space-y-4">
                    <MenuBtn icon="globe" label={t('language')} onClick={()=>navigate('LANGUAGE_SETTINGS')} IconComp={Icon} />
                    <MenuBtn icon="shield" label={t('security')} onClick={()=>navigate('SECURITY_SETTINGS')} IconComp={Icon} />
                    <MenuBtn icon="bell" label={t('notifications')} onClick={()=>navigate('NOTIFICATION_SETTINGS')} IconComp={Icon} />
                    <MenuBtn icon="palette" label={t('theme')} onClick={()=>navigate('THEME_SETTINGS')} IconComp={Icon} />
                </div>
                <button onClick={onLogout} className="w-full mt-10 py-5 bg-white border-2 border-red-100 text-red-500 font-black rounded-[32px] flex items-center justify-center gap-3 hover:bg-red-50 transition-colors uppercase tracking-widest text-xs shadow-sm">
                    <Icon name="log-out" size={18}/> {t('logout')}
                </button>
            </div>
        );

        const MenuBtn = ({ icon, label, onClick, IconComp }) => (
            <div onClick={onClick} className="flex items-center justify-between bg-white p-5 rounded-[32px] border border-slate-100 cursor-pointer hover:bg-slate-50 transition-all shadow-sm">
                <div className="flex items-center gap-4">
                    <div className="w-10 h-10 bg-[#F7F9FC] rounded-full flex items-center justify-center text-slate-600 border border-slate-100">
                        <IconComp name={icon} size={20}/>
                    </div>
                    <span className="font-bold text-slate-700 text-sm">{label}</span>
                </div>
                <IconComp name="chevron-right" size={18} className="text-slate-300"/>
            </div>
        );

        const LanguageSettingsScreen = ({ t, onBack, setLanguage, language, Icon }) => (
            <div className="p-8 flex flex-col h-full bg-[#F7F9FC]">
                <button onClick={onBack} className="mb-8 p-3 bg-white rounded-full shadow-sm w-fit active:scale-90 transition-all border border-slate-100">
                    <Icon name="chevron-left" size={24} className="text-slate-600"/>
                </button>
                <h2 className="text-2xl font-black text-slate-800 mb-10 leading-none">{t('language')}</h2>
                <div className="space-y-4">
                    {['TH', 'EN'].map(lang => (
                        <div key={lang} onClick={()=>setLanguage(lang)} className={`p-6 rounded-[32px] border-2 flex justify-between items-center cursor-pointer transition-all ${language===lang?'border-[#2F80ED] bg-[#2F80ED]/5 shadow-inner':'border-white bg-white shadow-sm'}`}>
                            <span className={`font-black text-sm ${language===lang?'text-[#2F80ED]':'text-slate-600'}`}>{lang === 'TH' ? 'ภาษาไทย (Thai)' : 'English (US)'}</span>
                            {language===lang && <Icon name="check-circle-2" size={22} className="text-[#2F80ED]"/>}
                        </div>
                    ))}
                </div>
            </div>
        );

        const SecuritySettingsScreen = ({ t, onBack, Icon, language }) => {
            const [hasPin, setHasPin] = useState(true);
            return (
                <div className="p-8 flex flex-col h-full overflow-y-auto bg-[#F7F9FC] no-scrollbar">
                    <button onClick={onBack} className="mb-8 p-3 bg-white rounded-full shadow-sm w-fit border border-slate-100"><Icon name="chevron-left" size={24}/></button>
                    <h2 className="text-2xl font-black text-slate-800 mb-10">{t('security')}</h2>
                    <div className="bg-white rounded-[40px] border border-slate-100 shadow-sm overflow-hidden p-2">
                        <div className="p-5 border-b border-slate-50 flex items-center justify-between">
                            <div className="flex items-center gap-4"><div className="w-10 h-10 bg-slate-50 rounded-2xl flex items-center justify-center text-slate-400"><Icon name="lock" size={18}/></div><span className="font-bold text-slate-700 text-sm">{t('changePass')}</span></div>
                            <Icon name="chevron-right" size={18} className="text-slate-300"/>
                        </div>
                        <div className="p-5 border-b border-slate-50 flex items-center justify-between">
                            <div className="flex items-center gap-4"><div className="w-10 h-10 bg-slate-50 rounded-2xl flex items-center justify-center text-slate-400"><Icon name="layout-grid" size={18}/></div><div><h4 className="font-black text-slate-700 text-sm leading-none mb-1">{t('pinCode')}</h4><p className="text-[10px] font-bold text-slate-400 uppercase">{hasPin?t('pinStatusSet'):t('pinStatusNotSet')}</p></div></div>
                            <button onClick={()=>setHasPin(!hasPin)} className={`text-[10px] font-black px-4 py-2 rounded-xl transition-all uppercase tracking-widest ${hasPin?'bg-slate-100 text-slate-400':'bg-[#2F80ED] text-white shadow-lg'}`}>{hasPin?t('changePin'):t('setPin')}</button>
                        </div>
                        <div className="p-5 flex items-center justify-between">
                            <div className="flex items-center gap-4"><div className="w-10 h-10 bg-slate-50 rounded-2xl flex items-center justify-center text-slate-400"><Icon name="fingerprint" size={18}/></div><span className="font-bold text-slate-700 text-sm">{t('biometric')}</span></div>
                            <Icon name="toggle-right" size={32} className="text-[#56CC9D] cursor-pointer"/>
                        </div>
                    </div>
                    <div className="mt-10">
                        <h4 className="text-[10px] font-black text-slate-400 uppercase tracking-[0.2em] mb-4 ml-4">{t('yourDevices')}</h4>
                        <div className="bg-white p-6 rounded-[32px] border border-slate-100 flex items-center justify-between shadow-sm">
                            <div className="flex gap-4 items-center">
                                <div className="w-10 h-10 bg-[#56CC9D]/10 rounded-2xl flex items-center justify-center text-[#2B9A6F]"><Icon name="smartphone" size={18}/></div>
                                <div><h4 className="font-black text-slate-700 text-sm leading-none mb-1">iPhone 15 Pro</h4><p className="text-[10px] font-bold text-[#56CC9D] uppercase">Active Now</p></div>
                            </div>
                            <span className="text-[10px] font-black text-[#2B9A6F] bg-[#56CC9D]/20 px-3 py-1.5 rounded-full uppercase">{t('currentDevice')}</span>
                        </div>
                    </div>
                </div>
            );
        };

        const ThemeSettingsScreen = ({ t, onBack, reduceMotion, setReduceMotion, Icon }) => (
            <div className="p-8 flex flex-col h-full bg-[#F7F9FC]">
                <button onClick={onBack} className="mb-8 p-3 bg-white rounded-full shadow-sm w-fit border border-slate-100"><Icon name="chevron-left" size={24}/></button>
                <h2 className="text-2xl font-black text-slate-800 mb-10">{t('theme')}</h2>
                <div onClick={()=>setReduceMotion(!reduceMotion)} className="bg-white p-6 rounded-[32px] border border-slate-100 flex justify-between items-center cursor-pointer shadow-sm active:scale-95 transition-all">
                    <div className="flex gap-4 items-center"><div className="w-10 h-10 bg-[#F2C94C]/10 rounded-2xl flex items-center justify-center text-[#D4A017]"><Icon name="sparkles" size={20}/></div><span className="font-black text-slate-700 text-sm uppercase tracking-widest">{t('reduceMotion')}</span></div>
                    <Icon name={reduceMotion ? "toggle-right" : "toggle-left"} size={36} className={reduceMotion ? "text-[#2F80ED]" : "text-slate-200"}/>
                </div>
            </div>
        );

        const ScanReceiptScreen = ({ onBack, onNext, t, Icon }) => (
            <div className="flex-1 bg-[#121212] p-6 flex flex-col items-center justify-center text-white relative">
                <button onClick={onBack} className="absolute top-12 left-6 w-12 h-12 bg-white/10 rounded-full flex items-center justify-center hover:bg-white/20 active:scale-90 transition-all border border-white/5"><Icon name="chevron-left" size={24}/></button>
                <div className="relative w-64 h-64 flex items-center justify-center border-2 border-white/10 rounded-[60px] mb-20">
                    <Icon name="scan-line" size={120} className="text-[#56CC9D] animate-pulse" />
                    <div className="absolute inset-0 bg-gradient-to-t from-[#56CC9D]/20 to-transparent blur-2xl"></div>
                </div>
                <h2 className="text-2xl font-black mb-2 text-center uppercase tracking-widest">{t('scanReceipt')}</h2>
                <p className="text-xs text-slate-500 text-center mb-12 font-bold uppercase tracking-widest">{t('uploadConstraint')}</p>
                <div className="flex gap-10 items-center justify-center w-full">
                    <button className="flex flex-col items-center gap-2 group"><div className="w-16 h-16 bg-white/5 rounded-full flex items-center justify-center border border-white/10 group-active:scale-90 transition-all"><Icon name="image" size={24}/></div><span className="text-[10px] font-black uppercase tracking-widest text-slate-500">{t('gallery')}</span></button>
                    <button onClick={onNext} className="w-24 h-24 bg-[#2F80ED] rounded-full flex items-center justify-center shadow-[0_0_50px_rgba(47,128,237,0.4)] border-[10px] border-white/10 active:scale-95 transition-all"><Icon name="camera" size={36}/></button>
                    <button onClick={onNext} className="flex flex-col items-center gap-2 group"><div className="w-16 h-16 bg-white/5 rounded-full flex items-center justify-center border border-white/10 group-active:scale-90 transition-all"><Icon name="edit-2" size={24}/></div><span className="text-[10px] font-black uppercase tracking-widest text-slate-500">{t('manual')}</span></button>
                </div>
            </div>
        );

        // Required placeholders for functionality
        const SignUpScreen = ({ t, navigate, Icon }) => <div className="p-8 flex flex-col h-full bg-[#F7F9FC]"><button onClick={()=>navigate('SIGN_IN')} className="mb-10"><Icon name="chevron-left" size={24}/></button><h2 className="text-3xl font-black mb-10 text-center">{t('signUp')}</h2><button onClick={()=>navigate('SIGN_IN')} className="bg-[#2F80ED] text-white p-5 rounded-full font-black uppercase tracking-widest shadow-xl">Create Account</button></div>;
        const ForgotPasswordScreen = ({ t, onBack, Icon }) => <div className="p-8 flex flex-col h-full bg-[#F7F9FC]"><button onClick={onBack} className="mb-10"><Icon name="chevron-left" size={24}/></button><h2 className="text-3xl font-black mb-10 text-center">{t('forgotPassword')}</h2><button onClick={onBack} className="bg-[#2F80ED] text-white p-5 rounded-full font-black uppercase tracking-widest shadow-xl">Send Reset Link</button></div>;
        const ReviewReceiptScreen = ({ t, onConfirm, onBack, Icon, language }) => <div className="p-8 flex flex-col h-full bg-[#F7F9FC]"><button onClick={onBack} className="mb-8"><Icon name="chevron-left" size={24}/></button><h2 className="text-2xl font-black mb-10">{t('reviewDetails')}</h2><div className="bg-white p-10 rounded-[40px] shadow-sm border border-slate-100 flex flex-col items-center mb-10"><p className="text-[10px] font-black text-[#56CC9D] uppercase tracking-widest mb-2">{language==='TH'?'ยอดที่สแกนได้':'Extracted Amount'}</p><h1 className="text-6xl font-black text-slate-800">฿120</h1></div><button onClick={onConfirm} className="bg-[#2F80ED] text-white p-5 rounded-full font-black uppercase tracking-widest shadow-xl mt-auto">Confirm Details</button></div>;
        const AddTransactionScreen = ({ onSave, t, onBack, Icon }) => <div className="p-8 flex flex-col h-full bg-[#F7F9FC]"><button onClick={onBack} className="mb-10"><Icon name="chevron-left" size={24}/></button><h2 className="text-3xl font-black mb-10">{t('addTransaction')}</h2><button onClick={()=>onSave({id:Date.now(), title:'Manual', amount:150, category:'Other', date:'Today'})} className="bg-[#2F80ED] text-white p-5 rounded-full font-black uppercase tracking-widest shadow-xl mt-auto">Save</button></div>;
        const PocketDetailsScreen = ({ t, onBack, Icon }) => <div className="p-8 flex flex-col h-full bg-[#F7F9FC]"><button onClick={onBack} className="mb-10"><Icon name="chevron-left" size={24}/></button><h2 className="text-2xl font-black mb-10">{t('wallet')} Detail</h2><div className="bg-white p-10 rounded-[40px] shadow-sm border border-slate-100 text-center"><h1 className="text-4xl font-black">฿4,500</h1></div></div>;
        const CreatePocketScreen = ({ t, onBack, onSave, Icon }) => <div className="p-8 flex flex-col h-full bg-[#F7F9FC]"><button onClick={onBack} className="mb-10"><Icon name="chevron-left" size={24}/></button><h2 className="text-2xl font-black mb-10">{t('createNewPocket')}</h2><button onClick={()=>onSave({name:'New', spent:0, goal:1000})} className="bg-[#2F80ED] text-white p-5 rounded-full font-black uppercase tracking-widest shadow-xl mt-auto">Save Pocket</button></div>;
        const TransactionDetailScreen = ({ t, tx, onBack, navigate, Icon }) => <div className="p-8 flex flex-col h-full bg-[#F7F9FC]"><button onClick={onBack} className="mb-10"><Icon name="chevron-left" size={24}/></button><h2 className="text-2xl font-black mb-10">Transaction Detail</h2><button onClick={()=>navigate('SPLIT_TRANSACTION')} className="bg-[#2F80ED] text-white p-5 rounded-full font-black uppercase tracking-widest shadow-xl">Split with Friends</button></div>;
        const SplitTransactionScreen = ({ t, onBack, Icon }) => <div className="p-8 flex flex-col h-full bg-[#F7F9FC]"><button onClick={onBack} className="mb-10"><Icon name="chevron-left" size={24}/></button><h2 className="text-2xl font-black mb-10">Split Bill</h2><button onClick={onBack} className="bg-[#2F80ED] text-white p-5 rounded-full font-black uppercase tracking-widest shadow-xl mt-auto">Confirm Split</button></div>;
        const EditProfileScreen = ({ t, onBack, Icon }) => <div className="p-8 flex flex-col h-full bg-[#F7F9FC]"><button onClick={onBack} className="mb-10"><Icon name="chevron-left" size={24}/></button><h2 className="text-2xl font-black mb-10">Edit Profile</h2><button onClick={onBack} className="bg-[#2F80ED] text-white p-5 rounded-full font-black uppercase tracking-widest shadow-xl mt-auto">Save Changes</button></div>;
        const NotificationSettingsScreen = ({ t, onBack, Icon }) => <div className="p-8 flex flex-col h-full bg-[#F7F9FC]"><button onClick={onBack} className="mb-10"><Icon name="chevron-left" size={24}/></button><h2 className="text-2xl font-black mb-10">Notification Settings</h2></div>;
        const NotificationsScreen = ({ t, onBack, Icon }) => <div className="p-8 flex flex-col h-full bg-[#F7F9FC]"><button onClick={onBack} className="mb-10"><Icon name="chevron-left" size={24}/></button><h2 className="text-2xl font-black mb-10">Notifications</h2></div>;
        const ReceiptDetailScreen = ({ onBack, Icon }) => <div className="p-4 flex flex-col h-full bg-black"><button onClick={onBack} className="mb-10 text-white"><Icon name="chevron-left" size={24}/></button></div>;

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
