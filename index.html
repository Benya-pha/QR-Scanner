        // ==========================================
        // 4. ERROR BOUNDARY
        // ==========================================
        class ErrorBoundary extends React.Component {
            constructor(props) { super(props); this.state = { hasError: false, error: null }; }
            static getDerivedStateFromError(error) { return { hasError: true, error }; }
            render() {
                if (this.state.hasError) {
                    return (
                        <div className="p-8 bg-slate-900 text-white h-screen w-screen flex flex-col items-center justify-center">
                            <h1 className="text-4xl font-black mb-4 text-red-500">Oops!</h1>
                            <h2 className="text-xl font-bold mb-2">แอปเกิดข้อผิดพลาด</h2>
                            <p className="text-slate-400 text-center mb-8 text-xs bg-slate-800 p-4 rounded-xl">{this.state.error?.toString()}</p>

                    );
                }
                return this.props.children;
            }
        }

        // ==========================================
        // 5. MAIN APPLICATION
        // ==========================================
        const App = () => {
            const [isAuthReady, setIsAuthReady] = useState(false);

            const [lang, setLang] = useState('TH');
            const [themeMode, setThemeMode] = useState('system'); 
            const [reduceMotion, setReduceMotion] = useState(false);
            
            const savedPin = localStorage.getItem('cozy_pin');
            const [pinCode, setPinCode] = useState(savedPin); 
            const [isLocked, setIsLocked] = useState(!!savedPin); 
            const [showPinModal, setShowPinModal] = useState(false);
            
            const [txs, setTxs] = useState([]);
            const [pockets, setPockets] = useState([]);

            const t = useCallback((key) => getT(lang)(key), [lang]);

                if (tb) setTab(tb);

                        db.collection('users').doc(u.uid).onSnapshot(doc => {
                            const dbData = doc.data() || {};

                                uid: u.uid,
                                email: u.email,
                                displayName: dbData.displayName || u.displayName || u.email.split('@')[0],

                            });
                        });

                        if(!isLocked) go('MAIN', 'HOME');
                        
                        try {
                            db.collection('users').doc(u.uid).collection('transactions').orderBy('timestamp', 'desc').onSnapshot(
                                snap => setTxs(snap.docs.map(d => ({ id: d.id, ...d.data() })))
                            );
                            db.collection('users').doc(u.uid).collection('pockets').onSnapshot(
                                snap => setPockets(snap.docs.map(d => ({ id: d.id, ...d.data() })))
                            );
                        } catch(e) { console.error("Sync Error", e); }

                            if(!isLocked) go('MAIN', 'HOME');
                        } else {
                            go('SIGN_IN');
                            setTxs([]); setPockets([]);
                        }
                    }
                });
                return unsub;

                    </div>
                );

            const p = { user, setUser, go, t, lang, setLang, themeMode, setThemeMode, reduceMotion, setReduceMotion, pinCode, setPinCode, showPinModal, setShowPinModal, txs, setTxs, pockets, setPockets, screenData, Icon, LoadingOverlay, translateAuthError };

            return (

                    {screen === 'FORGOT_PASS' && <ForgotScreen {...p} />}

                            {tab === 'POCKETS' && <PocketsScreen {...p} />}
                            {tab === 'HISTORY' && <HistoryScreen {...p} />}

                        </MainLayout>
                    )}
                    
                    {screen === 'SCAN' && <ScanScreen {...p} onNext={(d)=>go('REVIEW', null, d)} />}
                    {screen === 'REVIEW' && <ReviewScreen {...p} onConfirm={async (d)=>{

                        go('MAIN','HISTORY'); 
                    }} />}

                        if(user && user.uid !== 'mock-uid') {
                            await db.collection('users').doc(user.uid).collection('transactions').add({...d, timestamp: firebase.firestore.FieldValue.serverTimestamp()});
                        } else setTxs([d, ...txs]); 
                        go('MAIN','HISTORY'); 
                    }} />}
                    {screen === 'TX_DETAIL' && <TxDetailScreen {...p} tx={screenData || txs[0]} />}
                    {screen === 'SPLIT_BILL' && <SplitBillScreen {...p} tx={screenData || txs[0]} />}
                    
                    {screen === 'ADD_POCKET' && <AddPocketScreen {...p} onSave={async (pData)=>{ 
                        if(user && user.uid !== 'mock-uid') {
                            await db.collection('users').doc(user.uid).collection('pockets').add({...pData, timestamp: firebase.firestore.FieldValue.serverTimestamp()});
                        } else setPockets([...pockets, pData]); 
                        go('MAIN', 'POCKETS'); 
                    }} />}
                    {screen === 'POCKET_DETAILS' && <PocketDetailsScreen {...p} pocket={screenData || pockets[0]} />}
                    
                    {screen === 'EDIT_PROFILE' && <EditProfileScreen {...p} />}

        // --- LOCK SCREEN ---
        const LockScreen = ({ Icon, correctPin, onUnlock }) => {
            const [pin, setPin] = useState('');
            const [err, setErr] = useState('');
            const press = (n) => { if(pin.length < 6) { setPin(p => p + n); setErr(''); } };

            useEffect(() => {
                if(pin.length === 6) {
                    if(pin === correctPin) onUnlock();

                    </div>
                    <div className="bg-white w-full rounded-t-[40px] p-8 pb-12 flex flex-col items-center shadow-[0_-20px_50px_rgba(0,0,0,0.5)]">
                        <div className="flex gap-4 mb-8">{[1,2,3,4,5,6].map(i => <div key={i} className={`w-4 h-4 rounded-full transition-colors ${pin.length >= i ? (err?'bg-red-500':'bg-[#2F80ED]') : 'bg-slate-200'}`}></div>)}</div>
                        {err && <p className="text-red-500 text-xs font-bold mb-4">{err}</p>}
                        <div className="grid grid-cols-3 gap-6 w-full max-w-[280px]">

                            <div></div><button onClick={()=>press(0)} className="h-16 rounded-full bg-slate-50 text-slate-800 text-2xl font-black active:bg-slate-200 transition-colors">0</button><button onClick={del} className="h-16 flex items-center justify-center text-slate-500 active:bg-slate-100 rounded-full transition-colors"><Icon name="delete" size={28}/></button>
                        </div>

        // --- LAYOUT ---
        const MainLayout = ({ children, tab, go, t, Icon }) => (

                <div className="absolute bottom-0 w-full bg-white/95 backdrop-blur-xl border-t border-slate-100 px-6 py-4 flex justify-between items-center z-50 rounded-t-3xl shadow-[0_-5px_20px_rgba(0,0,0,0.03)]">

        // --- 6. DASHBOARDS ---
        const HomeScreen = ({ user, txs, pockets, go, t, Icon }) => {

        // --- 7. CAMERA & AI OCR SCANNING ---
        const ScanScreen = ({ go, onNext, t, Icon, LoadingOverlay }) => {
            const videoRef = useRef(null);
            const fileInputRef = useRef(null);
            const [flash, setFlash] = useState(false);
            const [scanning, setScanning] = useState(false);

            useEffect(() => {
                let stream = null;
                navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' }, audio: false })
                    .then(s => { 
                        stream = s; 
                        if(videoRef.current) {
                            videoRef.current.srcObject = s;
                            videoRef.current.setAttribute('playsinline', true);
                            videoRef.current.play().catch(e=>console.log(e));
                        }
                    }).catch(e => console.log("Camera not available"));
                return () => stream?.getTracks().forEach(t => t.stop());
            }, []);

            const processImage = async (file) => {
                setScanning(true);
                try {
                    const worker = await Tesseract.createWorker('tha+eng');
                    const ret = await worker.recognize(file);
                    const text = ret.data.text.replace(/\s+/g, ' ');
                    await worker.terminate();

                    const numbers = text.match(/\d{1,3}(?:,\d{3})*(?:\.\d{2})/g);
                    let finalAmount = '';
                    if(numbers && numbers.length > 0) {
                        const vals = numbers.map(n => parseFloat(n.replace(/,/g, '')));
                        finalAmount = Math.max(...vals).toFixed(2);
                    }
                    
                    const merchant = text.includes('โอนเงิน') ? 'โอนเงินสำเร็จ' : 'รายการสแกนจากคลังภาพ';
                    
                    setTimeout(() => {
                        setScanning(false);
                        onNext({ amount: finalAmount || '', merchant: merchant, date: new Date().toLocaleDateString('th-TH') });
                    }, 1500);

                } catch (error) {
                    setTimeout(() => {
                        setScanning(false);
                        onNext({ amount: '', merchant: 'สแกนไม่สำเร็จ กรุณากรอกเอง', date: new Date().toLocaleDateString('th-TH') });
                    }, 1500);
                }
            };

            const capture = () => { 
                setFlash(true); 
                setTimeout(() => { 
                    setFlash(false); setScanning(true);
                    setTimeout(() => {
                        setScanning(false);
                        onNext({ amount: '', merchant: 'ถ่ายภาพใหม่', date: new Date().toLocaleDateString('th-TH') });

                }, 300);

            return (

                        <div className="scan-frame"><div className="scan-corner tl"></div><div className="scan-corner tr"></div><div className="scan-corner bl"></div><div className="scan-corner br"></div><div className="laser"></div></div>
                    </div>
                    <div className="bg-black/90 backdrop-blur-xl p-8 pb-12 flex justify-between items-center z-40 rounded-t-[40px]">
                        <button onClick={()=>fileInputRef.current.click()} className="flex flex-col items-center gap-2 text-white/70 active:scale-90 transition-transform"><div className="w-14 h-14 bg-white/10 rounded-full flex items-center justify-center border border-white/20"><Icon name="image"/></div><span className="text-[10px] font-bold">{t('gallery')}</span></button>
                        <div className="relative"><div className="absolute inset-0 bg-[#2F80ED]/30 rounded-full blur-xl scale-150 animate-pulse"></div><button onClick={capture} className="w-20 h-20 bg-white rounded-full flex items-center justify-center border-[6px] border-slate-300 relative z-10 active:scale-90 transition-transform"><div className="w-14 h-14 bg-[#2F80ED] rounded-full flex items-center justify-center text-white"><Icon name="camera" size={28}/></div></button></div>
                        <button onClick={()=>go('ADD_TX')} className="flex flex-col items-center gap-2 text-white/70 active:scale-90 transition-transform"><div className="w-14 h-14 bg-white/10 rounded-full flex items-center justify-center border border-white/20"><Icon name="edit-2"/></div><span className="text-[10px] font-bold">{t('manual')}</span></button>
                    </div>
                    <input ref={fileInputRef} type="file" accept="image/*" className="hidden" onChange={e=>e.target.files[0]&&processImage(e.target.files[0])} />
                </div>
            );

        const ReviewScreen = ({ go, screenData, onConfirm, t, Icon, LoadingOverlay }) => {
            const [amount, setAmount] = useState(screenData?.amount || '');
            const [merchant, setMerchant] = useState(screenData?.merchant || '');
            const [saving, setSaving] = useState(false);
            
            const handleSave = () => {

                const reader = new FileReader();

                    img.onload = () => {
                        const canvas = document.createElement('canvas');
                        const MAX_WIDTH = 300;
                        const scaleSize = MAX_WIDTH / img.width;
                        canvas.width = MAX_WIDTH;
                        canvas.height = img.height * scaleSize;
                        const ctx = canvas.getContext('2d');
                        ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
                        callback(canvas.toDataURL('image/jpeg', 0.7));
                    }
                }
            };

                        <div key={l} onClick={()=>setLang(l)} className={`p-6 rounded-[28px] border-2 flex justify-between items-center cursor-pointer transition-all ${lang===l?'border-[#2F80ED] bg-blue-50':'border-white bg-white shadow-sm'}`}>
                            <span className={`font-black text-sm ${lang===l?'text-[#2F80ED]':'text-slate-600'}`}>{l === 'TH' ? 'ภาษาไทย' : 'English'}</span>
                            {lang===l && <Icon name="check-circle-2" size={20} className="text-[#2F80ED]"/>}
                        </div>
                    ))}
                </div>
            </div>
        );

        const SecuritySettingsScreen = ({ go, pinCode, setShowPinModal, t, Icon, user, translateAuthError }) => {
            const [bio, setBio] = useState(true);
            const [msg, setMsg] = useState('');
            
            const handleResetPass = async () => {
                if(user && user.uid !== 'mock-uid') {
                    try {
                        await auth.sendPasswordResetEmail(user.email);
                        setMsg('ส่งลิงก์เปลี่ยนรหัสไปที่อีเมลแล้ว');
                    } catch(e) { setMsg(translateAuthError(e.code)); }
                } else setMsg('ไม่รองรับในโหมดทดลองใช้งาน');
                setTimeout(()=>setMsg(''), 3000);
            };

            return (
                <div className="p-6 pt-10 flex flex-col h-full bg-[#F7F9FC] fade-in">
                    <div className="flex items-center mb-10"><button onClick={()=>go('MAIN','PROFILE')} className="w-10 h-10 bg-white rounded-full flex items-center justify-center shadow-sm"><Icon name="chevron-left"/></button><h2 className="font-black text-lg ml-4">{t('security')}</h2></div>
                    <div className="bg-white rounded-[36px] border border-slate-100 shadow-sm p-2 mb-8">
                        <div onClick={handleResetPass} className="p-4 border-b border-slate-50 flex items-center justify-between cursor-pointer active:bg-slate-50 rounded-t-[32px]"><div className="flex items-center gap-4"><div className="w-12 h-12 bg-slate-50 rounded-2xl flex items-center justify-center text-slate-500"><Icon name="lock"/></div><span className="font-bold text-sm text-slate-800">{t('changePass')}</span></div><Icon name="chevron-right" className="text-slate-300"/></div>
                        <div className="p-4 border-b border-slate-50 flex items-center justify-between"><div className="flex items-center gap-4"><div className="w-12 h-12 bg-slate-50 rounded-2xl flex items-center justify-center text-slate-500"><Icon name="layout-grid"/></div><div><span className="font-bold text-sm text-slate-800 block leading-none mb-1">{t('pinCode')}</span><span className="text-[10px] font-bold text-slate-400 uppercase">{pinCode?t('changePin'):'ยังไม่ได้ตั้ง'}</span></div></div><button onClick={()=>setShowPinModal(true)} className={`text-[10px] font-black px-4 py-2 rounded-xl transition-colors ${pinCode?'bg-slate-100 text-slate-500':'bg-[#2F80ED] text-white'}`}>{pinCode?t('changePin'):t('setPin')}</button></div>
                        <div className="p-4 flex items-center justify-between"><div className="flex items-center gap-4"><div className="w-12 h-12 bg-slate-50 rounded-2xl flex items-center justify-center text-slate-500"><Icon name="fingerprint"/></div><span className="font-bold text-sm text-slate-800">{t('biometric')}</span></div><div onClick={()=>setBio(!bio)} className={`w-12 h-7 rounded-full flex items-center p-1 cursor-pointer transition-colors ${bio?'bg-[#56CC9D]':'bg-slate-200'}`}><div className={`w-5 h-5 rounded-full bg-white shadow-sm transition-transform ${bio?'translate-x-5':'translate-x-0'}`}></div></div></div>
                    </div>
                    {msg && <div className="text-center bg-green-50 text-green-600 p-4 rounded-2xl font-bold text-xs">{msg}</div>}
                </div>
            );
        };

        const NotificationSettingsScreen = ({ go, Icon }) => <div className="p-6 pt-10"><button onClick={()=>go('MAIN','PROFILE')} className="w-10 h-10 bg-white rounded-full flex items-center justify-center shadow-sm"><Icon name="chevron-left"/></button><h2 className="text-xl font-black mt-6">การแจ้งเตือน</h2></div>;

        const PinPadModal = ({ onClose, onSave, Icon, isSet }) => {
            const [pin, setPin] = useState('');
            const press = (n) => { if(pin.length < 6) setPin(p => p + n); };
            const del = () => setPin(p => p.slice(0, -1));
            useEffect(() => { if(pin.length === 6) setTimeout(()=>{ onSave(pin); onClose(); }, 200); }, [pin]);

            return (
                <div className="absolute inset-0 bg-black/60 z-[100] flex flex-col justify-end fade-in">
                    <div className="bg-white w-full rounded-t-[40px] p-8 pb-12 flex flex-col items-center slide-up shadow-[0_-20px_50px_rgba(0,0,0,0.5)]">
                        <div className="flex justify-between w-full mb-8"><div className="w-8"></div><h3 className="font-black text-slate-800 text-lg">{isSet?'ตั้งรหัส PIN ใหม่':'ตั้งรหัส PIN 6 หลัก'}</h3><button onClick={onClose} className="w-8 h-8 bg-slate-100 rounded-full flex items-center justify-center text-slate-500"><Icon name="x" size={16}/></button></div>
                        <div className="flex gap-4 mb-10">{[1,2,3,4,5,6].map(i => <div key={i} className={`w-4 h-4 rounded-full transition-colors ${pin.length >= i ? 'bg-[#2F80ED]' : 'bg-slate-200'}`}></div>)}</div>
                        <div className="grid grid-cols-3 gap-6 w-full max-w-[280px]">
                            {[1,2,3,4,5,6,7,8,9].map(n => <button key={n} onClick={()=>press(n)} className="h-16 rounded-full bg-slate-50 text-slate-800 text-2xl font-black active:bg-slate-200 transition-colors">{n}</button>)}
                            <div></div><button onClick={()=>press(0)} className="h-16 rounded-full bg-slate-50 text-slate-800 text-2xl font-black active:bg-slate-200 transition-colors">0</button><button onClick={del} className="h-16 flex items-center justify-center text-slate-500 active:bg-slate-100 rounded-full transition-colors"><Icon name="delete" size={28}/></button>
                        </div>
                    </div>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<ErrorBoundary><App /></ErrorBoundary>);
    </script>
</body>
</html>
