<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Slip & Expense Tracker</title>
    
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#f8fafc" media="(prefers-color-scheme: light)">
    <meta name="theme-color" content="#121212" media="(prefers-color-scheme: dark)">

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/gh/lazywasabi/thai-web-fonts@7/fonts/CSPrajad/CS-Prajad.css" rel="stylesheet" />
    
    <!-- React & Libraries (Development versions) -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    
    <!-- Firebase -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
    
    <!-- Tesseract OCR -->
    <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
    
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        primary: '#8cb1ff',
                        primaryLight: 'rgba(140, 177, 255, 0.15)',
                        secondary: '#cda8ff',
                        danger: '#FF4D4D',
                        success: '#94e4ae',
                        dark: '#121212',
                        darkCard: '#1e1e1e'
                    }
                }
            }
        }
    </script>

    <style>
        :root {
            --bg-color: #f8fafc;
            --text-main: #0f172a;
        }
        .dark { 
            --bg-color: #121212; 
            --text-main: #f8fafc;
        }
        
        * { font-family: 'Plus Jakarta Sans', 'CS Prajad', sans-serif; -webkit-tap-highlight-color: transparent; outline: none; box-sizing: border-box; }
        body, html, #root { width: 100%; height: 100dvh; margin: 0; padding: 0; overflow: hidden; background-color: var(--bg-color); color: var(--text-main); }
        
        /* Hide Scrollbar but keep functionality */
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        
        /* Animations */
        .fade-in { animation: fadeIn 0.3s ease-out forwards; }
        .slide-up { animation: slideUp 0.4s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        @keyframes slideUp { from { opacity: 0; transform: translateY(30px); } to { opacity: 1; transform: translateY(0); } }
        
        /* Shadows */
        .soft-shadow { box-shadow: 0 4px 20px -2px rgba(0,0,0,0.05); }
        .dark .soft-shadow { box-shadow: 0 4px 20px -2px rgba(0,0,0,0.4); }
        .fab-shadow { box-shadow: 0 10px 25px -5px rgba(140, 177, 255, 0.5); }
        
        /* Scanner UI */
        .scan-frame { position: absolute; top: 15%; bottom: 30%; left: 10%; right: 10%; border-radius: 24px; box-shadow: 0 0 0 9999px rgba(0, 0, 0, 0.7); z-index: 10; border: 2px solid rgba(255,255,255,0.5); pointer-events: none; }
        .laser { position: absolute; width: 100%; height: 3px; background: #8cb1ff; box-shadow: 0 0 20px #8cb1ff; animation: scanLine 2s linear infinite; z-index: 11; border-radius: 10px; }
        @keyframes scanLine { 0% { top: 0; opacity: 0; } 10% { opacity: 1; } 90% { opacity: 1; } 100% { top: 100%; opacity: 0; } }

        /* Spinner */
        .spinner { width: 40px; height: 40px; border: 4px solid rgba(140, 177, 255, 0.3); border-top: 4px solid #8cb1ff; border-radius: 50%; animation: spin 1s linear infinite; margin-bottom: 1rem; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        /** @jsxRuntime classic */
        /** @jsx React.createElement */
        /** @jsxFrag React.Fragment */

        const { useState, useEffect, useCallback, useRef, useMemo } = React;

        // ----------------------------------------------------
        // ERROR BOUNDARY (ป้องกันหน้าจอขาว)
        // ----------------------------------------------------
        class ErrorBoundary extends React.Component {
            constructor(props) { super(props); this.state = { hasError: false, error: null }; }
            static getDerivedStateFromError(error) { return { hasError: true, error }; }
            componentDidCatch(error, errorInfo) { console.error("App Crashed:", error, errorInfo); }
            render() {
                if (this.state.hasError) {
                    return (
                        <div className="p-6 h-screen flex flex-col items-center justify-center bg-red-50 text-red-900">
                            <h1 className="text-2xl font-bold mb-4">แอปพลิเคชันเกิดข้อผิดพลาด 💥</h1>
                            <p className="mb-4 text-center">รบกวนแคปเจอร์หน้าจอนี้ส่งให้ผู้พัฒนา</p>
                            <pre className="bg-white p-4 rounded text-xs overflow-auto w-full border border-red-200">
                                {this.state.error && this.state.error.toString()}
                            </pre>
                            <button onClick={() => window.location.reload()} className="mt-6 px-6 py-2 bg-red-500 text-white rounded-full font-bold">รีเฟรชหน้าจอ</button>
                        </div>
                    );
                }
                return this.props.children; 
            }
        }

        // ----------------------------------------------------
        // FIREBASE SETUP
        // ----------------------------------------------------
        const fbConfig = { 
            apiKey: "AIzaSyCv1D7XjSuSYWJxpFxT7umaCAb9o8fY2o8", 
            authDomain: "qr-scanner-a29e3.firebaseapp.com", 
            projectId: "qr-scanner-a29e3", 
            storageBucket: "qr-scanner-a29e3.firebasestorage.app", 
            messagingSenderId: "1070573788877", 
            appId: "1:1070573788877:web:cd65246772c629f380d384" 
        };
        
        if (!firebase.apps.length) { firebase.initializeApp(fbConfig); }
        const auth = firebase.auth(); 
        const db = firebase.firestore();

        // Data Constants
        const CATEGORIES = [
            { id: 'food', name: 'อาหาร/เครื่องดื่ม', icon: 'coffee', color: '#ff9494' },
            { id: 'transport', name: 'เดินทาง', icon: 'bus', color: '#8cb1ff' },
            { id: 'shopping', name: 'ช้อปปิ้ง', icon: 'shopping-bag', color: '#cda8ff' },
            { id: 'bills', name: 'บิล/ค่าน้ำไฟ', icon: 'file-text', color: '#ffde6a' },
            { id: 'entertainment', name: 'บันเทิง', icon: 'film', color: '#ffb0cd' },
            { id: 'health', name: 'สุขภาพ', icon: 'heart', color: '#94e4ae' },
            { id: 'transfer', name: 'โอนเงิน', icon: 'send', color: '#fbcfe8' },
            { id: 'general', name: 'ทั่วไป', icon: 'tag', color: '#94a3b8' }
        ];

        const getCategory = (id) => CATEGORIES.find(c => c.id === id) || CATEGORIES[CATEGORIES.length - 1];
        const formatMoney = (num) => Number(num || 0).toLocaleString('en-US', {minimumFractionDigits: 2, maximumFractionDigits: 2});
        const formatDate = (dateStr) => {
            if(!dateStr) return '';
            try {
                const d = new Date(dateStr);
                return d.toLocaleDateString('th-TH', { year: 'numeric', month: 'short', day: 'numeric' });
            } catch(e) { return dateStr; }
        };

        // ----------------------------------------------------
        // UI COMPONENTS
        // ----------------------------------------------------
        const Icon = ({ name, size=24, className="", strokeWidth=1.5 }) => {
            const spanRef = useRef(null);
            useEffect(() => { 
                if(spanRef.current && window.lucide) {
                    try { 
                        spanRef.current.innerHTML = `<i data-lucide="${name}" class="${className}"></i>`; 
                        lucide.createIcons({ root: spanRef.current, attrs: { 'stroke-width': strokeWidth, width: size, height: size } }); 
                    } catch (e) { console.error("Icon error:", e); }
                }
            }, [name, size, strokeWidth, className]);
            return <span ref={spanRef} className={`inline-flex items-center justify-center shrink-0 ${className}`} style={{width: size, height: size, minWidth: size, minHeight: size}}></span>;
        };

        const LoadingOverlay = ({ text, subtext }) => (
            <div className="fixed inset-0 bg-white/80 dark:bg-dark/90 backdrop-blur-md z-[100] flex flex-col items-center justify-center fade-in">
                <div className="spinner"></div>
                <h2 className="font-bold text-lg tracking-widest text-slate-800 dark:text-white mb-2">{text}</h2>
                {subtext && <p className="text-sm text-slate-500 font-medium text-center px-6">{subtext}</p>}
            </div>
        );

        const Toast = ({ message, type="error", onClose }) => {
            useEffect(() => {
                if(!message) return;
                const timer = setTimeout(() => onClose(), 3000);
                return () => clearTimeout(timer);
            }, [message, onClose]);
            
            if(!message) return null;
            return (
                <div className="fixed top-10 left-1/2 -translate-x-1/2 z-[200] px-6 py-3 rounded-full shadow-lg fade-in flex items-center gap-3 text-white text-sm font-semibold whitespace-nowrap" style={{backgroundColor: type === 'error' ? '#FF4D4D' : '#94e4ae', color: type==='error'? '#fff' : '#0f172a'}}>
                    <Icon name={type === 'error' ? 'alert-circle' : 'check-circle'} size={18} />
                    {message}
                </div>
            )
        };

        const processReceiptImage = async (file, onComplete, onError) => {
            try {
                // Warning: Loading Tesseract models can take a few seconds on mobile
                const worker = await Tesseract.createWorker('tha+eng'); 
                const ret = await worker.recognize(file); 
                const text = ret.data.text; 
                await worker.terminate();
                
                let amount = ''; 
                let merchant = ''; 
                
                const lines = text.split('\n').map(l => l.trim()).filter(l => l.length > 0); 
                
                // Regex to find amount (Look for keywords followed by numbers)
                const amountRegex = /(?:จำนวนเงิน|ยอดรวม|ยอดเงิน|รวมทั้งสิ้น|Total|Amount|฿|B)\s*[:=]?\s*([0-9]{1,3}(?:,[0-9]{3})*(?:\.\d{2})?)/i;
                for(let line of lines) { 
                    const match = line.match(amountRegex); 
                    if(match && match[1]) { 
                        amount = match[1].replace(/,/g, ''); 
                        break; 
                    } 
                }
                
                // Guess merchant name
                for(let line of lines) {
                    const cleanLine = line.replace(/[^a-zA-Zก-๙0-9\s]/g, '').trim();
                    if(cleanLine.length > 3 && !cleanLine.includes(amount) && !cleanLine.match(/^[0-9\/:-]+$/)) {
                        merchant = cleanLine;
                        break;
                    }
                }
                
                const resultData = { 
                    amount: amount || '', 
                    merchant: merchant || 'อัพโหลดจากสลิป', 
                    date: new Date().toISOString().split('T')[0], 
                    categoryId: 'transfer', 
                    type: 'expense'
                };
                
                if (typeof file === 'string') { 
                    onComplete({ ...resultData, imageUrl: file }); 
                } else { 
                    const reader = new FileReader(); 
                    reader.onload = (ev) => onComplete({ ...resultData, imageUrl: ev.target.result }); 
                    reader.readAsDataURL(file); 
                }
            } catch (error) {
                console.error("OCR Failed:", error);
                onError("ไม่สามารถประมวลผลรูปภาพได้ กรุณากรอกข้อมูลเอง");
                // Provide empty template if failed
                onComplete({ amount: '', merchant: '', date: new Date().toISOString().split('T')[0], categoryId: 'general', type: 'expense', imageUrl: null });
            }
        };

        const LoginScreen = ({ onLogin }) => {
            const [email, setEmail] = useState('');
            const [password, setPassword] = useState('');
            const [loading, setLoading] = useState(false);
            const [error, setError] = useState('');

            const handleLogin = async (e) => {
                e.preventDefault();
                setLoading(true); setError('');
                try {
                    await auth.signInWithEmailAndPassword(email, password);
                } catch(err) {
                    setError('อีเมลหรือรหัสผ่านไม่ถูกต้อง หรือสร้างบัญชีใหม่');
                }
                setLoading(false);
            };

            const handleGuest = async () => {
                setLoading(true); setError('');
                try { await auth.signInAnonymously(); } 
                catch(err) { setError('ไม่สามารถเข้าใช้งานโหมดผู้เยี่ยมชมได้'); }
                setLoading(false);
            };

            return (
                <div className="flex-1 flex flex-col justify-center items-center px-8 bg-white dark:bg-dark relative fade-in">
                    <div className="w-24 h-24 bg-primaryLight text-primary rounded-3xl flex items-center justify-center mb-8 rotate-12 shadow-xl">
                        <div className="-rotate-12"><Icon name="wallet" size={48} strokeWidth={2} /></div>
                    </div>
                    <h1 className="text-3xl font-extrabold text-slate-800 dark:text-white mb-2">Slip Tracker</h1>
                    <p className="text-slate-500 mb-10 text-center">บันทึกรายรับรายจ่ายอัตโนมัติ<br/>ด้วยการสแกนสลิปโอนเงิน</p>

                    <form onSubmit={handleLogin} className="w-full max-w-sm flex flex-col gap-4">
                        <input type="email" placeholder="อีเมล" value={email} onChange={e=>setEmail(e.target.value)} required className="w-full bg-slate-50 dark:bg-darkCard px-5 py-4 rounded-2xl border border-slate-100 dark:border-slate-800 outline-none focus:border-primary transition-all dark:text-white" />
                        <input type="password" placeholder="รหัสผ่าน" value={password} onChange={e=>setPassword(e.target.value)} required className="w-full bg-slate-50 dark:bg-darkCard px-5 py-4 rounded-2xl border border-slate-100 dark:border-slate-800 outline-none focus:border-primary transition-all dark:text-white" />
                        
                        {error && <p className="text-danger text-sm text-center">{error}</p>}
                        
                        <button type="submit" disabled={loading} className="w-full bg-primary text-white font-bold py-4 rounded-2xl shadow-lg shadow-primary/30 active:scale-95 transition-all mt-2">
                            {loading ? 'กำลังโหลด...' : 'เข้าสู่ระบบ'}
                        </button>
                        
                        <div className="relative flex py-4 items-center">
                            <div className="flex-grow border-t border-slate-200 dark:border-slate-700"></div>
                            <span className="flex-shrink-0 mx-4 text-slate-400 text-xs uppercase font-bold">หรือ</span>
                            <div className="flex-grow border-t border-slate-200 dark:border-slate-700"></div>
                        </div>

                        <button type="button" onClick={handleGuest} disabled={loading} className="w-full bg-slate-100 dark:bg-slate-800 text-slate-700 dark:text-white font-bold py-4 rounded-2xl active:scale-95 transition-all">
                            ทดลองใช้งาน (Guest)
                        </button>
                    </form>
                </div>
            );
        };

        const HomeScreen = ({ transactions, userName }) => {
            const currentMonth = new Date().getMonth();
            const monthlyTxs = transactions.filter(t => {
                try { return new Date(t.date).getMonth() === currentMonth; } 
                catch(e) { return false; }
            });
            const totalExpense = monthlyTxs.filter(t => t.type === 'expense').reduce((acc, curr) => acc + parseFloat(curr.amount || 0), 0);

            return (
                <div className="flex-1 overflow-y-auto no-scrollbar pb-24 fade-in">
                    <div className="bg-primary pt-14 pb-20 px-6 rounded-b-[40px] shadow-lg relative">
                        <div className="flex justify-between items-center mb-8">
                            <div>
                                <p className="text-white/80 text-sm font-medium">ยินดีต้อนรับกลับมา</p>
                                <h2 className="text-white text-2xl font-bold truncate max-w-[200px]">{userName || 'ผู้ใช้งาน'}</h2>
                            </div>
                            <div className="w-12 h-12 bg-white/20 rounded-full flex items-center justify-center text-white backdrop-blur-sm shrink-0">
                                <Icon name="user" size={24} />
                            </div>
                        </div>
                        
                        <div className="absolute -bottom-16 left-6 right-6 bg-white dark:bg-darkCard rounded-3xl p-6 soft-shadow border border-slate-100 dark:border-slate-800">
                            <div className="flex items-center gap-3 mb-2">
                                <div className="w-8 h-8 rounded-full bg-danger/10 text-danger flex items-center justify-center"><Icon name="arrow-down-right" size={16}/></div>
                                <p className="text-slate-500 dark:text-slate-400 text-sm font-medium">รายจ่ายเดือนนี้</p>
                            </div>
                            <h1 className="text-4xl font-extrabold text-slate-800 dark:text-white tracking-tight truncate">
                                ฿{formatMoney(totalExpense)}
                            </h1>
                        </div>
                    </div>

                    <div className="pt-24 px-6">
                        <div className="flex justify-between items-end mb-4">
                            <h3 className="text-lg font-bold text-slate-800 dark:text-white">รายการล่าสุด</h3>
                        </div>
                        
                        <div className="flex flex-col gap-3">
                            {transactions.length === 0 ? (
                                <div className="py-10 text-center text-slate-400 flex flex-col items-center gap-2">
                                    <Icon name="inbox" size={40} className="opacity-50"/>
                                    <p>ยังไม่มีรายการใช้จ่าย</p>
                                </div>
                            ) : (
                                transactions.slice(0, 5).map(tx => {
                                    const cat = getCategory(tx.categoryId);
                                    return (
                                        <div key={tx.id} className="bg-white dark:bg-darkCard p-4 rounded-2xl flex items-center gap-4 soft-shadow border border-slate-50 dark:border-slate-800/50">
                                            <div className="w-12 h-12 rounded-full flex items-center justify-center shrink-0" style={{backgroundColor: `${cat.color}20`, color: cat.color}}>
                                                <Icon name={cat.icon} size={20} />
                                            </div>
                                            <div className="flex-1 min-w-0">
                                                <h4 className="font-bold text-slate-800 dark:text-white truncate">{tx.merchant}</h4>
                                                <p className="text-xs text-slate-400">{formatDate(tx.date)}</p>
                                            </div>
                                            <div className="text-right shrink-0">
                                                <p className={`font-bold ${tx.type === 'expense' ? 'text-slate-800 dark:text-white' : 'text-success'}`}>
                                                    {tx.type === 'expense' ? '-' : '+'}฿{formatMoney(tx.amount)}
                                                </p>
                                            </div>
                                        </div>
                                    )
                                })
                            )}
                        </div>
                    </div>
                </div>
            );
        };

        const ScanScreen = ({ go, onResult, setToast }) => {
            const videoRef = useRef(null); 
            const fileInputRef = useRef(null); 
            const streamRef = useRef(null);
            const isMounted = useRef(true);
            const [isTorchOn, setIsTorchOn] = useState(false); 
            const [scanning, setScanning] = useState(false);

            useEffect(() => {
                isMounted.current = true;
                const startCamera = async () => {
                    try {
                        const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' } });
                        if(isMounted.current) {
                            streamRef.current = stream;
                            if(videoRef.current) {
                                videoRef.current.srcObject = stream;
                                videoRef.current.setAttribute('playsinline', true);
                                videoRef.current.play().catch(e => console.error("Play error:", e));
                            }
                        } else {
                            stream.getTracks().forEach(track => track.stop());
                        }
                    } catch(err) {
                        if(isMounted.current) setToast({message: 'ไม่สามารถเข้าถึงกล้องได้', type: 'error'});
                    }
                };
                startCamera();

                return () => {
                    isMounted.current = false;
                    if (streamRef.current) {
                        streamRef.current.getTracks().forEach(track => {
                            if (isTorchOn && track.applyConstraints) track.applyConstraints({ advanced: [{ torch: false }] }).catch(()=>{});
                            track.stop();
                        });
                    }
                };
            }, [isTorchOn, setToast]);

            const toggleFlash = async () => {
                if (streamRef.current) {
                    try {
                        const track = streamRef.current.getVideoTracks()[0];
                        if (track.getCapabilities && track.getCapabilities().torch) {
                            await track.applyConstraints({ advanced: [{ torch: !isTorchOn }] });
                            setIsTorchOn(!isTorchOn);
                        } else { setToast({message: 'อุปกรณ์ไม่รองรับไฟฉาย', type: 'error'}); }
                    } catch (e) { setToast({message: 'เปิดไฟฉายไม่สำเร็จ', type: 'error'}); }
                }
            };

            const processImage = (imgSrc) => {
                setScanning(true);
                processReceiptImage(imgSrc, (data) => {
                    if(isMounted.current) {
                        setScanning(false);
                        onResult(data);
                    }
                }, (errMsg) => {
                    if(isMounted.current) {
                        setScanning(false);
                        setToast({message: errMsg, type: 'error'});
                    }
                });
            };

            const capture = () => { 
                if (videoRef.current && videoRef.current.readyState === videoRef.current.HAVE_ENOUGH_DATA) {
                    const canvas = document.createElement('canvas'); 
                    canvas.width = videoRef.current.videoWidth; 
                    canvas.height = videoRef.current.videoHeight;
                    const ctx = canvas.getContext('2d'); 
                    ctx.drawImage(videoRef.current, 0, 0, canvas.width, canvas.height);
                    const imgData = canvas.toDataURL('image/jpeg', 0.8);
                    processImage(imgData);
                } else {
                    setToast({message: 'กล้องยังไม่พร้อมทำงาน', type: 'error'});
                }
            };

            const handleFileUpload = (e) => {
                if(e.target.files[0]) processImage(e.target.files[0]);
            };

            if(scanning) return <LoadingOverlay text="กำลังสกัดข้อมูลจากรูปภาพ" subtext="อาจใช้เวลา 3-10 วินาที ขึ้นอยู่กับความเร็วของอุปกรณ์" />;

            return (
                <div className="flex-1 bg-black relative flex flex-col h-full fade-in z-50">
                    <div className="absolute top-12 left-0 w-full px-6 flex justify-between items-center z-40">
                        <button onClick={()=>go('HOME')} className="w-10 h-10 bg-white/20 rounded-full flex items-center justify-center text-white active:scale-95 backdrop-blur-md transition-colors"><Icon name="x" size={20}/></button>
                        <button onClick={toggleFlash} className={`w-10 h-10 rounded-full flex items-center justify-center active:scale-95 backdrop-blur-md transition-colors ${isTorchOn ? 'bg-primary text-white' : 'bg-white/20 text-white'}`}><Icon name={isTorchOn ? 'zap' : 'zap-off'} size={20}/></button>
                    </div>
                    
                    <div className="flex-1 relative overflow-hidden flex items-center justify-center bg-zinc-900">
                        <video ref={videoRef} playsInline webkit-playsinline autoPlay muted className="absolute inset-0 w-full h-full object-cover opacity-90" />
                        <div className="scan-frame"><div className="laser"></div></div>
                        <p className="absolute bottom-[35%] w-full text-center text-white/80 text-sm font-medium tracking-wide drop-shadow-md z-20">จัดสลิปให้อยู่ในกรอบ</p>
                    </div>
                    
                    <div className="bg-white dark:bg-dark rounded-t-[32px] p-8 pb-12 flex flex-col items-center shadow-[0_-20px_50px_rgba(0,0,0,0.4)] z-40 relative slide-up">
                        <div className="w-12 h-1.5 bg-slate-200 dark:bg-slate-700 rounded-full mb-6 shrink-0"></div>
                        <div className="flex justify-between w-full px-4 items-center">
                            <button onClick={()=>fileInputRef.current.click()} className="flex flex-col items-center gap-2 group">
                                <div className="w-12 h-12 bg-slate-100 dark:bg-slate-800 rounded-full flex items-center justify-center active:scale-95 transition-all dark:text-white"><Icon name="image" size={20}/></div>
                                <span className="text-[10px] font-bold uppercase text-slate-500">อัลบั้ม</span>
                            </button>
                            <button onClick={capture} className="w-20 h-20 bg-primary text-white rounded-full flex items-center justify-center shadow-xl active:scale-95 transition-transform hover:-translate-y-1 fab-shadow border-4 border-white dark:border-dark">
                                <Icon name="camera" size={28}/>
                            </button>
                            <button onClick={()=>onResult(null)} className="flex flex-col items-center gap-2 group">
                                <div className="w-12 h-12 bg-slate-100 dark:bg-slate-800 rounded-full flex items-center justify-center active:scale-95 transition-all dark:text-white"><Icon name="edit-2" size={20}/></div>
                                <span className="text-[10px] font-bold uppercase text-slate-500">กรอกเอง</span>
                            </button>
                        </div>
                    </div>
                    <input ref={fileInputRef} type="file" accept="image/*" className="hidden" onChange={handleFileUpload} />
                </div>
            );
        };

        const AddTransactionScreen = ({ go, initialData, onSave, setToast }) => {
            const [amount, setAmount] = useState(initialData?.amount || '');
            const [merchant, setMerchant] = useState(initialData?.merchant || '');
            const [date, setDate] = useState(initialData?.date || new Date().toISOString().split('T')[0]);
            const [categoryId, setCategoryId] = useState(initialData?.categoryId || 'general');
            const [type, setType] = useState(initialData?.type || 'expense');
            const [loading, setLoading] = useState(false);

            const handleSave = async (e) => {
                e.preventDefault();
                if(!amount || isNaN(amount)) { setToast({message: 'กรุณากรอกจำนวนเงินให้ถูกต้อง', type: 'error'}); return; }
                
                setLoading(true);
                try {
                    await onSave({ amount: parseFloat(amount), merchant, date, categoryId, type, createdAt: new Date() });
                    setToast({message: 'บันทึกรายการสำเร็จ', type: 'success'});
                    go('HOME');
                } catch(err) {
                    setToast({message: 'เกิดข้อผิดพลาดในการบันทึก', type: 'error'});
                }
                setLoading(false);
            };

            return (
                <div className="flex-1 bg-white dark:bg-dark flex flex-col z-40 fade-in overflow-y-auto">
                    <div className="px-6 py-4 flex items-center justify-between sticky top-0 bg-white/90 dark:bg-dark/90 backdrop-blur-md z-10 border-b border-slate-100 dark:border-slate-800">
                        <button onClick={()=>go('HOME')} className="w-10 h-10 -ml-2 rounded-full flex items-center justify-center hover:bg-slate-100 dark:hover:bg-slate-800 active:scale-95 transition-colors"><Icon name="arrow-left" size={24}/></button>
                        <h2 className="text-lg font-bold">บันทึกรายการ</h2>
                        <div className="w-10"></div>
                    </div>

                    <form onSubmit={handleSave} className="p-6 flex flex-col gap-6 pb-24">
                        <div className="flex bg-slate-100 dark:bg-slate-800 rounded-xl p-1">
                            <button type="button" onClick={()=>setType('expense')} className={`flex-1 py-2 text-sm font-bold rounded-lg transition-all ${type==='expense' ? 'bg-white dark:bg-darkCard shadow text-danger' : 'text-slate-500'}`}>รายจ่าย</button>
                            <button type="button" onClick={()=>setType('income')} className={`flex-1 py-2 text-sm font-bold rounded-lg transition-all ${type==='income' ? 'bg-white dark:bg-darkCard shadow text-success' : 'text-slate-500'}`}>รายรับ</button>
                        </div>

                        <div className="bg-slate-50 dark:bg-darkCard rounded-2xl p-4 border border-slate-100 dark:border-slate-800 text-center">
                            <p className="text-xs text-slate-400 font-bold uppercase tracking-wider mb-2">จำนวนเงิน (บาท)</p>
                            <input type="number" step="0.01" value={amount} onChange={e=>setAmount(e.target.value)} required placeholder="0.00" className="w-full bg-transparent text-center text-4xl font-extrabold outline-none text-slate-800 dark:text-white" />
                        </div>

                        <div className="flex flex-col gap-4">
                            <div>
                                <label className="text-xs text-slate-500 font-bold mb-2 block">ชื่อรายการ / ร้านค้า</label>
                                <div className="relative">
                                    <div className="absolute left-4 top-1/2 -translate-y-1/2 text-slate-400"><Icon name="align-left" size={20}/></div>
                                    <input type="text" value={merchant} onChange={e=>setMerchant(e.target.value)} required placeholder="ระบุชื่อรายการ" className="w-full bg-slate-50 dark:bg-darkCard pl-12 pr-4 py-4 rounded-xl border border-slate-100 dark:border-slate-800 outline-none focus:border-primary transition-colors dark:text-white" />
                                </div>
                            </div>
                            
                            <div>
                                <label className="text-xs text-slate-500 font-bold mb-2 block">วันที่</label>
                                <div className="relative">
                                    <div className="absolute left-4 top-1/2 -translate-y-1/2 text-slate-400"><Icon name="calendar" size={20}/></div>
                                    <input type="date" value={date} onChange={e=>setDate(e.target.value)} required className="w-full bg-slate-50 dark:bg-darkCard pl-12 pr-4 py-4 rounded-xl border border-slate-100 dark:border-slate-800 outline-none focus:border-primary transition-colors dark:text-white" />
                                </div>
                            </div>
                        </div>

                        <div>
                            <label className="text-xs text-slate-500 font-bold mb-3 block">หมวดหมู่</label>
                            <div className="grid grid-cols-4 gap-4">
                                {CATEGORIES.map(cat => (
                                    <button type="button" key={cat.id} onClick={()=>setCategoryId(cat.id)} className={`flex flex-col items-center gap-2 p-2 rounded-xl transition-all ${categoryId === cat.id ? 'bg-primaryLight border-2 border-primary' : 'border-2 border-transparent hover:bg-slate-50 dark:hover:bg-slate-800'}`}>
                                        <div className="w-10 h-10 rounded-full flex items-center justify-center shrink-0" style={{backgroundColor: categoryId === cat.id ? cat.color : `${cat.color}20`, color: categoryId === cat.id ? '#fff' : cat.color}}>
                                            <Icon name={cat.icon} size={20} />
                                        </div>
                                        <span className="text-[10px] font-bold text-slate-600 dark:text-slate-300 text-center leading-tight">{cat.name}</span>
                                    </button>
                                ))}
                            </div>
                        </div>

                        <button type="submit" disabled={loading} className="w-full bg-primary text-white font-bold py-4 rounded-xl shadow-lg active:scale-95 transition-all mt-4 flex items-center justify-center gap-2">
                            {loading ? <div className="w-5 h-5 border-2 border-white/30 border-t-white rounded-full animate-spin"></div> : <Icon name="check" size={20}/>}
                            บันทึกข้อมูล
                        </button>
                    </form>
                </div>
            );
        };

        const HistoryScreen = ({ transactions }) => (
            <div className="flex-1 overflow-y-auto no-scrollbar pb-24 bg-white dark:bg-dark fade-in">
                <div className="px-6 py-8 pb-4 sticky top-0 bg-white/90 dark:bg-dark/90 backdrop-blur-md z-10 border-b border-slate-100 dark:border-slate-800">
                    <h1 className="text-2xl font-bold text-slate-800 dark:text-white">ประวัติการใช้จ่าย</h1>
                </div>
                
                <div className="px-6 pt-4 flex flex-col gap-3">
                    {transactions.length === 0 ? (
                        <div className="py-20 text-center text-slate-400">ยังไม่มีรายการใช้จ่าย</div>
                    ) : (
                        transactions.map(tx => {
                            const cat = getCategory(tx.categoryId);
                            return (
                                <div key={tx.id} className="bg-white dark:bg-darkCard p-4 rounded-2xl flex items-center gap-4 border border-slate-100 dark:border-slate-800">
                                    <div className="w-12 h-12 rounded-full flex items-center justify-center shrink-0" style={{backgroundColor: `${cat.color}20`, color: cat.color}}>
                                        <Icon name={cat.icon} size={20} />
                                    </div>
                                    <div className="flex-1 min-w-0">
                                        <h4 className="font-bold text-slate-800 dark:text-white truncate">{tx.merchant}</h4>
                                        <p className="text-xs text-slate-400">{formatDate(tx.date)}</p>
                                    </div>
                                    <div className="text-right shrink-0">
                                        <p className={`font-bold ${tx.type === 'expense' ? 'text-slate-800 dark:text-white' : 'text-success'}`}>
                                            {tx.type === 'expense' ? '-' : '+'}฿{formatMoney(tx.amount)}
                                        </p>
                                    </div>
                                </div>
                            )
                        })
                    )}
                </div>
            </div>
        );

        const ProfileScreen = ({ user, onLogout, toggleDark, isDark }) => (
            <div className="flex-1 bg-slate-50 dark:bg-dark fade-in overflow-y-auto pb-24">
                <div className="bg-primary px-6 pt-12 pb-16 rounded-b-[40px] shadow-sm text-center">
                    <div className="w-24 h-24 bg-white/20 rounded-full flex items-center justify-center text-white mx-auto mb-4 backdrop-blur-sm border-4 border-white/30 shrink-0">
                        <Icon name="user" size={40} />
                    </div>
                    <h2 className="text-white text-xl font-bold truncate px-4">{user?.isAnonymous ? 'ผู้เยี่ยมชม (Guest)' : user?.email}</h2>
                </div>

                <div className="px-6 -mt-8">
                    <div className="bg-white dark:bg-darkCard rounded-2xl p-2 soft-shadow border border-slate-100 dark:border-slate-800">
                        <div className="p-4 flex items-center justify-between border-b border-slate-100 dark:border-slate-800">
                            <div className="flex items-center gap-3">
                                <div className="w-10 h-10 bg-slate-100 dark:bg-slate-800 rounded-full flex items-center justify-center text-slate-600 dark:text-slate-300"><Icon name={isDark ? 'moon' : 'sun'} size={20}/></div>
                                <span className="font-bold text-slate-700 dark:text-white">โหมดมืด (Dark Mode)</span>
                            </div>
                            <div onClick={toggleDark} className={`w-12 h-7 flex items-center rounded-full p-1 cursor-pointer transition-colors duration-300 ${isDark ? 'bg-primary' : 'bg-slate-300'}`}>
                                <div className={`bg-white w-5 h-5 rounded-full shadow-sm transform transition-transform duration-300 ${isDark ? 'translate-x-5' : ''}`}></div>
                            </div>
                        </div>
                        
                        <button onClick={onLogout} className="w-full p-4 flex items-center gap-3 active:bg-slate-50 dark:active:bg-slate-800 transition-colors rounded-xl text-danger">
                            <div className="w-10 h-10 bg-danger/10 rounded-full flex items-center justify-center"><Icon name="log-out" size={20}/></div>
                            <span className="font-bold">ออกจากระบบ</span>
                        </button>
                    </div>
                </div>
            </div>
        );

        const BottomNav = ({ current, go }) => {
            if(['LOGIN', 'SCAN', 'ADD_TX'].includes(current)) return null;
            
            const navItems = [
                { id: 'HOME', icon: 'home', label: 'หน้าหลัก' },
                { id: 'HISTORY', icon: 'pie-chart', label: 'สถิติ' },
                { id: 'SCAN', icon: 'scan', label: 'สแกน', isFab: true },
                { id: 'WALLET', icon: 'wallet', label: 'กระเป๋า' },
                { id: 'PROFILE', icon: 'user', label: 'โปรไฟล์' }
            ];

            return (
                <div className="fixed bottom-0 left-0 w-full bg-white dark:bg-darkCard border-t border-slate-100 dark:border-slate-800 px-6 py-2 pb-safe flex justify-between items-center z-40 rounded-t-3xl shadow-[0_-10px_40px_rgba(0,0,0,0.05)] dark:shadow-[0_-10px_40px_rgba(0,0,0,0.3)]">
                    {navItems.map(item => {
                        const isActive = current === item.id;
                        if(item.isFab) {
                            return (
                                <button key={item.id} onClick={() => go(item.id)} className="relative -top-6 w-16 h-16 bg-primary text-white rounded-full flex items-center justify-center shadow-lg active:scale-95 transition-transform fab-shadow border-4 border-white dark:border-darkCard shrink-0">
                                    <Icon name={item.icon} size={28} />
                                </button>
                            );
                        }
                        return (
                            <button key={item.id} onClick={() => go(item.id)} className={`flex flex-col items-center gap-1 p-2 min-w-[60px] transition-colors shrink-0 ${isActive ? 'text-primary' : 'text-slate-400 hover:text-slate-600 dark:hover:text-slate-300'}`}>
                                <Icon name={item.icon} size={24} className={isActive ? 'fill-primary/20' : ''} />
                                <span className={`text-[10px] font-bold ${isActive ? 'opacity-100' : 'opacity-0'} transition-opacity`}>{item.label}</span>
                            </button>
                        );
                    })}
                </div>
            );
        };

        const App = () => {
            const [user, setUser] = useState(null);
            const [authLoading, setAuthLoading] = useState(true);
            const [screen, setScreen] = useState('LOGIN');
            const [transactions, setTransactions] = useState([]);
            const [scanResult, setScanResult] = useState(null);
            const [toast, setToast] = useState(null);
            const [isDark, setIsDark] = useState(false);

            useEffect(() => {
                if(isDark) document.documentElement.classList.add('dark');
                else document.documentElement.classList.remove('dark');
            }, [isDark]);

            // FIX: Safe useEffect for Firestore Subscription
            useEffect(() => {
                let unsubTx = null;
                const unsubscribeAuth = auth.onAuthStateChanged(usr => {
                    setUser(usr);
                    if (usr) {
                        setScreen('HOME');
                        unsubTx = db.collection('users').doc(usr.uid).collection('transactions')
                            .orderBy('date', 'desc').orderBy('createdAt', 'desc')
                            .onSnapshot(snap => {
                                const txs = snap.docs.map(doc => ({ id: doc.id, ...doc.data() }));
                                setTransactions(txs);
                            }, err => {
                                console.error("Firestore Error:", err);
                            });
                    } else {
                        setScreen('LOGIN');
                        setTransactions([]);
                        if(unsubTx) { unsubTx(); unsubTx = null; }
                    }
                    setAuthLoading(false);
                });
                
                return () => {
                    unsubscribeAuth();
                    if (unsubTx) unsubTx();
                };
            }, []);

            const go = useCallback((s) => setScreen(s), []);

            const handleSaveTx = async (txData) => {
                if(!user) throw new Error("No user");
                await db.collection('users').doc(user.uid).collection('transactions').add(txData);
            };

            const handleLogout = async () => {
                await auth.signOut();
            };

            if (authLoading) return <LoadingOverlay text="กำลังเตรียมระบบ..." />;

            return (
                <div className="app-container">
                    <Toast message={toast?.message} type={toast?.type} onClose={() => setToast(null)} />
                    
                    {screen === 'LOGIN' && <LoginScreen onLogin={() => go('HOME')} />}
                    {screen === 'HOME' && <HomeScreen transactions={transactions} userName={user?.isAnonymous ? 'Guest' : user?.email?.split('@')[0]} />}
                    {screen === 'HISTORY' && <HistoryScreen transactions={transactions} />}
                    {screen === 'WALLET' && <div className="flex-1 flex items-center justify-center text-slate-400 fade-in">ฟีเจอร์ Wallet เร็วๆนี้</div>}
                    {screen === 'PROFILE' && <ProfileScreen user={user} onLogout={handleLogout} toggleDark={()=>setIsDark(!isDark)} isDark={isDark} />}
                    
                    {screen === 'SCAN' && <ScanScreen go={go} setToast={setToast} onResult={(res) => { setScanResult(res); go('ADD_TX'); }} />}
                    
                    {screen === 'ADD_TX' && <AddTransactionScreen go={go} initialData={scanResult} onSave={handleSaveTx} setToast={setToast} />}

                    <BottomNav current={screen} go={go} />
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<ErrorBoundary><App /></ErrorBoundary>);
    </script>
</body>
</html>
