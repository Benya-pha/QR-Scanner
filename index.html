        const translateAuthError = (code) => {
            if(code.includes('api-key-not-valid')) return 'API Key ไม่ถูกต้อง';
            if(code.includes('operation-not-supported')) return 'ไม่ได้เปิดใช้งาน Email/Password Auth';
            switch(code) {
                case 'auth/invalid-credential':
                case 'auth/user-not-found':
                case 'auth/wrong-password': return 'อีเมลหรือรหัสผ่านไม่ถูกต้อง';
                case 'auth/email-already-in-use': return 'อีเมลนี้ถูกใช้งานแล้ว';

                case 'auth/invalid-email': return 'รูปแบบอีเมลไม่ถูกต้อง';
                default: return `เกิดข้อผิดพลาด: ${code}`;

        const Icon = ({ name, size=24, className="", strokeWidth=2 }) => {
            const spanRef = useRef(null);
            useEffect(() => {

                    try {
                        spanRef.current.innerHTML = `<i data-lucide="${name}" class="${className}"></i>`;
                        lucide.createIcons({ root: spanRef.current, attrs: { 'stroke-width': strokeWidth, size: size } }); 
                    } catch (e) {
                        spanRef.current.innerHTML = `<span style="display:inline-block; width:${size}px; height:${size}px; background:#e2e8f0; border-radius:50%;"></span>`;
                    }
                }
            }, [name, size, strokeWidth, className]);
            return <span ref={spanRef} style={{display:'inline-flex', alignItems:'center', justifyContent:'center', width: size, height: size}}></span>;
        };

        const LoadingOverlay = ({ text, Icon }) => (
            <div className="absolute inset-0 bg-[#0f172a]/90 backdrop-blur-md z-[100] flex flex-col items-center justify-center text-white fade-in">
                <Icon name="loader-2" size={48} className="animate-spin text-[#F472B6] mb-6"/>
                <h2 className="font-black text-lg tracking-widest uppercase">{text}</h2>
            </div>
        );

        const getDeviceName = () => {
            const ua = navigator.userAgent;
            if (/iPhone|iPod/.test(ua)) return 'iPhone';
            if (/iPad/.test(ua)) return 'iPad';
            if (/android/i.test(ua)) return 'Android Device';
            if (/Macintosh/.test(ua)) return 'Mac';
            if (/Windows/.test(ua)) return 'Windows PC';
            return 'Web Browser';
        };

        const categorizeText = (text) => {
            const tText = text.toLowerCase();
            if (tText.match(/น้ำปั่น|ครัว|coffee|คาเฟ่|อาหาร|เครื่องดื่ม|ข้าว|ชา|นม|food|drink|ปลา|หมู|ไก่|เนื้อ|กุ้ง|เบเกอรี่|ขนม|เค้ก|ชาบู|ปิ้งย่าง|สุกี้|restaurant|cafe/)) return { cat: 'Food & Drink', iconType: 'lucide', icon: 'coffee', colType: 'hex', col: '#ff9800' };
            if (tText.match(/shop|ร้าน|ช้อป|โลตัส|เซเว่น|7-11|บิ๊กซี|มินิมาร์ท|ซื้อ|mart|ค้า|supermarket|mall|store/)) return { cat: 'Shopping', iconType: 'lucide', icon: 'shopping-bag', colType: 'hex', col: '#e91e63' };
            if (tText.match(/นาย|นาง|น\.ส\.|ด\.ช\.|ด\.ญ\.|คุณ|โอนเงิน/)) return { cat: 'Transfer', iconType: 'lucide', icon: 'users', colType: 'hex', col: '#2196f3' };
            if (tText.match(/บิล|การไฟฟ้า|การประปา|ais|true|dtac|ค่าเน็ต|ค่าไฟ|ค่าน้ำ|bill|ประกัน|สินเชื่อ|บัตรเครดิต|ชำระ/)) return { cat: 'Bills', iconType: 'lucide', icon: 'zap', colType: 'hex', col: '#ffc107' };
            if (tText.match(/น้ำมัน|ปั๊ม|ptt|pt|shell|bangchak|caltex|gas/)) return { cat: 'Transport', iconType: 'lucide', icon: 'car', colType: 'hex', col: '#00bcd4' };
            return { cat: 'General', iconType: 'lucide', icon: 'receipt', colType: 'hex', col: '#64748b' };
        };

        const processReceiptImage = async (file, onComplete) => {
            try {
                const worker = await Tesseract.createWorker('tha+eng');
                const ret = await worker.recognize(file);
                const rawText = ret.data.text;
                const lines = rawText.split('\n').map(l => l.trim()).filter(l => l.length > 0);
                await worker.terminate();

                let finalAmount = ''; let merchant = ''; let dateStr = new Date().toLocaleDateString('th-TH'); let memoText = '';

                const amountRegex = /(?:จำนวนเงิน|จำนวน|ยอดรวม|ยอดเงิน|รวมทั้งสิ้น|Total|Amount|฿|B)[^\d]*(\d{1,3}(?:,\d{3})*(?:\.\d{2})?)/i;
                for(let line of lines) {
                    const match = line.match(amountRegex);
                    if(match && match[1]) { finalAmount = parseFloat(match[1].replace(/,/g, '')).toFixed(2); break; }
                }
                if (!finalAmount || finalAmount === '0.00') {
                    const numbers = rawText.match(/\b\d{1,3}(?:,\d{3})*\.\d{2}\b/g);
                    if (numbers && numbers.length > 0) {
                        const vals = numbers.map(n => parseFloat(n.replace(/,/g, '')));
                        finalAmount = Math.max(...vals).toFixed(2);
                    }
                }

                let foundTo = false;
                for (let i = 0; i < lines.length; i++) {
                    const line = lines[i];
                    if (line.match(/(บันทึกช่วยจำ|บันทึก|Memo)/i)) {
                        const cleanMemo = line.replace(/(บันทึกช่วยจำ|บันทึก|Memo)[\s.:]*/i, '').trim();
                        if (cleanMemo) memoText = cleanMemo; else if (i + 1 < lines.length) memoText = lines[i+1];
                    }
                    const dateMatch = line.match(/(\d{1,2}[\/\-\. ]\d{1,2}[\/\-\. ]\d{2,4})|(\d{1,2}\s+(ม\.ค\.|ก\.พ\.|มี\.ค\.|เม\.ย\.|พ\.ค\.|มิ\.ย\.|ก\.ค\.|ส\.ค\.|ก\.ย\.|ต\.ค\.|พ\.ย\.|ธ\.ค\.|มกราคม|กุมภาพันธ์|มีนาคม|เมษายน|พฤษภาคม|มิถุนายน|กรกฎาคม|สิงหาคม|กันยายน|ตุลาคม|พฤศจิกายน|ธันวาคม)\s+\d{2,4})/);
                    if(dateMatch) dateStr = dateMatch[0];
                    if (line.match(/^(ถึง|ไปยัง|ผู้รับโอน|ชื่อบัญชี|To)/i)) {
                        let cleanMerchant = line.replace(/^(ถึง|ไปยัง|ผู้รับโอน|ชื่อบัญชี|To)[\s.:]*/i, '').trim();
                        if (cleanMerchant.length < 3 && i + 1 < lines.length) cleanMerchant = lines[i+1].trim();
                        cleanMerchant = cleanMerchant.replace(/(ธนาคาร|พร้อมเพย์|PromptPay|KBank|SCB|KTB|BBL|GSB)/ig, '').trim();
                        if (cleanMerchant.length > 2) { merchant = cleanMerchant; foundTo = true; }
                    }
                    if (!foundTo && !merchant && line.match(/(นาย|นาง|น\.ส\.|บจก|หจก|บริษัท|ร้าน|SHOP|ครัว|คาเฟ่|cafe|มินิมาร์ท|ตลาด)/i)) {
                         if(!line.match(/^(จาก|ผู้โอน)/i)) merchant = line.replace(/^(จาก|ผู้โอน)[\s.:]*/i, '').trim();
                    }
                }
                if (!merchant && finalAmount) {
                    if(lines.length > 0) merchant = lines[0];
                    if(merchant.match(/ใบเสร็จ|Receipt|รับเงิน/i) && lines.length > 1) merchant = lines[1];
                }

                let finalTitle = memoText || merchant || 'รายการใช้จ่าย';
                finalTitle = finalTitle.replace(/(รหัสอ้างอิง|เลขอ้างอิง|Ref|วันที่).*/i, '').trim();
                const categoryInfo = categorizeText(finalTitle + ' ' + rawText);

                if (typeof file === 'string') {
                    onComplete({ amount: finalAmount || '', merchant: finalTitle, date: dateStr, categoryKey: categoryInfo.cat, iconType: categoryInfo.iconType, icon: categoryInfo.icon, colorType: categoryInfo.colType, color: categoryInfo.col, isAuto: true, imageUrl: file });
                } else {
                    const reader = new FileReader();
                    reader.onload = (ev) => onComplete({ amount: finalAmount || '', merchant: finalTitle, date: dateStr, categoryKey: categoryInfo.cat, iconType: categoryInfo.iconType, icon: categoryInfo.icon, colorType: categoryInfo.colType, color: categoryInfo.col, isAuto: true, imageUrl: ev.target.result });
                    reader.readAsDataURL(file);
                }
            } catch (error) {
                let imgData = null;
                if (typeof file === 'string') imgData = file;
                else if (file instanceof Blob) {
                    const reader = new FileReader();
                    reader.onload = (e) => onComplete({ amount: '', merchant: '', date: new Date().toLocaleDateString('th-TH'), categoryKey: 'General', iconType: 'lucide', icon: 'receipt', colorType: 'hex', color: '#64748b', isAuto: false, imageUrl: e.target.result });
                    reader.readAsDataURL(file);
                    return;
                }
                onComplete({ amount: '', merchant: '', date: new Date().toLocaleDateString('th-TH'), categoryKey: 'General', iconType: 'lucide', icon: 'receipt', colorType: 'hex', color: '#64748b', isAuto: false, imageUrl: imgData });
            }
        };

                <div className="p-6 pt-12 flex flex-col h-full bg-[#FAFAF9] fade-in relative">
                    {viewImage && tx.imageUrl && (<div className="absolute inset-0 bg-black/90 z-[100] flex flex-col fade-in pb-10"><div className="p-6 pt-12 flex justify-between items-center w-full"><button onClick={()=>setViewImage(false)} className="text-white bg-white/20 p-2 rounded-full"><Icon name="x" size={24}/></button></div><div className="flex-1 flex items-center justify-center p-4"><img src={tx.imageUrl} className="max-w-full max-h-full rounded-2xl object-contain shadow-2xl" /></div></div>)}
                    <div className="flex items-center justify-between mb-8"><button onClick={()=>go('MAIN','HISTORY')} className="text-[#FFB6C1]"><Icon name="arrow-left" size={24}/></button><h2 className="font-bold text-slate-800 text-lg">{t('txDetail')}</h2><div className="w-6"></div></div>
                    <div className="flex-1 overflow-y-auto no-scrollbar space-y-6 pb-6">
                        <div className="flex flex-col items-center mb-2"><div className="mb-4 shadow-sm"><PocketIcon pocket={tx} size={36} /></div><h1 className="text-4xl font-black text-slate-800 mb-2">-฿{formatMoney(Math.abs(tx.amount))}</h1><p className="font-bold text-slate-500 text-sm text-center">{tx.title || tx.merchant}</p></div>
                        <div className="bg-white rounded-[32px] p-6 border border-slate-100 shadow-sm space-y-5">
                            <div className="flex justify-between items-center border-b border-slate-50 pb-4"><span className="text-[10px] font-bold text-slate-400 uppercase tracking-widest">{t('status')}</span><span className="bg-[#E2F0E5] text-[#4A7D59] font-bold text-[10px] px-3 py-1 rounded-full">{t('completed')}</span></div>
                            <div className="flex justify-between items-center border-b border-slate-50 pb-4"><span className="text-[10px] font-bold text-slate-400 uppercase tracking-widest">{t('date')}</span><span className="font-bold text-slate-700 text-xs">{tx.date}</span></div>
                            <div className="flex justify-between items-center"><span className="text-[10px] font-bold text-slate-400 uppercase tracking-widest">{t('category')}</span><span className="font-bold text-[#4A7D59] bg-[#E2F0E5] px-3 py-1 rounded-full text-[10px] flex items-center gap-1.5"><Icon name={tx.icon||'coffee'} size={12}/> {tx.category}</span></div>
                        </div>
                        {tx.notes && (<div className="bg-white rounded-[32px] p-6 border border-slate-100 shadow-sm"><h4 className="text-[10px] font-bold text-slate-400 uppercase mb-2 flex items-center gap-1"><Icon name="align-left" size={14}/> {t('notes')}</h4><p className="text-sm font-bold text-slate-700">{tx.notes}</p></div>)}
                        <div className="flex gap-4">
                            <button onClick={()=>go('SPLIT_BILL', null, tx)} className="flex-1 bg-[#FCEAEF] text-[#9D4D63] font-bold py-4 rounded-[24px] shadow-sm flex justify-center gap-2"><Icon name="split-square-horizontal" size={18}/> {t('splitBill')}</button>
                            {tx.imageUrl && (<button onClick={()=>setViewImage(true)} className="flex-1 bg-white border border-slate-200 text-slate-600 font-bold py-4 rounded-[24px] shadow-sm flex justify-center gap-2"><Icon name="image" size={18}/> {t('viewReceipt')}</button>)}
                        </div>
                    </div>
                </div>
            );
        };

        const SplitBillScreen = ({ tx, go, t }) => {
            const billTotal = Number(tx?.amount || 0);
            const [friends, setFriends] = useState([{id:1, name:'ฉัน', amount:billTotal/2}, {id:2, name:'เพื่อน 1', amount:billTotal/2}]);
            const currentSum = friends.reduce((a,c)=>a+Number(c.amount), 0); const isMatch = Math.abs(currentSum - billTotal) < 0.01;
            const updateAmount = (id, val) => setFriends(friends.map(f=>f.id===id?{...f, amount:val}:f));

            return (
                <div className="p-6 pt-10 flex flex-col h-full bg-[#F7F9FC] fade-in">
                    <div className="flex items-center mb-8"><button onClick={()=>go('TX_DETAIL', null, tx)} className="w-10 h-10 bg-white rounded-full flex items-center justify-center shadow-sm"><Icon name="chevron-left"/></button><h2 className="font-black text-lg ml-4">{t('splitBill')}</h2></div>
                    <div className="bg-white p-6 rounded-[36px] shadow-sm border border-slate-100 text-center mb-6"><p className="text-[10px] font-bold text-slate-400 uppercase tracking-widest">{t('totalAmount')}</p><h1 className="text-4xl font-black text-slate-800 my-2">฿{formatMoney(billTotal)}</h1><div className="flex justify-between items-center mt-4 px-4 bg-slate-50 py-3 rounded-2xl"><span className="text-xs font-bold text-slate-500">แบ่งแล้ว: ฿{formatMoney(currentSum)}</span><span className={`text-xs font-black ${isMatch?'text-green-500':'text-red-500'}`}>เหลือ: ฿{formatMoney(Math.max(billTotal-currentSum, 0))}</span></div></div>
                    <div className="flex-1 overflow-y-auto no-scrollbar space-y-3 pb-6">
                        {friends.map(f => (<div key={f.id} className="bg-white p-4 rounded-[24px] border border-slate-100 flex items-center shadow-sm"><div className="flex-1 ml-3 font-bold text-slate-700 text-sm">{f.name}</div><div className="bg-slate-50 px-3 py-2 rounded-xl flex items-center"><span className="text-xs font-bold text-slate-400">฿</span><input type="number" value={f.amount} onChange={e=>updateAmount(f.id, e.target.value)} className="w-16 bg-transparent text-right font-black text-[#2F80ED] outline-none"/></div>{f.name!=='ฉัน' && <button onClick={()=>setFriends(friends.filter(x=>x.id!==f.id))} className="ml-2 text-slate-300 hover:text-red-500 p-2"><Icon name="x" size={18}/></button>}</div>))}
                        <button onClick={()=>setFriends([...friends,{id:Date.now(), name:`เพื่อน ${friends.length+1}`, amount:0}])} className="w-full py-4 border-2 border-dashed border-[#2F80ED]/30 rounded-[24px] text-[#2F80ED] font-black flex items-center justify-center gap-2"><Icon name="plus" size={18}/> {t('addFriend')}</button>
                    </div>
                    <button disabled={!isMatch} onClick={()=>go('MAIN','HISTORY')} className={`w-full py-5 rounded-[24px] font-black text-white shadow-xl ${isMatch?'bg-[#2F80ED]':'bg-slate-300'}`}>{t('confirmSplit')}</button>
                </div>
            );
        };

        const App = () => {
            const [isAuthReady, setIsAuthReady] = useState(false); const [user, setUser] = useState(null);
            const [screen, setScreen] = useState('SIGN_IN'); const [tab, setTab] = useState('HOME'); const [screenData, setScreenData] = useState(null);
            const [lang, setLang] = useState('EN'); const [themeMode, setThemeMode] = useState('Light'); const [reduceMotion, setReduceMotion] = useState(false);
            const [pinCode, setPinCode] = useState(localStorage.getItem('cozy_pin')); const [isLocked, setIsLocked] = useState(!!localStorage.getItem('cozy_pin')); const [showPinModal, setShowPinModal] = useState(false);
            const [txs, setTxs] = useState([]); const [pockets, setPockets] = useState([]); const [dismissedNotifs, setDismissedNotifs] = useState([]);
            const defaultCatIds = ['Food & Drink', 'Shopping', 'Transport', 'Bills'];
            const [userCategories, setUserCategories] = useState([{ id: 'Food & Drink', icon: 'coffee', color: '#ff9800' },{ id: 'Shopping', icon: 'shopping-bag', color: '#e91e63' },{ id: 'Transport', icon: 'car', color: '#00bcd4' },{ id: 'Bills', icon: 'zap', color: '#ffc107' }]);
            
            const t = useCallback((key) => getT(lang)(key), [lang]);
            const go = useCallback((s, tb = null, data = null) => { setScreen(s); if(tb) setTab(tb); if(data!==undefined) setScreenData(data); }, []);

            useEffect(() => {
                const unsub = auth.onAuthStateChanged(u => {
                    setIsAuthReady(true);
                    if(u) {
                        db.collection('users').doc(u.uid).onSnapshot(doc => { const d = doc.data() || {}; setUser({ uid: u.uid, email: u.email, displayName: d.displayName || u.email.split('@')[0], photoURL: d.photoURL || 'https://ui-avatars.com/api/?name=U&background=F472B6&color=fff', bio: d.bio || '' }); });
                        if(!isLocked) go('MAIN', 'HOME');
                        db.collection('users').doc(u.uid).collection('transactions').orderBy('timestamp', 'desc').onSnapshot(snap => setTxs(snap.docs.map(d => ({ id: d.id, ...d.data() }))));
                        db.collection('users').doc(u.uid).collection('pockets').onSnapshot(snap => setPockets(snap.docs.map(d => ({ id: d.id, ...d.data() }))));
                    } else {
                        const localGuest = localStorage.getItem('cozy_guest');
                        if (localGuest) { setUser(JSON.parse(localGuest)); if(!isLocked) go('MAIN', 'HOME'); } else { go('SIGN_IN'); setTxs([]); setPockets([]); setDismissedNotifs([]); }
                    }
                });
                return unsub;
            }, [go, isLocked]);

            const safeToSpend = useMemo(() => pockets.reduce((a,c) => a + Number(c.balance), 0), [pockets]);
            const notifications = useMemo(() => {
                const notifs = [];
                if (safeToSpend > 0 && safeToSpend <= 500) notifs.push({ id: 'low-bal', type: 'alert', title: t('lowBalance'), desc: t('safeThreshold'), time: 'Now' });
                pockets.filter(p => p.hasTarget && Number(p.target) > Number(p.balance)).forEach(p => { notifs.push({ id: `pocket-${p.id}`, type: 'calendar', title: t('billReminder'), desc: `${p.name} ขาดอีก ฿${formatMoney(p.target - p.balance)}`, time: 'Target' }); });
                if (txs.length > 0) { const latest = txs[0]; notifs.push({ id: `tx-${latest.id}`, type: 'receipt', title: t('newTx'), desc: `${latest.title} ฿${formatMoney(latest.amount)}`, time: latest.date }); }
                return notifs.filter(n => !dismissedNotifs.includes(n.id));
            }, [safeToSpend, pockets, txs, t, dismissedNotifs]);

            if (!isAuthReady) return <div className="flex justify-center items-center h-screen w-screen bg-[#0f172a] text-[#F472B6]"><Icon name="loader-2" size={48} className="animate-spin"/></div>;
            if (isLocked) return <div className="app-container bg-[#FCFBFA]"><LockScreen Icon={Icon} correctPin={pinCode} onUnlock={()=>{ setIsLocked(false); go(user?'MAIN':'SIGN_IN', user?'HOME':null); }} /></div>;

            const p = { user, setUser, go, t, lang, setLang, themeMode, setThemeMode, reduceMotion, setReduceMotion, pinCode, setPinCode, showPinModal, setShowPinModal, txs, setTxs, pockets, setPockets, screenData, Icon, LoadingOverlay, translateAuthError, visibleNotifications: notifications, clearAllNotifs: ()=>setDismissedNotifs(notifications.map(n=>n.id)), safeToSpend, db, userCategories, setUserCategories, defaultCatIds };

            return (
                <div className={`app-container ${reduceMotion?'no-motion':''} ${themeMode==='Dark'?'theme-dark':'bg-[#FAFAF9]'}`}>
                    {screen === 'SIGN_IN' && <LoginScreen {...p} />}
                    {screen === 'SIGN_UP' && <SignUpScreen {...p} />}
                    {screen === 'FORGOT_PASS' && <ForgotScreen {...p} />}
                    {screen === 'MAIN' && (
                        <MainLayout {...p} tab={tab}>
                            {tab === 'HOME' && <HomeScreen {...p} />}
                            {tab === 'POCKETS' && <PocketsScreen {...p} />}
                            {tab === 'HISTORY' && <HistoryScreen {...p} />}
                            {tab === 'PROFILE' && <ProfileScreen {...p} onLogout={()=>{ auth.signOut(); localStorage.removeItem('cozy_guest'); setUser(null); go('SIGN_IN'); }} />}
                        </MainLayout>
                    )}
                    {screen === 'NOTIFICATIONS' && <NotificationsScreen {...p} />}
                    {screen === 'SCAN' && <ScanScreen {...p} onNext={(d)=>go('REVIEW', null, d)} />}
                    {screen === 'REVIEW' && <ReviewScreen {...p} onConfirm={async (d)=>{ 
                        if(user && user.uid !== 'mock-uid') {
                            await db.collection('users').doc(user.uid).collection('transactions').add({...d, timestamp: firebase.firestore.FieldValue.serverTimestamp()});
                            if (d.pocketId && d.pocketId !== 'none') { const pkt = pockets.find(pk => pk.id === d.pocketId); if (pkt) await db.collection('users').doc(user.uid).collection('pockets').doc(d.pocketId).update({ balance: pkt.balance - d.amount }); }
                        } else {
                            setTxs([{id: Date.now().toString(), ...d}, ...txs]);
                            if (d.pocketId && d.pocketId !== 'none') setPockets(pockets.map(pk => pk.id === d.pocketId ? {...pk, balance: pk.balance - d.amount} : pk));
                        }
                        go('MAIN','HISTORY'); 
                    }} />}
                    {screen === 'ADD_TX' && <AddTxScreen {...p} onSave={async (d)=>{ 
                        if(user && user.uid !== 'mock-uid') {
                            await db.collection('users').doc(user.uid).collection('transactions').add({...d, timestamp: firebase.firestore.FieldValue.serverTimestamp()});
                            if (d.pocketId && d.pocketId !== 'none') { const pkt = pockets.find(pk => pk.id === d.pocketId); if (pkt) await db.collection('users').doc(user.uid).collection('pockets').doc(d.pocketId).update({ balance: pkt.balance - d.amount }); }
                        } else {
                            setTxs([{id: Date.now().toString(), ...d}, ...txs]); 
                            if (d.pocketId && d.pocketId !== 'none') setPockets(pockets.map(pk => pk.id === d.pocketId ? {...pk, balance: pk.balance - d.amount} : pk));
                        }
                        go('MAIN','HISTORY'); 
                    }} />}
                    {screen === 'TX_DETAIL' && <TxDetailScreen {...p} tx={screenData || txs[0]} />}
                    {screen === 'SPLIT_BILL' && <SplitBillScreen {...p} tx={screenData || txs[0]} />}
                    {screen === 'ADD_POCKET' && <AddPocketScreen {...p} onSave={async (pData)=>{ 
                        if(user && user.uid !== 'mock-uid') { await db.collection('users').doc(user.uid).collection('pockets').add({...pData, timestamp: firebase.firestore.FieldValue.serverTimestamp()}); } else setPockets([...pockets, {id: Date.now().toString(), ...pData}]); 
                        go('MAIN', 'POCKETS'); 
                    }} />}
                    {screen === 'POCKET_DETAILS' && <PocketDetailsScreen {...p} pocket={screenData || pockets[0]} />}
                    {screen === 'POCKET_SETTINGS' && <PocketSettingsScreen {...p} pocket={screenData} onUpdate={async (id, data)=>{
                        if(user && user.uid !== 'mock-uid') { await db.collection('users').doc(user.uid).collection('pockets').doc(id).set(data, {merge: true}); } else setPockets(pockets.map(p => p.id === id ? {...p, ...data} : p));
                        go('POCKET_DETAILS', null, {...screenData, ...data});
                    }} onDelete={async (id)=>{
                        if(user && user.uid !== 'mock-uid') { await db.collection('users').doc(user.uid).collection('pockets').doc(id).delete(); } else setPockets(pockets.filter(p => p.id !== id));
                        go('MAIN', 'POCKETS');
                    }} />}
                    {screen === 'EDIT_PROFILE' && <EditProfileScreen {...p} />}
                    {screen === 'SECURITY' && <SecuritySettingsScreen {...p} />}
                    {screen === 'LANGUAGE' && <LanguageSettingsScreen {...p} />}
                    {screen === 'THEME' && <ThemeSettingsScreen {...p} />}
                    {showPinModal && <PinPadModal onClose={()=>setShowPinModal(false)} onSave={(pin)=>{ setPinCode(pin); localStorage.setItem('cozy_pin', pin); setShowPinModal(false); }} Icon={Icon} isSet={!!pinCode} t={t} />}
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<ErrorBoundary><App /></ErrorBoundary>);
    </script>
</body>
</html>
