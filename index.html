            if (/Windows/.test(ua)) {

            try {
                const worker = await Tesseract.createWorker('tha+eng'); const ret = await worker.recognize(file); const rawText = ret.data.text; const lines = rawText.split('\n').map(l => l.trim()).filter(l => l.length > 0); await worker.terminate();
                let finalAmount = ''; let merchant = ''; let dateStr = new Date().toISOString().split('T')[0]; let memoText = '';

                for(let line of lines) { const match = line.match(amountRegex); if(match && match[1]) { finalAmount = parseFloat(match[1].replace(/,/g, '')).toFixed(2); break; } }
                if (!finalAmount || finalAmount === '0.00') { const numbers = rawText.match(/\b\d{1,3}(?:,\d{3})*\.\d{2}\b/g); if (numbers && numbers.length > 0) { const vals = numbers.map(n => parseFloat(n.replace(/,/g, ''))); finalAmount = Math.max(...vals).toFixed(2); } }
                let foundTo = false;
                for (let i = 0; i < lines.length; i++) {
                    const line = lines[i];
                    if (line.match(/(บันทึกช่วยจำ|บันทึก|Memo)/i)) { const cleanMemo = line.replace(/(บันทึกช่วยจำ|บันทึก|Memo)[\s.:]*/i, '').trim(); if (cleanMemo) memoText = cleanMemo; else if (i + 1 < lines.length) memoText = lines[i+1]; }
                    const dateMatch = line.match(/(\d{4}[\/\-]\d{1,2}[\/\-]\d{1,2})|(\d{1,2}[\/\-\. ]\d{1,2}[\/\-\. ]\d{2,4})/);
                    if(dateMatch) {

                        if(d.includes('/')) d = d.split('/').reverse().join('-');
                        dateStr = d;

                const categoryInfo = categorizeText(finalTitle + ' ' + rawText);

                if (typeof file === 'string') { onComplete({ ...resultData, imageUrl: file }); }

            return (
                <div className="p-6 pt-10 fade-in pb-24">
                    <h2 className="text-2xl font-bold mb-8 dark:text-white">{t('profile')}</h2>
                    
                    <div className="bg-white dark:bg-slate-800 rounded-[28px] p-6 soft-shadow border border-slate-100 dark:border-slate-700 mb-8">
                        <div className="flex items-center gap-4 mb-6">
                            <div className="rounded-full overflow-hidden border border-slate-100 dark:border-slate-800 shadow-sm w-16 h-16 flex items-center justify-center bg-white"><img src={user?.photoURL} className="w-full h-full object-cover"/></div>
                            <div><h3 className="font-bold text-lg dark:text-white">{user?.displayName}</h3><p className="text-[10px] font-bold text-slate-400 uppercase tracking-widest">{user?.email}</p></div>
                        </div>
                        <button onClick={()=>go('EDIT_PROFILE')} className="w-full bg-slate-50 dark:bg-slate-700 text-slate-600 dark:text-slate-300 font-bold py-3 rounded-full active:scale-95 transition-transform hover:bg-slate-100">{t('editProfile')}</button>
                    </div>

                    <div className="space-y-6">
                        <div className="bg-white dark:bg-slate-800 rounded-[28px] p-6 soft-shadow border border-slate-100 dark:border-slate-700">
                            <h3 className="text-[10px] font-bold text-slate-400 mb-4 uppercase tracking-widest">{t('accountTitle')}</h3>
                            <div className="space-y-2">
                                <MenuItem icon="shield" label={t('security')} onClick={()=>go('SECURITY')} />
                                <MenuItem icon="lock" label={pinCode ? `${t('pinCode')}: ${t('pinStatusSet')}` : `${t('pinCode')}: ${t('pinStatusNotSet')}`} onClick={()=>setShowPinModal(true)} />
                            </div>
                        </div>

                        <div className="bg-white dark:bg-slate-800 rounded-[28px] p-6 soft-shadow border border-slate-100 dark:border-slate-700">
                            <h3 className="text-[10px] font-bold text-slate-400 mb-4 uppercase tracking-widest">{t('preferencesTitle')}</h3>
                            <div className="space-y-2">
                                <MenuItem icon="globe" label={t('language')} onClick={()=>go('LANGUAGE')} />
                                <MenuItem icon="palette" label={t('theme')} onClick={()=>go('THEME')} />
                                <MenuItem icon="bell" label={t('notifications')} onClick={()=>go('NOTIFICATION_SETTINGS')} />
                            </div>
                        </div>

                        <button onClick={onLogout} className="w-full bg-danger/10 text-danger font-bold py-4 rounded-full active:scale-95 transition-transform hover:bg-danger/20">{t('logout')}</button>
                    </div>
                </div>
            );
        };

        const EditProfileScreen = ({ go, user, t, Icon }) => {
            const [name, setName] = useState(user?.displayName || ''); const [bio, setBio] = useState(user?.bio || '');
            return (
                <div className="p-6 pt-12 h-full flex flex-col fade-in bg-[var(--bg-color)]">
                    <div className="flex items-center justify-between mb-8"><button onClick={()=>go('MAIN','PROFILE')} className="w-10 h-10 bg-white dark:bg-slate-800 shadow-sm border border-slate-100 dark:border-slate-700 rounded-full flex items-center justify-center active:scale-95 dark:text-white hover:bg-slate-50 transition-colors"><Icon name="arrow-left" size={20} /></button><h2 className="font-bold text-xl dark:text-white">{t('editProfile')}</h2><div className="w-10"></div></div>
                    <div className="flex-1 overflow-y-auto no-scrollbar space-y-6 pb-6">
                        <div className="bg-white dark:bg-slate-800 rounded-[28px] p-6 soft-shadow border border-slate-100 dark:border-slate-700">
                            <div className="flex items-center gap-4 mb-6">
                                <div className="rounded-full overflow-hidden border border-slate-100 dark:border-slate-800 shadow-sm w-16 h-16 flex items-center justify-center bg-white"><img src={user?.photoURL} className="w-full h-full object-cover"/></div>
                                <button className="flex flex-col items-center gap-2 group"><div className="w-12 h-12 bg-slate-50 dark:bg-slate-700 rounded-full flex items-center justify-center active:scale-95 transition-all shadow-sm dark:text-white group-hover:bg-slate-100"><Icon name="camera" size={18}/></div><span className="text-[9px] font-bold uppercase text-slate-400 tracking-widest">{t('tapToUpload')}</span></button>
                            </div>
                            <div className="space-y-4">
                                <div><label className="text-[10px] font-bold text-slate-500 uppercase tracking-widest ml-1 block mb-2">{t('name')}</label><div className="bg-slate-50 dark:bg-slate-700 p-3.5 rounded-2xl flex items-center focus-within:ring-2 ring-primary/20 transition-colors"><Icon name="user" size={16} className="text-primary mr-3" /><input value={name} onChange={e=>setName(e.target.value)} className="w-full bg-transparent font-bold text-sm outline-none dark:text-white" /></div></div>
                                <div><label className="text-[10px] font-bold text-slate-500 uppercase tracking-widest ml-1 block mb-2">{t('bio')}</label><textarea value={bio} onChange={e=>setBio(e.target.value)} className="w-full bg-slate-50 dark:bg-slate-700 p-3.5 rounded-2xl font-bold text-sm outline-none focus:ring-2 ring-primary/20 transition-colors dark:text-white resize-none h-24" placeholder="Tell us about yourself" /></div>
                            </div>
                        </div>
                    </div>
                    <button className="w-full bg-primary text-white font-bold py-4 rounded-full active:scale-95 transition-transform hover:shadow-lg">{t('saveChanges')}</button>
                </div>
            );
        };

        const SecuritySettingsScreen = ({ go, t, Icon }) => {
            return (
                <div className="p-6 pt-12 h-full flex flex-col fade-in bg-[var(--bg-color)]">
                    <div className="flex items-center justify-between mb-8"><button onClick={()=>go('MAIN','PROFILE')} className="w-10 h-10 bg-white dark:bg-slate-800 shadow-sm border border-slate-100 dark:border-slate-700 rounded-full flex items-center justify-center active:scale-95 dark:text-white hover:bg-slate-50 transition-colors"><Icon name="arrow-left" size={20} /></button><h2 className="font-bold text-xl dark:text-white">{t('security')}</h2><div className="w-10"></div></div>
                    <div className="flex-1 overflow-y-auto no-scrollbar space-y-6 pb-6">
                        <Section title={t('yourDevices')}>
                            <div className="p-4 flex items-center justify-between border-b border-slate-100 dark:border-slate-700 last:border-0">
                                <div className="flex items-center gap-3"><Icon name="smartphone" size={20} className="text-primary" /><div><p className="font-bold text-sm dark:text-white">{getDeviceName()}</p><p className="text-[10px] font-bold text-slate-400 uppercase tracking-widest">{t('currentDevice')}</p></div></div>
                                <span className="text-xs font-bold text-primary">{t('activeNow')}</span>
                            </div>
                        </Section>
                        <button className="w-full bg-danger/10 text-danger font-bold py-4 rounded-full active:scale-95 transition-transform hover:bg-danger/20">{t('changePass')}</button>
                    </div>
                </div>
            );
        };

        const LanguageSettingsScreen = ({ go, lang, setLang, t, Icon }) => {
            const languages = [{ code: 'TH', name: 'ไทย' }, { code: 'EN', name: 'English' }];
            return (
                <div className="p-6 pt-12 h-full flex flex-col fade-in bg-[var(--bg-color)]">
                    <div className="flex items-center justify-between mb-8"><button onClick={()=>go('MAIN','PROFILE')} className="w-10 h-10 bg-white dark:bg-slate-800 shadow-sm border border-slate-100 dark:border-slate-700 rounded-full flex items-center justify-center active:scale-95 dark:text-white hover:bg-slate-50 transition-colors"><Icon name="arrow-left" size={20} /></button><h2 className="font-bold text-xl dark:text-white">{t('language')}</h2><div className="w-10"></div></div>
                    <div className="flex-1 overflow-y-auto no-scrollbar space-y-3 pb-6">
                        {languages.map(lng => (
                            <button key={lng.code} onClick={()=>setLang(lng.code)} className={`w-full p-4 rounded-[24px] flex items-center justify-between font-bold transition-colors border ${lang===lng.code?'bg-primary/10 border-primary text-primary':'bg-white dark:bg-slate-800 border-slate-100 dark:border-slate-700 text-slate-600 dark:text-slate-300 hover:bg-slate-50'}`}>
                                <span>{lng.name}</span>
                                {lang===lng.code && <Icon name="check" size={20} />}
                            </button>
                        ))}
                    </div>
                </div>
            );
        };

        const ThemeSettingsScreen = ({ go, themeMode, setThemeMode, t, Icon }) => {
            const themes = [{ mode: 'Light', icon: 'sun' }, { mode: 'Dark', icon: 'moon' }, { mode: 'System', icon: 'monitor' }];
            return (
                <div className="p-6 pt-12 h-full flex flex-col fade-in bg-[var(--bg-color)]">
                    <div className="flex items-center justify-between mb-8"><button onClick={()=>go('MAIN','PROFILE')} className="w-10 h-10 bg-white dark:bg-slate-800 shadow-sm border border-slate-100 dark:border-slate-700 rounded-full flex items-center justify-center active:scale-95 dark:text-white hover:bg-slate-50 transition-colors"><Icon name="arrow-left" size={20} /></button><h2 className="font-bold text-xl dark:text-white">{t('appTheme')}</h2><div className="w-10"></div></div>
                    <div className="flex-1 overflow-y-auto no-scrollbar space-y-3 pb-6">
                        {themes.map(theme => (
                            <button key={theme.mode} onClick={()=>setThemeMode(theme.mode)} className={`w-full p-4 rounded-[24px] flex items-center justify-between font-bold transition-colors border ${themeMode===theme.mode?'bg-primary/10 border-primary text-primary':'bg-white dark:bg-slate-800 border-slate-100 dark:border-slate-700 text-slate-600 dark:text-slate-300 hover:bg-slate-50'}`}>
                                <div className="flex items-center gap-3"><Icon name={theme.icon} size={20} /><span>{t(theme.mode.toLowerCase())}</span></div>
                                {themeMode===theme.mode && <Icon name="check" size={20} />}
                            </button>
                        ))}
                    </div>
                </div>
            );
        };

        const NotificationSettingsScreen = ({ go, t, Icon }) => {
            const [txAlerts, setTxAlerts] = useState(true); const [budgetAlerts, setBudgetAlerts] = useState(true); const [summaries, setSummaries] = useState(true); const [logins, setLogins] = useState(false);
            return (
                <div className="p-6 pt-12 h-full flex flex-col fade-in bg-[var(--bg-color)]">
                    <div className="flex items-center justify-between mb-8"><button onClick={()=>go('MAIN','PROFILE')} className="w-10 h-10 bg-white dark:bg-slate-800 shadow-sm border border-slate-100 dark:border-slate-700 rounded-full flex items-center justify-center active:scale-95 dark:text-white hover:bg-slate-50 transition-colors"><Icon name="arrow-left" size={20} /></button><h2 className="font-bold text-xl dark:text-white">{t('notifications')}</h2><div className="w-10"></div></div>
                    <div className="flex-1 overflow-y-auto no-scrollbar space-y-6 pb-6">
                        <Section title={t('transactionAlerts')}>
                            <div className="p-4 flex items-center justify-between"><div><p className="font-bold text-sm dark:text-white">{t('everyPurchase')}</p></div><button onClick={()=>setTxAlerts(!txAlerts)} className={`w-12 h-6 rounded-full transition-colors ${txAlerts ? 'bg-primary' : 'bg-slate-300'}`}><div className={`w-5 h-5 bg-white rounded-full transition-transform ${txAlerts ? 'translate-x-6' : 'translate-x-0.5'}`}></div></button></div>
                        </Section>
                        <Section title={t('budgetAlerts')}>
                            <div className="p-4 flex items-center justify-between"><div><p className="font-bold text-sm dark:text-white">{t('budgetWarnings')}</p></div><button onClick={()=>setBudgetAlerts(!budgetAlerts)} className={`w-12 h-6 rounded-full transition-colors ${budgetAlerts ? 'bg-primary' : 'bg-slate-300'}`}><div className={`w-5 h-5 bg-white rounded-full transition-transform ${budgetAlerts ? 'translate-x-6' : 'translate-x-0.5'}`}></div></button></div>
                        </Section>
                        <Section title={t('accountTitle')}>
                            <div className="p-4 flex items-center justify-between border-b border-slate-100 dark:border-slate-700"><div><p className="font-bold text-sm dark:text-white">{t('monthlySummaries')}</p></div><button onClick={()=>setSummaries(!summaries)} className={`w-12 h-6 rounded-full transition-colors ${summaries ? 'bg-primary' : 'bg-slate-300'}`}><div className={`w-5 h-5 bg-white rounded-full transition-transform ${summaries ? 'translate-x-6' : 'translate-x-0.5'}`}></div></button></div>
                            <div className="p-4 flex items-center justify-between"><div><p className="font-bold text-sm dark:text-white">{t('newLogins')}</p></div><button onClick={()=>setLogins(!logins)} className={`w-12 h-6 rounded-full transition-colors ${logins ? 'bg-primary' : 'bg-slate-300'}`}><div className={`w-5 h-5 bg-white rounded-full transition-transform ${logins ? 'translate-x-6' : 'translate-x-0.5'}`}></div></button></div>
                        </Section>
                    </div>
                </div>
            );
        };

        // ==========================================
        // 6. MAIN APP
        // ==========================================
        const App = () => {
            const [user, setUser] = useState(null); const [isAuthReady, setIsAuthReady] = useState(false); const [isLocked, setIsLocked] = useState(false); const [screen, setScreen] = useState('SIGN_IN'); const [tab, setTab] = useState('HOME'); const [screenData, setScreenData] = useState(null);
            const [lang, setLang] = useState(localStorage.getItem('cozy_lang') || 'TH'); const [themeMode, setThemeMode] = useState(localStorage.getItem('cozy_theme') || 'Light'); const [accentColor, setAccentColor] = useState(localStorage.getItem('cozy_accent') || '#8cb1ff'); const [reduceMotion, setReduceMotion] = useState(localStorage.getItem('cozy_motion') === 'true');
            const [pinCode, setPinCode] = useState(localStorage.getItem('cozy_pin') || ''); const [showPinModal, setShowPinModal] = useState(false);
            const [txs, setTxs] = useState([]); const [pockets, setPockets] = useState([]); const [notifications, setNotifications] = useState([]); const [dismissedNotifs, setDismissedNotifs] = useState([]);
            const [userCategories, setUserCategories] = useState([
                { id: 'Food & Drink', icon: 'coffee', color: '#ff9800' },
                { id: 'Shopping', icon: 'shopping-bag', color: '#ffde6a' },
                { id: 'Transport', icon: 'car', color: '#94e4ae' },
                { id: 'Bills', icon: 'zap', color: '#ff9494' },
                { id: 'Transfer', icon: 'users', color: '#8cb1ff' },
                { id: 'General', icon: 'receipt', color: '#64748b' }
            ]);
            const defaultCatIds = userCategories.map(c => c.id);
            const t = getT(lang);
            const safeToSpend = pockets.reduce((a, c) => a + Number(c.balance), 0);
            const visibleNotifications = notifications.filter(n => !dismissedNotifs.includes(n.id));

            useEffect(() => {
                localStorage.setItem('cozy_lang', lang);
                localStorage.setItem('cozy_theme', themeMode);
                localStorage.setItem('cozy_accent', accentColor);
                localStorage.setItem('cozy_motion', reduceMotion);
                document.documentElement.style.setProperty('--color-primary', accentColor);
                document.documentElement.classList.toggle('dark', themeMode === 'Dark');
            }, [lang, themeMode, accentColor, reduceMotion]);

            useEffect(() => {
                const unsubscribe = auth.onAuthStateChanged(async (currentUser) => {
                    if(currentUser) {
                        setUser(currentUser);
                        try {
                            const txSnapshot = await db.collection('users').doc(currentUser.uid).collection('transactions').orderBy('timestamp', 'desc').get();
                            const pocketSnapshot = await db.collection('users').doc(currentUser.uid).collection('pockets').get();
                            setTxs(txSnapshot.docs.map(d => ({ id: d.id, ...d.data(), timestamp: d.data().timestamp?.toDate?.() })));
                            setPockets(pocketSnapshot.docs.map(d => ({ id: d.id, ...d.data() })));
                        } catch(e) { console.error(e); }
                    } else {
                        const guest = localStorage.getItem('cozy_guest');
                        if(guest) { setUser(JSON.parse(guest)); } else { setUser(null); }
                    }
                    setIsAuthReady(true);
                });
                return unsubscribe;
            }, []);

            useEffect(() => {
                if(pinCode && !isLocked && user) setIsLocked(true);
            }, [user, pinCode, isLocked]);

            const go = (newScreen, newTab = null, data = null) => {
                setScreen(newScreen);
                if(newTab) setTab(newTab);
                if(data !== undefined) setScreenData(data);
            };

            const handleResetData = () => {
                setTxs([]);
                setPockets([]);
                setNotifications([]);
                setDismissedNotifs([]);
            };

            const handleUpdateTx = (txId, updates) => {
                setTxs(txs.map(tx => tx.id === txId ? { ...tx, ...updates } : tx));
            };

            useEffect(() => {
                const newNotifications = [];
                pockets.forEach(p => {
                    if(p.hasTarget && p.balance < p.target * 0.3) {
                        newNotifications.push({ id: `low-${p.id}`, type: 'low-balance', icon: 'alert-circle', title: t('lowBalance'), message: `${p.name} ${t('safeThreshold')}` });
                    }
                });
                setNotifications(newNotifications);
            }, [safeToSpend, pockets, txs, t, dismissedNotifs]);

            if (!isAuthReady) return <div className="flex justify-center items-center h-screen w-screen bg-slate-900 text-white"><Icon name="loader-2" size={48} className="animate-spin-smooth"/></div>;
            if (isLocked) return <div className="app-container"><LockScreen Icon={Icon} correctPin={pinCode} onUnlock={()=>{ setIsLocked(false); go(user?'MAIN':'SIGN_IN', user?'HOME':null); }} /></div>;

            const p = { user, setUser, go, t, lang, setLang, themeMode, setThemeMode, accentColor, setAccentColor, reduceMotion, setReduceMotion, pinCode, setPinCode, showPinModal, setShowPinModal, txs, setTxs, pockets, setPockets, screenData, Icon, LoadingOverlay, translateAuthError, visibleNotifications: notifications, clearAllNotifs: ()=>setDismissedNotifs(notifications.map(n=>n.id)), safeToSpend, db, userCategories, setUserCategories, defaultCatIds, onResetData: handleResetData, onUpdateTx: handleUpdateTx };

            return (
                <div className={`app-container ${reduceMotion?'no-motion':''} ${themeMode==='Dark'?'theme-dark':''}`}>
                    {screen === 'SIGN_IN' && <LoginScreen {...p} />}
                    {screen === 'SIGN_UP' && <SignUpScreen {...p} />}
                    {screen === 'FORGOT_PASS' && <ForgotScreen {...p} />}
                    {screen === 'MAIN' && (
                        <MainLayout {...p} tab={tab}>
                            {tab === 'HOME' && <HomeScreen {...p} />}
                            {tab === 'POCKETS' && <PocketsScreen {...p} />}
                            {tab === 'HISTORY' && <HistoryScreen {...p} />}
                            {tab === 'PROFILE' && <ProfileScreen {...p} onLogout={()=>{ auth.signOut(); localStorage.removeItem('cozy_guest'); setUser(null); go('SIGN_IN'); }} />}
                        </MainLayout>
                    )}
                    {screen === 'NOTIFICATIONS' && <NotificationsScreen {...p} />}
                    {screen === 'SCAN' && <ScanScreen {...p} onNext={(d)=>go('REVIEW', null, d)} />}
                    {screen === 'REVIEW' && <ReviewScreen {...p} onConfirm={async (d)=>{ 
                        try {
                            if(user && user.uid !== 'mock-uid') {
                                await db.collection('users').doc(user.uid).collection('transactions').add({...d, timestamp: firebase.firestore.FieldValue.serverTimestamp()});
                                if (d.pocketId && d.pocketId !== 'none') { const pkt = pockets.find(pk => pk.id === d.pocketId); if (pkt) await db.collection('users').doc(user.uid).collection('pockets').doc(d.pocketId).update({ balance: Number(pkt.balance) - Number(d.amount) }); }
                            } else {
                                setTxs([{id: Date.now().toString(), ...d}, ...txs]);
                                if (d.pocketId && d.pocketId !== 'none') setPockets(pockets.map(pk => pk.id === d.pocketId ? {...pk, balance: Number(pk.balance) - Number(d.amount)} : pk));
                            }
                            go('MAIN','HISTORY'); 
                        } catch (e) { console.error(e); }
                    }} />}
                    {screen === 'ADD_TX' && <AddTxScreen {...p} onSave={async (d)=>{ 
                        try {
                            if(user && user.uid !== 'mock-uid') {
                                await db.collection('users').doc(user.uid).collection('transactions').add({...d, timestamp: firebase.firestore.FieldValue.serverTimestamp()});
                                if (d.pocketId && d.pocketId !== 'none') { const pkt = pockets.find(pk => pk.id === d.pocketId); if (pkt) await db.collection('users').doc(user.uid).collection('pockets').doc(d.pocketId).update({ balance: Number(pkt.balance) - Number(d.amount) }); }
                            } else {
                                setTxs([{id: Date.now().toString(), ...d}, ...txs]); 
                                if (d.pocketId && d.pocketId !== 'none') setPockets(pockets.map(pk => pk.id === d.pocketId ? {...pk, balance: Number(pk.balance) - Number(d.amount)} : pk));
                            }
                            go('MAIN','HISTORY'); 
                        } catch(e) { console.error(e); }
                    }} />}
                    {screen === 'TX_DETAIL' && <TxDetailScreen {...p} tx={screenData || txs[0]} />}
                    {screen === 'SPLIT_BILL' && <SplitBillScreen {...p} tx={screenData || txs[0]} />}
                    {screen === 'ADD_POCKET' && <AddPocketScreen {...p} onSave={async (pData)=>{ 
                        try { if(user && user.uid !== 'mock-uid') { await db.collection('users').doc(user.uid).collection('pockets').add({...pData, timestamp: firebase.firestore.FieldValue.serverTimestamp()}); } else setPockets([...pockets, {id: Date.now().toString(), ...pData}]); go('MAIN', 'POCKETS'); } catch(e){}
                    }} />}
                    {screen === 'POCKET_DETAILS' && <PocketDetailsScreen {...p} pocket={screenData || pockets[0]} />}
                    {screen === 'POCKET_SETTINGS' && <PocketSettingsScreen {...p} pocket={screenData} onUpdate={async (id, data)=>{
                        try { if(user && user.uid !== 'mock-uid') { await db.collection('users').doc(user.uid).collection('pockets').doc(id).set(data, {merge: true}); } else setPockets(pockets.map(p => p.id === id ? {...p, ...data} : p)); go('POCKET_DETAILS', null, {...screenData, ...data}); } catch(e){}
                    }} onDelete={async (id)=>{
                        try { if(user && user.uid !== 'mock-uid') { await db.collection('users').doc(user.uid).collection('pockets').doc(id).delete(); } else setPockets(pockets.filter(p => p.id !== id)); go('MAIN', 'POCKETS'); } catch(e){}
                    }} />}
                    {screen === 'EDIT_PROFILE' && <EditProfileScreen {...p} />}
                    {screen === 'SECURITY' && <SecuritySettingsScreen {...p} />}
                    {screen === 'LANGUAGE' && <LanguageSettingsScreen {...p} />}
                    {screen === 'THEME' && <ThemeSettingsScreen {...p} />}
                    {screen === 'NOTIFICATION_SETTINGS' && <NotificationSettingsScreen {...p} />}
                    {showPinModal && <PinPadModal onClose={()=>setShowPinModal(false)} onSave={(pin)=>{ setPinCode(pin); localStorage.setItem('cozy_pin', pin); setShowPinModal(false); }} Icon={Icon} isSet={!!pinCode} t={t} />}
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<ErrorBoundary><App /></ErrorBoundary>);
    </script>
</body>
</html>
