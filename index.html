        const processReceiptImage = async (file, onComplete) => {
            try {
                const worker = await Tesseract.createWorker('tha+eng'); const ret = await worker.recognize(file); const rawText = ret.data.text; const lines = rawText.split('\n').map(l => l.trim()).filter(l => l.length > 0); await worker.terminate();
                let finalAmount = ''; let merchant = ''; let dateStr = new Date().toISOString().split('T')[0]; let memoText = '';

                for(let line of lines) { const match = line.match(amountRegex); if(match && match[1]) { finalAmount = parseFloat(match[1].replace(/,/g, '')).toFixed(2); break; } }
                if (!finalAmount || finalAmount === '0.00') { const numbers = rawText.match(/\b\d{1,3}(?:,\d{3})*\.\d{2}\b/g); if (numbers && numbers.length > 0) { const vals = numbers.map(n => parseFloat(n.replace(/,/g, ''))); finalAmount = Math.max(...vals).toFixed(2); } }

                let finalTitle = memoText || merchant || 'รายการใช้จ่าย'; finalTitle = finalTitle.replace(/(รหัสอ้างอิง|เลขอ้างอิง|Ref|วันที่).*/i, '').trim();
                const categoryInfo = categorizeText(finalTitle + ' ' + rawText);

                onComplete({ amount: '', merchant: '', date: new Date().toISOString().split('T')[0], categoryKey: 'General', icon: 'receipt', color: '#64748b', isAuto: false, imageUrl: imgData });
            }

                            if(user && user.uid !== 'mock-uid') {
                                await db.collection('users').doc(user.uid).collection('transactions').add({...d, timestamp: firebase.firestore.FieldValue.serverTimestamp()});
                                if (d.pocketId && d.pocketId !== 'none') { const pkt = pockets.find(pk => pk.id === d.pocketId); if (pkt) await db.collection('users').doc(user.uid).collection('pockets').doc(d.pocketId).update({ balance: Number(pkt.balance) - Number(d.amount) }); }
                            } else {
                                setTxs([{id: Date.now().toString(), ...d}, ...txs]);
                                if (d.pocketId && d.pocketId !== 'none') setPockets(pockets.map(pk => pk.id === d.pocketId ? {...pk, balance: Number(pk.balance) - Number(d.amount)} : pk));
                            }
                            go('MAIN','HISTORY'); 
                        } catch (e) { console.error(e); }
                    }} />}
                    {screen === 'ADD_TX' && <AddTxScreen {...p} onSave={async (d)=>{ 
                        try {
                            if(user && user.uid !== 'mock-uid') {
                                await db.collection('users').doc(user.uid).collection('transactions').add({...d, timestamp: firebase.firestore.FieldValue.serverTimestamp()});
                                if (d.pocketId && d.pocketId !== 'none') { const pkt = pockets.find(pk => pk.id === d.p
Id; if (pkt) await db.collection('users').doc(user.uid).collection('pockets').doc(d.pocketId).update({ balance: Number(pkt.balance) - Number(d.amount) }); }
                            } else {
                                setTxs([{id: Date.now().toString(), ...d}, ...txs]); 
                                if (d.pocketId && d.pocketId !== 'none') setPockets(pockets.map(pk => pk.id === d.pocketId ? {...pk, balance: Number(pk.balance) - Number(d.amount)} : pk));
                            }
                            go('MAIN','HISTORY'); 
                        } catch(e) { console.error(e); }
                    }} />}
                    {screen === 'TX_DETAIL' && <TxDetailScreen {...p} tx={screenData || txs[0]} />}
                    {screen === 'SPLIT_BILL' && <SplitBillScreen {...p} tx={screenData || txs[0]} />}
                    {screen === 'ADD_POCKET' && <AddPocketScreen {...p} onSave={async (pData)=>{ 
                        try { if(user && user.uid !== 'mock-uid') { await db.collection('users').doc(user.uid).collection('pockets').add({...pData, timestamp: firebase.firestore.FieldValue.serverTimestamp()}); } else setPockets([...pockets, {id: Date.now().toString(), ...pData}]); go('MAIN', 'POCKETS'); } catch(e){}
                    }} />}
                    {screen === 'POCKET_DETAILS' && <PocketDetailsScreen {...p} pocket={screenData || pockets[0]} />}
                    {screen === 'POCKET_SETTINGS' && <PocketSettingsScreen {...p} pocket={screenData} onUpdate={async (id, data)=>{
                        try { if(user && user.uid !== 'mock-uid') { await db.collection('users').doc(user.uid).collection('pockets').doc(id).set(data, {merge: true}); } else setPockets(pockets.map(p => p.id === id ? {...p, ...data} : p)); go('POCKET_DETAILS', null, {...screenData, ...data}); } catch(e){}
                    }} onDelete={async (id)=>{
                        try { if(user && user.uid !== 'mock-uid') { await db.collection('users').doc(user.uid).collection('pockets').doc(id).delete(); } else setPockets(pockets.filter(p => p.id !== id)); go('MAIN', 'POCKETS'); } catch(e){}
                    }} />}
                    {screen === 'EDIT_PROFILE' && <EditProfileScreen {...p} />}
                    {screen === 'SECURITY' && <SecuritySettingsScreen {...p} />}
                    {screen === 'LANGUAGE' && <LanguageSettingsScreen {...p} />}
                    {screen === 'THEME' && <ThemeSettingsScreen {...p} />}
                    {screen === 'NOTIFICATION_SETTINGS' && <NotificationSettingsScreen {...p} />}
                    {showPinModal && <PinPadModal onClose={()=>setShowPinModal(false)} onSave={(pin)=>{ setPinCode(pin); localStorage.setItem('cozy_pin', pin); setShowPinModal(false); }} Icon={Icon} isSet={!!pinCode} t={t} />}
                </div>
            );
        };

        const LockScreen = ({ Icon, correctPin, onUnlock }) => {
            const [pin, setPin] = useState('');
            const handlePinInput = (digit) => {
                if(pin.length < 6) {
                    const newPin = pin + digit;
                    setPin(newPin);
                    if(newPin.length === 6 && newPin === correctPin) {
                        setTimeout(onUnlock, 500);
                    }
                }
            };
            const handleBackspace = () => setPin(pin.slice(0, -1));
            return (
                <div className="flex flex-col items-center justify-center h-full bg-gradient-to-b from-primary to-primary/80">
                    <h1 className="text-3xl font-bold text-white mb-8">Enter PIN</h1>
                    <div className="flex gap-3 mb-8">
                        {[0,1,2,3,4,5].map(i => (
                            <div key={i} className={`w-4 h-4 rounded-full transition-all ${i < pin.length ? 'bg-white scale-125' : 'bg-white/30'}`}></div>
                        ))}
                    </div>
                    <div className="grid grid-cols-3 gap-4 mb-8">
                        {[1,2,3,4,5,6,7,8,9].map(n => (
                            <button key={n} onClick={()=>handlePinInput(n.toString())} className="w-16 h-16 bg-white/20 text-white font-bold text-xl rounded-full hover:bg-white/30 active:scale-95 transition-all">{n}</button>
                        ))}
                        <button onClick={()=>handlePinInput('0')} className="col-span-2 w-full bg-white/20 text-white font-bold text-xl rounded-full hover:bg-white/30 active:scale-95 transition-all">0</button>
                        <button onClick={handleBackspace} className="w-16 h-16 bg-danger text-white font-bold rounded-full hover:bg-red-600 active:scale-95 transition-all"><Icon name="delete" size={20} /></button>
                    </div>
                </div>
            );
        };

        const PinPadModal = ({ onClose, onSave, Icon, isSet, t }) => {
            const [pin, setPin] = useState('');
            const handlePinInput = (digit) => {
                if(pin.length < 6) setPin(pin + digit);
            };
            const handleBackspace = () => setPin(pin.slice(0, -1));
            const handleSave = () => {
                if(pin.length === 6) onSave(pin);
            };
            return (
                <div className="absolute inset-0 bg-black/50 backdrop-blur-sm flex items-end z-[200] fade-in">
                    <div className="w-full bg-white dark:bg-slate-800 rounded-t-[32px] p-6 max-h-[80vh] overflow-y-auto no-scrollbar">
                        <h3 className="font-bold text-lg mb-6 dark:text-white">{isSet ? t('changePin') : t('setPin')}</h3>
                        <div className="flex gap-3 mb-8 justify-center">
                            {[0,1,2,3,4,5].map(i => (
                                <div key={i} className={`w-4 h-4 rounded-full transition-all ${i < pin.length ? 'bg-primary scale-125' : 'bg-slate-200'}`}></div>
                            ))}
                        </div>
                        <div className="grid grid-cols-3 gap-3 mb-6">
                            {[1,2,3,4,5,6,7,8,9].map(n => (
                                <button key={n} onClick={()=>handlePinInput(n.toString())} className="p-4 bg-slate-100 dark:bg-slate-700 text-slate-700 dark:text-white font-bold text-xl rounded-xl hover:bg-slate-200 dark:hover:bg-slate-600 active:scale-95 transition-all">{n}</button>
                            ))}
                            <button onClick={()=>handlePinInput('0')} className="col-span-2 p-4 bg-slate-100 dark:bg-slate-700 text-slate-700 dark:text-white font-bold text-xl rounded-xl hover:bg-slate-200 dark:hover:bg-slate-600 active:scale-95 transition-all">0</button>
                            <button onClick={handleBackspace} className="p-4 bg-danger text-white font-bold rounded-xl hover:bg-red-600 active:scale-95 transition-all"><Icon name="delete" size={20} /></button>
                        </div>
                        <div className="flex gap-3">
                            <button onClick={onClose} className="flex-1 bg-slate-100 dark:bg-slate-700 text-slate-700 dark:text-white font-bold py-3 rounded-full">{t('cancel')}</button>
                            <button onClick={handleSave} disabled={pin.length !== 6} className="flex-1 bg-primary text-white font-bold py-3 rounded-full disabled:opacity-50 disabled:cursor-not-allowed">{t('done')}</button>
                        </div>
                    </div>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<ErrorBoundary><App /></ErrorBoundary>);
    </script>
</body>
</html>
