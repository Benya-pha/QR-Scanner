        const translateAuthError = (code) => {
            if(code.includes('api-key-not-valid')) return 'API Key ไม่ถูกต้อง';
            if(code.includes('operation-not-supported')) return 'ไม่ได้เปิดใช้งาน Email/Password Auth ใน Firebase';
            switch(code) {
                case 'auth/invalid-credential':
                case 'auth/user-not-found':
                case 'auth/wrong-password': return 'อีเมลหรือรหัสผ่านไม่ถูกต้อง';
                case 'auth/email-already-in-use': return 'อีเมลนี้ถูกใช้งานแล้ว';

        const getDeviceName = () => {
            const ua = navigator.userAgent;
            if (/iPhone|iPod/.test(ua)) return 'iPhone';
            if (/iPad/.test(ua)) return 'iPad';
            if (/android/i.test(ua)) return 'Android Device';
            if (/Macintosh/.test(ua)) return 'Mac';
            if (/Windows/.test(ua)) return 'Windows PC';
            return 'Web Browser';
        };

        const categorizeText = (text) => {
            const tText = text.toLowerCase();
            if (tText.match(/น้ำปั่น|ครัว|coffee|คาเฟ่|อาหาร|เครื่องดื่ม|ข้าว|ชา|นม|food|drink|ปลา|หมู|ไก่|เนื้อ|กุ้ง|เบเกอรี่|ขนม|เค้ก|ชาบู|ปิ้งย่าง|สุกี้|restaurant|cafe/)) return { cat: 'Food & Drink', icon: 'coffee', color: '#ff9800' };
            if (tText.match(/shop|ร้าน|ช้อป|โลตัส|เซเว่น|7-11|บิ๊กซี|มินิมาร์ท|ซื้อ|mart|ค้า|supermarket|mall|store/)) return { cat: 'Shopping', icon: 'shopping-bag', color: '#FACC15' };
            if (tText.match(/นาย|นาง|น\.ส\.|ด\.ช\.|ด\.ญ\.|คุณ|โอนเงิน/)) return { cat: 'Transfer', icon: 'users', color: '#3B82F6' };
            if (tText.match(/บิล|การไฟฟ้า|การประปา|ais|true|dtac|ค่าเน็ต|ค่าไฟ|ค่าน้ำ|bill|ประกัน|สินเชื่อ|บัตรเครดิต|ชำระ/)) return { cat: 'Bills', icon: 'zap', color: '#FF4D4D' };
            if (tText.match(/น้ำมัน|ปั๊ม|ptt|pt|shell|bangchak|caltex|gas/)) return { cat: 'Transport', icon: 'car', color: '#4ADE80' };
            return { cat: 'General', icon: 'receipt', color: '#64748b' };
        };

        const processReceiptImage = async (file, onComplete) => {
            try {
                const worker = await Tesseract.createWorker('tha+eng');
                const ret = await worker.recognize(file);
                const rawText = ret.data.text;
                const lines = rawText.split('\n').map(l => l.trim()).filter(l => l.length > 0);
                await worker.terminate();

                let finalAmount = ''; let merchant = ''; let dateStr = new Date().toLocaleDateString('th-TH'); let memoText = '';
                const amountRegex = /(?:จำนวนเงิน|จำนวน|ยอดรวม|ยอดเงิน|รวมทั้งสิ้น|Total|Amount|฿|B)[^\d]*(\d{1,3}(?:,\d{3})*(?:\.\d{2})?)/i;
                for(let line of lines) {
                    const match = line.match(amountRegex);
                    if(match && match[1]) { finalAmount = parseFloat(match[1].replace(/,/g, '')).toFixed(2); break; }
                }
                if (!finalAmount || finalAmount === '0.00') {
                    const numbers = rawText.match(/\b\d{1,3}(?:,\d{3})*\.\d{2}\b/g);
                    if (numbers && numbers.length > 0) {
                        const vals = numbers.map(n => parseFloat(n.replace(/,/g, '')));
                        finalAmount = Math.max(...vals).toFixed(2);
                    }
                }

                let foundTo = false;
                for (let i = 0; i < lines.length; i++) {
                    const line = lines[i];
                    if (line.match(/(บันทึกช่วยจำ|บันทึก|Memo)/i)) {
                        const cleanMemo = line.replace(/(บันทึกช่วยจำ|บันทึก|Memo)[\s.:]*/i, '').trim();
                        if (cleanMemo) memoText = cleanMemo; else if (i + 1 < lines.length) memoText = lines[i+1];
                    }
                    const dateMatch = line.match(/(\d{1,2}[\/\-\. ]\d{1,2}[\/\-\. ]\d{2,4})|(\d{1,2}\s+(ม\.ค\.|ก\.พ\.|มี\.ค\.|เม\.ย\.|พ\.ค\.|มิ\.ย\.|ก\.ค\.|ส\.ค\.|ก\.ย\.|ต\.ค\.|พ\.ย\.|ธ\.ค\.|มกราคม|กุมภาพันธ์|มีนาคม|เมษายน|พฤษภาคม|มิถุนายน|กรกฎาคม|สิงหาคม|กันยายน|ตุลาคม|พฤศจิกายน|ธันวาคม)\s+\d{2,4})/);
                    if(dateMatch) dateStr = dateMatch[0];
                    if (line.match(/^(ถึง|ไปยัง|ผู้รับโอน|ชื่อบัญชี|To)/i)) {
                        let cleanMerchant = line.replace(/^(ถึง|ไปยัง|ผู้รับโอน|ชื่อบัญชี|To)[\s.:]*/i, '').trim();
                        if (cleanMerchant.length < 3 && i + 1 < lines.length) cleanMerchant = lines[i+1].trim();
                        cleanMerchant = cleanMerchant.replace(/(ธนาคาร|พร้อมเพย์|PromptPay|KBank|SCB|KTB|BBL|GSB)/ig, '').trim();
                        if (cleanMerchant.length > 2) { merchant = cleanMerchant; foundTo = true; }
                    }
                    if (!foundTo && !merchant && line.match(/(นาย|นาง|น\.ส\.|บจก|หจก|บริษัท|ร้าน|SHOP|ครัว|คาเฟ่|cafe|มินิมาร์ท|ตลาด)/i)) {
                         if(!line.match(/^(จาก|ผู้โอน)/i)) merchant = line.replace(/^(จาก|ผู้โอน)[\s.:]*/i, '').trim();
                    }
                }
                if (!merchant && finalAmount) {
                    if(lines.length > 0) merchant = lines[0];
                    if(merchant.match(/ใบเสร็จ|Receipt|รับเงิน/i) && lines.length > 1) merchant = lines[1];
                }

                let finalTitle = memoText || merchant || 'รายการใช้จ่าย';
                finalTitle = finalTitle.replace(/(รหัสอ้างอิง|เลขอ้างอิง|Ref|วันที่).*/i, '').trim();
                const categoryInfo = categorizeText(finalTitle + ' ' + rawText);

                const resultData = { amount: finalAmount || '', merchant: finalTitle, date: dateStr, categoryKey: categoryInfo.cat, icon: categoryInfo.icon, color: categoryInfo.color, isAuto: true };

                if (typeof file === 'string') {
                    onComplete({ ...resultData, imageUrl: file });
                } else {
                    const reader = new FileReader();
                    reader.onload = (ev) => onComplete({ ...resultData, imageUrl: ev.target.result });
                    reader.readAsDataURL(file);
                }
            } catch (error) {
                let imgData = null;
                if (typeof file === 'string') imgData = file;
                else if (file instanceof Blob) {
                    const reader = new FileReader();
                    reader.onload = (e) => onComplete({ amount: '', merchant: '', date: new Date().toLocaleDateString('th-TH'), categoryKey: 'General', icon: 'receipt', color: '#64748b', isAuto: false, imageUrl: e.target.result });
                    reader.readAsDataURL(file);
                    return;
                }
                onComplete({ amount: '', merchant: '', date: new Date().toLocaleDateString('th-TH'), categoryKey: 'General', icon: 'receipt', color: '#64748b', isAuto: false, imageUrl: imgData });
            }
        };

        const SplitBillScreen = ({ tx, go, t, Icon }) => {
            const billTotal = Number(tx?.amount || 0);
            const [friends, setFriends] = useState([{id:1, name:'ฉัน', amount:billTotal/2}, {id:2, name:'เพื่อน 1', amount:billTotal/2}]);
            const currentSum = friends.reduce((a,c)=>a+Number(c.amount), 0);
            const isMatch = Math.abs(currentSum - billTotal) < 0.01;

            const updateAmount = (id, val) => setFriends(friends.map(f=>f.id===id?{...f, amount:val}:f));

            return (
                <div className="p-6 pt-10 flex flex-col h-full fade-in bg-[#f8fafc] dark:bg-dark">
                    <div className="flex items-center mb-8"><button onClick={()=>go('TX_DETAIL', null, tx)} className="w-12 h-12 bg-white dark:bg-slate-900 shadow-sm rounded-full flex items-center justify-center active:scale-95 dark:text-white border border-slate-100 dark:border-slate-800"><Icon name="arrow-left" size={24}/></button><h2 className="font-bold text-2xl ml-4 dark:text-white">{t('splitBill')}</h2></div>
                    <div className="bg-white dark:bg-slate-900 rounded-[36px] p-8 text-center mb-6 shadow-sm border border-slate-100 dark:border-slate-800">
                        <p className="text-[10px] font-bold text-slate-400 uppercase tracking-widest">{t('totalAmount')}</p><h1 className="text-5xl font-bold my-2 dark:text-white">฿ {formatMoney(billTotal)}</h1>
                        <div className="flex justify-between items-center mt-4 px-4 bg-slate-50 dark:bg-slate-800 py-4 rounded-2xl border border-slate-100 dark:border-slate-700"><span className="text-sm font-bold text-slate-500">แบ่งแล้ว: ฿{formatMoney(currentSum)}</span><span className={`text-sm font-bold ${isMatch?'text-[#56CC9D]':'text-danger'}`}>เหลือ: ฿{formatMoney(Math.max(billTotal-currentSum, 0))}</span></div>
                    </div>
                    <div className="flex-1 overflow-y-auto no-scrollbar space-y-4 pb-6">
                        {friends.map(f => (
                            <div key={f.id} className="bg-white dark:bg-slate-900 rounded-3xl p-4 flex items-center shadow-sm border border-slate-100 dark:border-slate-800">
                                <div className="flex-1 ml-3 font-bold text-lg dark:text-white">{f.name}</div>
                                <div className="bg-slate-50 dark:bg-slate-800 rounded-xl px-3 py-2 flex items-center"><span className="text-sm font-bold text-slate-400 mr-1">฿</span><input type="number" value={f.amount} onChange={e=>updateAmount(f.id, e.target.value)} className="w-20 bg-transparent text-right font-bold text-primary text-lg outline-none"/></div>
                                {f.name!=='ฉัน' && <button onClick={()=>setFriends(friends.filter(x=>x.id!==f.id))} className="ml-3 text-slate-400 hover:text-danger"><Icon name="x" size={20}/></button>}
                            </div>
                        ))}
                        <button onClick={()=>setFriends([...friends,{id:Date.now(), name:`เพื่อน ${friends.length+1}`, amount:0}])} className="w-full py-5 border-4 border-dashed border-slate-200 dark:border-slate-700 rounded-[32px] text-slate-400 font-bold flex items-center justify-center gap-3 hover:bg-white dark:hover:bg-slate-900"><Icon name="plus" size={20}/> {t('addFriend')}</button>
                    </div>
                    <button disabled={!isMatch} onClick={()=>go('MAIN','HISTORY')} className={`w-full py-6 rounded-full font-bold text-xl tracking-widest shadow-lg active:scale-95 transition-transform ${isMatch?'bg-primary text-white':'bg-slate-200 dark:bg-slate-800 text-slate-400'}`}>{t('confirmSplit')}</button>
                </div>
            );
        };

        const App = () => {
            const [isAuthReady, setIsAuthReady] = useState(false); const [user, setUser] = useState(null);
            const [screen, setScreen] = useState('SIGN_IN'); const [tab, setTab] = useState('HOME'); const [screenData, setScreenData] = useState(null);
            const [lang, setLang] = useState('TH'); const [themeMode, setThemeMode] = useState('Light'); const [reduceMotion, setReduceMotion] = useState(false);
            const [pinCode, setPinCode] = useState(localStorage.getItem('cozy_pin')); const [isLocked, setIsLocked] = useState(!!localStorage.getItem('cozy_pin')); const [showPinModal, setShowPinModal] = useState(false);
            const [txs, setTxs] = useState([]); const [pockets, setPockets] = useState([]); const [dismissedNotifs, setDismissedNotifs] = useState([]);
            const [accentColor, setAccentColor] = useState(localStorage.getItem('cozy_accent') || '#3B82F6');
            
            const defaultCatIds = ['Food & Drink', 'Shopping', 'Transport', 'Bills'];
            const [userCategories, setUserCategories] = useState([{ id: 'Food & Drink', icon: 'coffee', color: '#ff9800' },{ id: 'Shopping', icon: 'shopping-bag', color: '#FACC15' },{ id: 'Transport', icon: 'car', color: '#4ADE80' },{ id: 'Bills', icon: 'zap', color: '#FF4D4D' }]);
            
            const t = useCallback((key) => getT(lang)(key), [lang]);
            const go = useCallback((s, tb = null, data = null) => { setScreen(s); if(tb) setTab(tb); if(data!==undefined) setScreenData(data); }, []);

            useEffect(() => {
                localStorage.setItem('cozy_accent', accentColor);
                document.documentElement.style.setProperty('--color-primary', accentColor);
                
                const isDark = themeMode === 'Dark' || (themeMode === 'System' && window.matchMedia('(prefers-color-scheme: dark)').matches);
                if (isDark) {
                    document.documentElement.classList.add('dark');
                    document.documentElement.style.setProperty('--bg-color', '#121212');
                } else {
                    document.documentElement.classList.remove('dark');
                    document.documentElement.style.setProperty('--bg-color', '#f8fafc');
                }
            }, [accentColor, themeMode]);

            useEffect(() => {
                const unsub = auth.onAuthStateChanged(u => {
                    setIsAuthReady(true);
                    if(u) {
                        db.collection('users').doc(u.uid).onSnapshot(doc => { const d = doc.data() || {}; setUser({ uid: u.uid, email: u.email, displayName: d.displayName || u.email.split('@')[0], photoURL: d.photoURL || 'https://ui-avatars.com/api/?name=U&background=3B82F6&color=fff', bio: d.bio || '' }); });
                        if(!isLocked) go('MAIN', 'HOME');
                        db.collection('users').doc(u.uid).collection('transactions').orderBy('timestamp', 'desc').onSnapshot(snap => setTxs(snap.docs.map(d => ({ id: d.id, ...d.data() }))));
                        db.collection('users').doc(u.uid).collection('pockets').onSnapshot(snap => setPockets(snap.docs.map(d => ({ id: d.id, ...d.data() }))));
                    } else {
                        const localGuest = localStorage.getItem('cozy_guest');
                        if (localGuest) { setUser(JSON.parse(localGuest)); if(!isLocked) go('MAIN', 'HOME'); } else { go('SIGN_IN'); setTxs([]); setPockets([]); setDismissedNotifs([]); }
                    }
                });
                return unsub;
            }, [go, isLocked]);

            const handleResetData = async () => {
                if(!window.confirm(t('confirmReset'))) return;
                try {
                    if (user && user.uid !== 'mock-uid') {
                        const tSnap = await db.collection('users').doc(user.uid).collection('transactions').get();
                        const pSnap = await db.collection('users').doc(user.uid).collection('pockets').get();
                        const batch = db.batch();
                        tSnap.docs.forEach(d => batch.delete(d.ref));
                        pSnap.docs.forEach(d => batch.delete(d.ref));
                        await batch.commit();
                    } else { setTxs([]); setPockets([]); }
                    alert(t('resetSuccess')); go('MAIN', 'HOME');
                } catch(e) { console.error(e); }
            };

            const safeToSpend = useMemo(() => pockets.reduce((a,c) => a + Number(c.balance), 0), [pockets]);
            const notifications = useMemo(() => {
                const notifs = [];
                if (safeToSpend > 0 && safeToSpend <= 500) notifs.push({ id: 'low-bal', type: 'alert', title: t('lowBalance'), desc: t('safeThreshold'), time: 'Now' });
                pockets.filter(p => p.hasTarget && Number(p.target) > Number(p.balance)).forEach(p => { notifs.push({ id: `pocket-${p.id}`, type: 'calendar', title: t('billReminder'), desc: `${p.name} ขาดอีก ฿${formatMoney(p.target - p.balance)}`, time: 'Target' }); });
                if (txs.length > 0) { const latest = txs[0]; notifs.push({ id: `tx-${latest.id}`, type: 'receipt', title: t('newTx'), desc: `${latest.title} ฿${formatMoney(latest.amount)}`, time: latest.date }); }
                return notifs.filter(n => !dismissedNotifs.includes(n.id));
            }, [safeToSpend, pockets, txs, t, dismissedNotifs]);

            if (!isAuthReady) return <div className="flex justify-center items-center h-screen w-screen bg-slate-900 text-white"><Icon name="loader-2" size={48} className="animate-spin"/></div>;
            if (isLocked) return <div className="app-container"><LockScreen Icon={Icon} correctPin={pinCode} onUnlock={()=>{ setIsLocked(false); go(user?'MAIN':'SIGN_IN', user?'HOME':null); }} /></div>;

            const p = { user, setUser, go, t, lang, setLang, themeMode, setThemeMode, accentColor, setAccentColor, reduceMotion, setReduceMotion, pinCode, setPinCode, showPinModal, setShowPinModal, txs, setTxs, pockets, setPockets, screenData, Icon, LoadingOverlay, translateAuthError, visibleNotifications: notifications, clearAllNotifs: ()=>setDismissedNotifs(notifications.map(n=>n.id)), safeToSpend, db, userCategories, setUserCategories, defaultCatIds, onResetData: handleResetData };

            return (
                <div className={`app-container ${reduceMotion?'no-motion':''} ${themeMode==='Dark'?'theme-dark':''}`}>
                    {screen === 'SIGN_IN' && <LoginScreen {...p} />}
                    {screen === 'SIGN_UP' && <SignUpScreen {...p} />}
                    {screen === 'FORGOT_PASS' && <ForgotScreen {...p} />}
                    {screen === 'MAIN' && (
                        <MainLayout {...p} tab={tab}>
                            {tab === 'HOME' && <HomeScreen {...p} />}
                            {tab === 'POCKETS' && <PocketsScreen {...p} />}
                            {tab === 'HISTORY' && <HistoryScreen {...p} />}
                            {tab === 'PROFILE' && <ProfileScreen {...p} onLogout={()=>{ auth.signOut(); localStorage.removeItem('cozy_guest'); setUser(null); go('SIGN_IN'); }} />}
                        </MainLayout>
                    )}
                    {screen === 'NOTIFICATIONS' && <NotificationsScreen {...p} />}
                    {screen === 'SCAN' && <ScanScreen {...p} onNext={(d)=>go('REVIEW', null, d)} />}
                    {screen === 'REVIEW' && <ReviewScreen {...p} onConfirm={async (d)=>{ 
                        try {
                            if(user && user.uid !== 'mock-uid') {
                                await db.collection('users').doc(user.uid).collection('transactions').add({...d, timestamp: firebase.firestore.FieldValue.serverTimestamp()});
                                if (d.pocketId && d.pocketId !== 'none') { const pkt = pockets.find(pk => pk.id === d.pocketId); if (pkt) await db.collection('users').doc(user.uid).collection('pockets').doc(d.pocketId).update({ balance: Number(pkt.balance) - Number(d.amount) }); }
                            } else {
                                setTxs([{id: Date.now().toString(), ...d}, ...txs]);
                                if (d.pocketId && d.pocketId !== 'none') setPockets(pockets.map(pk => pk.id === d.pocketId ? {...pk, balance: Number(pk.balance) - Number(d.amount)} : pk));
                            }
                            go('MAIN','HISTORY'); 
                        } catch (e) { console.error(e); }
                    }} />}
                    {screen === 'ADD_TX' && <AddTxScreen {...p} onSave={async (d)=>{ 
                        try {
                            if(user && user.uid !== 'mock-uid') {
                                await db.collection('users').doc(user.uid).collection('transactions').add({...d, timestamp: firebase.firestore.FieldValue.serverTimestamp()});
                                if (d.pocketId && d.pocketId !== 'none') { const pkt = pockets.find(pk => pk.id === d.pocketId); if (pkt) await db.collection('users').doc(user.uid).collection('pockets').doc(d.pocketId).update({ balance: Number(pkt.balance) - Number(d.amount) }); }
                            } else {
                                setTxs([{id: Date.now().toString(), ...d}, ...txs]); 
                                if (d.pocketId && d.pocketId !== 'none') setPockets(pockets.map(pk => pk.id === d.pocketId ? {...pk, balance: Number(pk.balance) - Number(d.amount)} : pk));
                            }
                            go('MAIN','HISTORY'); 
                        } catch(e) { console.error(e); }
                    }} />}
                    {screen === 'TX_DETAIL' && <TxDetailScreen {...p} tx={screenData || txs[0]} />}
                    {screen === 'SPLIT_BILL' && <SplitBillScreen {...p} tx={screenData || txs[0]} />}
                    {screen === 'ADD_POCKET' && <AddPocketScreen {...p} onSave={async (pData)=>{ 
                        try { if(user && user.uid !== 'mock-uid') { await db.collection('users').doc(user.uid).collection('pockets').add({...pData, timestamp: firebase.firestore.FieldValue.serverTimestamp()}); } else setPockets([...pockets, {id: Date.now().toString(), ...pData}]); go('MAIN', 'POCKETS'); } catch(e){}
                    }} />}
                    {screen === 'POCKET_DETAILS' && <PocketDetailsScreen {...p} pocket={screenData || pockets[0]} />}
                    {screen === 'POCKET_SETTINGS' && <PocketSettingsScreen {...p} pocket={screenData} onUpdate={async (id, data)=>{
                        try { if(user && user.uid !== 'mock-uid') { await db.collection('users').doc(user.uid).collection('pockets').doc(id).set(data, {merge: true}); } else setPockets(pockets.map(p => p.id === id ? {...p, ...data} : p)); go('POCKET_DETAILS', null, {...screenData, ...data}); } catch(e){}
                    }} onDelete={async (id)=>{
                        try { if(user && user.uid !== 'mock-uid') { await db.collection('users').doc(user.uid).collection('pockets').doc(id).delete(); } else setPockets(pockets.filter(p => p.id !== id)); go('MAIN', 'POCKETS'); } catch(e){}
                    }} />}
                    {screen === 'EDIT_PROFILE' && <EditProfileScreen {...p} />}
                    {screen === 'SECURITY' && <SecuritySettingsScreen {...p} />}
                    {screen === 'LANGUAGE' && <LanguageSettingsScreen {...p} />}
                    {screen === 'THEME' && <ThemeSettingsScreen {...p} />}
                    {screen === 'NOTIFICATION_SETTINGS' && <NotificationSettingsScreen {...p} />}
                    {showPinModal && <PinPadModal onClose={()=>setShowPinModal(false)} onSave={(pin)=>{ setPinCode(pin); localStorage.setItem('cozy_pin', pin); setShowPinModal(false); }} Icon={Icon} isSet={!!pinCode} t={t} />}
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<ErrorBoundary><App /></ErrorBoundary>);
    </script>
</body>
</html>
