                    <div className="bg-[#2F80ED] p-8 rounded-[40px] text-white shadow-xl mb-10 relative overflow-hidden">
                        <p className="text-[10px] text-blue-100 uppercase font-black tracking-widest mb-1">{t('totalSpend')}</p>
                        <h1 className="text-3xl font-black">฿{totalSpend.toLocaleString()}</h1>
                        <div className="mt-8"><p className="text-[10px] text-blue-100 uppercase font-black tracking-widest mb-1">{t('safeToSpend')}</p><h2 className="text-4xl font-black">฿38,400</h2></div>
                        <div className="h-2 w-full bg-black/10 rounded-full mt-5 overflow-hidden"><div className="h-full bg-[#56CC9D] w-3/4 rounded-full"></div></div>
                    </div>
                    <div className="flex justify-between items-end mb-5"><h3 className="text-lg font-black text-slate-800 leading-none">{t('recentActivity')}</h3><button onClick={()=>navigate('MAIN','HISTORY')} className="text-xs font-black text-[#2F80ED] uppercase tracking-widest">{t('seeAll')}</button></div>
                    <div className="space-y-3">{transactions.slice(0,3).map(tx => <TransactionItem key={tx.id} tx={tx} onClick={()=>navigate('TRANSACTION_DETAIL')} Icon={Icon} />)}</div>
                </div>
            );
        };

        const TransactionItem = ({ tx, onClick, Icon }) => (
            <div onClick={onClick} className="bg-white p-4 rounded-3xl flex justify-between items-center shadow-sm border border-slate-100 cursor-pointer hover:shadow-md transition-all active:scale-95">
                <div className="flex items-center gap-4"><div className="w-12 h-12 rounded-2xl bg-[#2F80ED]/10 text-[#2F80ED] flex items-center justify-center"><Icon name={tx.iconName || "coffee"} size={22}/></div><div><h4 className="font-black text-slate-800 text-sm">{tx.title}</h4><p className="text-[10px] font-bold text-slate-400 uppercase mt-1">{tx.category} • {tx.date}</p></div></div>
                <div className="font-black text-slate-800 text-sm">฿{Number(tx.amount).toLocaleString()}</div>
            </div>
        );

        const HistoryScreen = ({ t, transactions, navigate, Icon }) => (
            <div className="p-6 pt-12 fade-in">
                <h2 className="text-2xl font-black text-slate-800 mb-6">{t('history')}</h2>
                <div className="bg-white border border-slate-100 rounded-[24px] p-4 flex items-center shadow-sm mb-8"><Icon name="search" size={20} className="text-slate-300 mr-3"/><input placeholder={t('search')} className="bg-transparent outline-none w-full text-sm font-bold text-slate-700" /></div>
                <div className="space-y-4 pb-20">{transactions.map(tx => <TransactionItem key={tx.id} tx={tx} onClick={()=>navigate('TRANSACTION_DETAIL')} Icon={Icon} />)}</div>
            </div>
        );

        const PocketsScreen = ({ t, navigate, pockets, Icon }) => (
            <div className="p-6 pt-12 fade-in">
                <h2 className="text-2xl font-black text-slate-800 mb-8">{t('wallet')}</h2>
                <div className="grid grid-cols-2 gap-4 mb-8">
                    {pockets.map(p => (
                        <div key={p.id} onClick={()=>navigate('POCKET_DETAILS')} className="bg-white p-6 rounded-[32px] border border-slate-100 shadow-sm cursor-pointer hover:shadow-md active:scale-95 transition-all">
                            <div className="w-12 h-12 rounded-2xl bg-[#56CC9D]/20 text-[#2B9A6F] flex items-center justify-center mb-5"><Icon name={p.iconName || "home"} size={22}/></div>
                            <h4 className="font-black text-slate-800 text-sm mb-1">{p.name}</h4>
                            <div className="text-lg font-black text-slate-800">฿{Number(p.spent).toLocaleString()}</div>
                            <div className="h-1.5 w-full bg-slate-100 rounded-full mt-4 overflow-hidden"><div className="h-full bg-[#56CC9D]" style={{width:'85%'}}></div></div>
                        </div>
                    ))}
                </div>
                <button onClick={()=>navigate('CREATE_POCKET')} className="w-full py-5 border-2 border-dashed border-[#2F80ED]/30 rounded-[32px] text-[#2F80ED] font-black flex items-center justify-center gap-3 hover:bg-blue-50 transition-colors uppercase tracking-widest text-xs"><Icon name="plus" size={18}/> {t('createNewPocket')}</button>
            </div>
        );

        const ProfileScreen = ({ t, navigate, onLogout, Icon }) => (
            <div className="p-6 pt-12 fade-in">
                <h2 className="text-2xl font-black text-slate-800 mb-8">{t('profile')}</h2>
                <div className="flex flex-col items-center mb-12">
                    <div className="relative"><img src={mockUserDefault.avatar} className="w-28 h-28 rounded-full border-[6px] border-white shadow-2xl mb-4 object-cover"/><div onClick={()=>navigate('EDIT_PROFILE')} className="absolute bottom-4 right-1 w-10 h-10 bg-[#2F80ED] border-4 border-white rounded-full flex items-center justify-center text-white shadow-lg cursor-pointer"><Icon name="edit-2" size={14}/></div></div>
                    <h1 className="text-2xl font-black text-slate-800">{mockUserDefault.name}</h1>
                    <p className="text-xs font-bold text-slate-400 mt-1 uppercase tracking-widest">{mockUserDefault.email}</p>
                </div>
                <div className="space-y-4">
                    <div onClick={()=>navigate('LANGUAGE_SETTINGS')} className="flex items-center justify-between bg-white p-5 rounded-[32px] border border-slate-100 cursor-pointer hover:bg-slate-50 shadow-sm"><div className="flex items-center gap-4"><div className="w-10 h-10 bg-[#F7F9FC] rounded-full flex items-center justify-center text-slate-600 border border-slate-100"><Icon name="globe" size={20}/></div><span className="font-bold text-slate-700 text-sm">{dict.TH.language}</span></div><Icon name="chevron-right" size={18} className="text-slate-300"/></div>
                    <div onClick={()=>navigate('SECURITY_SETTINGS')} className="flex items-center justify-between bg-white p-5 rounded-[32px] border border-slate-100 cursor-pointer hover:bg-slate-50 shadow-sm"><div className="flex items-center gap-4"><div className="w-10 h-10 bg-[#F7F9FC] rounded-full flex items-center justify-center text-slate-600 border border-slate-100"><Icon name="shield" size={20}/></div><span className="font-bold text-slate-700 text-sm">{dict.TH.security}</span></div><Icon name="chevron-right" size={18} className="text-slate-300"/></div>
                    <div onClick={()=>navigate('THEME_SETTINGS')} className="flex items-center justify-between bg-white p-5 rounded-[32px] border border-slate-100 cursor-pointer hover:bg-slate-50 shadow-sm"><div className="flex items-center gap-4"><div className="w-10 h-10 bg-[#F7F9FC] rounded-full flex items-center justify-center text-slate-600 border border-slate-100"><Icon name="palette" size={20}/></div><span className="font-bold text-slate-700 text-sm">{dict.TH.theme}</span></div><Icon name="chevron-right" size={18} className="text-slate-300"/></div>
                </div>
                <button onClick={onLogout} className="w-full mt-10 py-5 bg-white border-2 border-red-100 text-red-500 font-black rounded-[32px] flex items-center justify-center gap-3 hover:bg-red-50 uppercase tracking-widest text-xs shadow-sm"><Icon name="log-out" size={18}/> {t('logout')}</button>
            </div>
        );

        // --- Other Functional Screens (Simplified for brevity but working) ---
        const LanguageSettingsScreen = ({ t, onBack, Icon, setLanguage, language }) => <div className="p-8 flex flex-col h-full bg-[#F7F9FC] fade-in"><button onClick={onBack} className="mb-8 p-3 bg-white rounded-full shadow-sm w-fit border border-slate-100"><Icon name="chevron-left" size={24}/></button><h2 className="text-2xl font-black text-slate-800 mb-10">{t('language')}</h2><div className="space-y-4">{['TH', 'EN'].map(lang => (<div key={lang} onClick={()=>setLanguage(lang)} className={`p-6 rounded-[32px] border-2 flex justify-between items-center cursor-pointer transition-all ${language===lang?'border-[#2F80ED] bg-[#2F80ED]/5 shadow-inner':'border-white bg-white shadow-sm'}`}><span className="font-black text-sm">{lang === 'TH' ? 'ภาษาไทย' : 'English'}</span>{language===lang && <Icon name="check-circle-2" size={22} className="text-[#2F80ED]"/>}</div>))}</div></div>;
        const ThemeSettingsScreen = ({ t, onBack, Icon, reduceMotion, setReduceMotion }) => <div className="p-8 flex flex-col h-full bg-[#F7F9FC] fade-in"><button onClick={onBack} className="mb-8 p-3 bg-white rounded-full shadow-sm w-fit border border-slate-100"><Icon name="chevron-left" size={24}/></button><h2 className="text-2xl font-black text-slate-800 mb-10">{t('theme')}</h2><div onClick={()=>setReduceMotion(!reduceMotion)} className="bg-white p-6 rounded-[32px] border border-slate-100 shadow-sm flex justify-between items-center cursor-pointer active:scale-95 transition-all"><div className="flex gap-4 items-center"><Icon name="sparkles" size={20} className="text-[#2F80ED]"/><span className="font-black text-slate-700 text-sm uppercase tracking-widest">{t('reduceMotion')}</span></div><Icon name={reduceMotion ? "toggle-right" : "toggle-left"} size={36} className={reduceMotion ? "text-[#2F80ED]" : "text-slate-200"}/></div></div>;
        const SecuritySettingsScreen = ({ t, onBack, Icon }) => <div className="p-8 flex flex-col h-full bg-[#F7F9FC] fade-in"><button onClick={onBack} className="mb-8 p-3 bg-white rounded-full shadow-sm w-fit border border-slate-100"><Icon name="chevron-left" size={24}/></button><h2 className="text-2xl font-black text-slate-800 mb-10">{t('security')}</h2><div className="bg-white p-6 rounded-[32px] border border-slate-100 shadow-sm flex justify-between items-center"><div className="flex gap-4 items-center"><Icon name="fingerprint" size={20}/><span className="font-bold text-slate-700">{t('biometric')}</span></div><Icon name="toggle-right" size={32} className="text-[#56CC9D]"/></div></div>;
        
        const ScanReceiptScreen = ({ onBack, onNext, t, Icon }) => <div className="flex-1 bg-black p-6 flex flex-col items-center justify-center text-white relative fade-in"><button onClick={onBack} className="absolute top-12 left-6 w-12 h-12 bg-white/10 rounded-full flex items-center justify-center"><Icon name="chevron-left" size={24}/></button><div className="w-64 h-64 border-2 border-white/10 rounded-[60px] flex items-center justify-center mb-10"><Icon name="scan-line" size={100} className="text-[#56CC9D] animate-pulse" /></div><h2 className="text-2xl font-black text-center">{t('scanReceipt')}</h2><button onClick={onNext} className="mt-12 bg-[#2F80ED] w-24 h-24 rounded-full flex items-center justify-center shadow-2xl border-8 border-white/10"><Icon name="camera" size={36}/></button></div>;
        const ReviewReceiptScreen = ({ t, onConfirm, onBack, Icon }) => <div className="p-8 flex flex-col h-full bg-[#F7F9FC] fade-in"><button onClick={onBack} className="mb-8"><Icon name="chevron-left" size={24}/></button><h2 className="text-2xl font-black mb-10 text-center">{t('reviewDetails')}</h2><div className="bg-white p-12 rounded-[40px] border border-slate-100 shadow-sm text-center mb-12"><h1 className="text-6xl font-black text-slate-800">฿120</h1></div><button onClick={onConfirm} className="bg-[#2F80ED] text-white p-5 rounded-full font-black uppercase tracking-widest shadow-xl mt-auto">Confirm</button></div>;
        const AddTransactionScreen = ({ onSave, t, onBack, Icon }) => <div className="p-8 flex flex-col h-full bg-[#F7F9FC] fade-in"><button onClick={onBack} className="mb-10"><Icon name="chevron-left" size={24}/></button><h2 className="text-3xl font-black mb-10 text-center">{t('addTransaction')}</h2><button onClick={()=>onSave({title:'Manual', amount:150, category:'Food', date:'Today'})} className="bg-[#2F80ED] text-white p-5 rounded-full font-black uppercase tracking-widest shadow-xl mt-auto">Save</button></div>;
        const SignUpScreen = ({ t, navigate, Icon }) => <div className="p-8 flex flex-col h-full bg-[#F7F9FC] fade-in"><button onClick={()=>navigate('SIGN_IN')} className="mb-10"><Icon name="chevron-left" size={24}/></button><h2 className="text-3xl font-black mb-10 text-center">{t('signUp')}</h2><button onClick={()=>navigate('SIGN_IN')} className="bg-[#2F80ED] text-white p-5 rounded-full font-black uppercase tracking-widest shadow-xl mt-auto">Create Account</button></div>;
        const ForgotPasswordScreen = ({ t, onBack, Icon }) => <div className="p-8 flex flex-col h-full bg-[#F7F9FC] fade-in"><button onClick={onBack} className="mb-10"><Icon name="chevron-left" size={24}/></button><h2 className="text-3xl font-black mb-10 text-center">{t('forgotPassword')}</h2><button onClick={onBack} className="bg-[#2F80ED] text-white p-5 rounded-full font-black uppercase tracking-widest shadow-xl mt-auto">Send Reset Link</button></div>;
        const PocketDetailsScreen = ({ t, onBack, Icon }) => <div className="p-8 flex flex-col h-full bg-[#F7F9FC] fade-in"><button onClick={onBack} className="mb-10"><Icon name="chevron-left" size={24}/></button><h2 className="text-2xl font-black mb-10">Pocket Details</h2><div className="bg-white p-10 rounded-[40px] shadow-sm border border-slate-100 text-center"><h1 className="text-4xl font-black">฿4,500</h1></div></div>;
        const CreatePocketScreen = ({ t, onBack, onSave, Icon }) => <div className="p-8 flex flex-col h-full bg-[#F7F9FC] fade-in"><button onClick={onBack} className="mb-10"><Icon name="chevron-left" size={24}/></button><h2 className="text-2xl font-black mb-10">{t('createNewPocket')}</h2><button onClick={()=>onSave({name:'New', spent:0, goal:1000})} className="bg-[#2F80ED] text-white p-5 rounded-full font-black uppercase tracking-widest shadow-xl mt-auto">Save Pocket</button></div>;
        const TransactionDetailScreen = ({ t, tx, onBack, navigate, Icon }) => <div className="p-8 flex flex-col h-full bg-[#F7F9FC] fade-in"><button onClick={onBack} className="mb-10"><Icon name="chevron-left" size={24}/></button><h2 className="text-2xl font-black mb-10">Transaction Detail</h2><button onClick={()=>navigate('SPLIT_TRANSACTION')} className="bg-[#2F80ED] text-white p-5 rounded-full font-black uppercase tracking-widest shadow-xl">Split with Friends</button></div>;
        const SplitTransactionScreen = ({ t, onBack, Icon }) => <div className="p-8 flex flex-col h-full bg-[#F7F9FC] fade-in"><button onClick={onBack} className="mb-10"><Icon name="chevron-left" size={24}/></button><h2 className="text-2xl font-black mb-10">Split Bill</h2><button onClick={onBack} className="bg-[#2F80ED] text-white p-5 rounded-full font-black uppercase tracking-widest shadow-xl mt-auto">Confirm Split</button></div>;
        const EditProfileScreen = ({ t, onBack, Icon }) => <div className="p-8 flex flex-col h-full bg-[#F7F9FC] fade-in"><button onClick={onBack} className="mb-10"><Icon name="chevron-left" size={24}/></button><h2 className="text-2xl font-black mb-10">Edit Profile</h2><button onClick={onBack} className="bg-[#2F80ED] text-white p-5 rounded-full font-black uppercase tracking-widest shadow-xl mt-auto">Save Changes</button></div>;
        const NotificationSettingsScreen = ({ t, onBack, Icon }) => <div className="p-8 flex flex-col h-full bg-[#F7F9FC] fade-in"><button onClick={onBack} className="mb-10"><Icon name="chevron-left" size={24}/></button><h2 className="text-2xl font-black mb-10">Notification Settings</h2></div>;
        const NotificationsScreen = ({ t, onBack, Icon }) => <div className="p-8 flex flex-col h-full bg-[#F7F9FC] fade-in"><button onClick={onBack} className="mb-10"><Icon name="chevron-left" size={24}/></button><h2 className="text-2xl font-black mb-10">Notifications</h2></div>;
        const ReceiptDetailScreen = ({ onBack, Icon }) => <div className="p-4 flex flex-col h-full bg-black fade-in"><button onClick={onBack} className="mb-10 text-white"><Icon name="chevron-left" size={24}/></button></div>;

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
